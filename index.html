/* Admin: pick a waiting match to drop onto a specific free court. Lists the
   whole cross-event queue so any waiting match can override the auto pool. */
function renderCourtAssignModal(){
  if (state.assignCourt == null) return "";
  const c = state.assignCourt;
  /* only offer matches whose PLAYERS are free right now (hidden events'
     matches count as busy) AND whose event may use this court; the server
     enforces both, this keeps the picker honest */
  const busyNames = new Set(onCourtMatchesAll().flatMap(m =>
    splitPair(entrantName(m.entrant1_id)).concat(splitPair(entrantName(m.entrant2_id)))));
  const mayUse = m => {
    const ev2 = eventById(m.event_id);
    const a = ev2 && ev2.settings && Array.isArray(ev2.settings.courts) ? ev2.settings.courts : [];
    return !a.length || a.indexOf(c) !== -1;
  };
  const q = pendingQueue().filter(m => mayUse(m) &&
    !splitPair(entrantName(m.entrant1_id)).concat(splitPair(entrantName(m.entrant2_id))).some(p => busyNames.has(p)));
  const multi = activeEvents().length > 1;
  let h = '<div class="overlay" onclick="if(event.target===this)closeCourtAssign()"><div class="modal" role="dialog" aria-modal="true">';
  h += '<h3>Put a match on Court ' + c + '</h3>';
  h += '<div class="sub">Pick a waiting match to send to Court ' + c + ' now.</div>';
  if (!q.length){
    h += '<p class="note">' + (pendingQueue().length
      ? 'Every waiting match still has a player on another court. One will free up shortly.'
      : 'No match is waiting right now.') + '</p>';
  } else {
    h += '<div class="roundblock" style="padding-top:2px">';
    h += q.slice(0, 40).map((m, i) => {
      const ev = eventById(m.event_id);
      return '<button class="queue-row click" onclick="assignToCourt(\'' + m.id + '\', ' + c + ')">' +
        '<span class="qpos">' + (i + 1) + '</span>' +
        '<span class="qnames">' + esc(entrantName(m.entrant1_id)) + ' <span class="qv">vs</span> ' + esc(entrantName(m.entrant2_id)) + '</span>' +
        (multi && ev ? '<span class="qtag">' + esc(ev.name) + '</span>' : '') + '</button>';
    }).join("");
    h += '</div>';
  }
  h += '<div class="actions"><span class="spacer"></span><button class="btn secondary" onclick="closeCourtAssign()">Cancel</button></div>';
  h += '</div></div>';
  return h;
}

/* Admin: pull an on-court match off and choose who comes on, either the next in
   line or a specific waiting match. The pulled match goes to the front of its
   queue either way. */
function renderOffCourtModal(){
  if (!state.offCourtId) return "";
  const m = data.matches.find(x => x.id === state.offCourtId);
  if (!m) return "";
  /* the off match's own players are leaving, so they do not count as busy;
     everyone else is matched by name (hidden events included), the same rule
     the server enforces */
  const busyNames = new Set(onCourtMatchesAll().filter(x => x.id !== m.id).flatMap(x =>
    splitPair(entrantName(x.entrant1_id)).concat(splitPair(entrantName(x.entrant2_id)))));
  const q = pendingQueue().filter(x =>
    !splitPair(entrantName(x.entrant1_id)).concat(splitPair(entrantName(x.entrant2_id))).some(p => busyNames.has(p)));
  const multi = activeEvents().length > 1;
  let h = '<div class="overlay" onclick="if(event.target===this)closeOffCourt()"><div class="modal" role="dialog" aria-modal="true">';
  h += '<h3>Take this match off Court ' + m.court + '</h3>';
  h += '<div class="sub">' + esc(entrantName(m.entrant1_id)) + ' <span class="qv">vs</span> ' + esc(entrantName(m.entrant2_id)) + '</div>';
  if (q.length){
    /* Sending a match back used to always put it at the front of its queue,
       which is rarely what the desk means when a team asks for a few minutes. */
    h += '<div class="field" style="margin:0 0 10px"><label for="off-place">Where do they go back to?</label>' +
      '<select id="off-place"><option value="front">Front of their queue</option>' +
      q.slice(0, 40).map((x, i) => '<option value="' + jsAttr(x.id) + '">' + (i + 1) + '. before ' +
        esc(entrantName(x.entrant1_id)) + ' v ' + esc(entrantName(x.entrant2_id)) + '</option>').join("") +
      '<option value="end">Last in the queue</option></select></div>';
    h += '<p class="note" style="margin:0 0 10px">Who comes on Court ' + m.court + '?</p>';
    h += '<button class="btn" style="width:100%" onclick="swapOut(\'' + m.id + '\')">Bring on the next in line</button>';
    h += '<div class="microlabel" style="margin:14px 0 4px">Or bring on someone specific</div>';
    h += '<div class="roundblock" style="padding-top:2px">';
    h += q.slice(0, 40).map(x => {
      const ev = eventById(x.event_id);
      return '<button class="queue-row click" onclick="swapTo(\'' + m.id + '\', \'' + x.id + '\')">' +
        '<span class="qnames">' + esc(entrantName(x.entrant1_id)) + ' <span class="qv">vs</span> ' + esc(entrantName(x.entrant2_id)) + '</span>' +
        (multi && ev ? '<span class="qtag">' + esc(ev.name) + '</span>' : '') + '</button>';
    }).join("");
    h += '</div>';
  } else {
    h += '<p class="note">Nothing else is waiting for this court. You can still take them off, ' +
      'for instance when one team is here and the other is not: the court goes free and the match waits ' +
      'until you put it back.</p>';
  }
  h += '<button class="btn secondary" style="width:100%;margin-top:8px" onclick="holdMatch(\'' + m.id + '\')">' +
    'Take them off and hold the match</button>';
  h += '<div class="actions"><span class="spacer"></span><button class="btn secondary" onclick="closeOffCourt()">Cancel</button></div>';
  h += '</div></div>';
  return h;
}

let lastAutostartPing = 0;
/* Overlapping reloads (realtime storm + the 3-minute interval + a user
   action) must not let a slower, older fetch overwrite a fresher one: each
   reload takes a generation number and only the newest is allowed to land. */
let loadGen = 0;
async function reload(background){
  const gen = ++loadGen;
  try{
    /* Let scheduled events turn themselves on (an hour and a quarter early,
       unless they have opted out). Any phone's
       refresh can trigger it; once a minute per phone is plenty. */
    if (store.autostartDue && Date.now() - lastAutostartPing > 60000){
      lastAutostartPing = Date.now();
      store.autostartDue().catch(() => {});
    }
    /* A background refresh (realtime/interval) pulls only the running events'
       matches to save egress, then keeps the other events' matches from the
       last full load. Admin actions and the initial load run full. */
    const activeOnly = !!(background && data.tournament) &&
      !(store.takeFullReloadHint && store.takeFullReloadHint());
    let fresh = await store.loadAll(activeOnly);
    if (activeOnly && Array.isArray(data.matches)){
      const was = (data.events || []).filter(e => e.active).map(e => e.id);
      const now = new Set((fresh.events || []).filter(e => e.active).map(e => e.id));
      /* An event that has just been paused drops out of the background fetch,
         so merging would freeze its matches at whatever we last saw and leave
         phones showing courts it no longer holds. Pull everything once instead. */
      if (was.some(id => !now.has(id))) fresh = await store.loadAll(false);
      else fresh.matches = data.matches.filter(m => !now.has(m.event_id)).concat(fresh.matches || []);
    }
    if (gen !== loadGen) return;   /* a newer reload superseded this one */
    data = dropArchived(fresh);
    state.loadError = null;
    maybeBackup();
    if (state.eventId && !eventById(state.eventId)) state.eventId = null;
    if (state.adminEventId && !eventById(state.adminEventId)) state.adminEventId = null;
    /* Drop modal state whose record vanished (deleted on another device),
       otherwise a dead modalMatchId silently blocks the team modal forever. */
    if (state.modalMatchId && !data.matches.some(m => m.id === state.modalMatchId)) state.modalMatchId = null;
    if (state.slotEditId && !data.matches.some(m => m.id === state.slotEditId)) state.slotEditId = null;
    if (state.offCourtId && !data.matches.some(m => m.id === state.offCourtId)) state.offCourtId = null;
    if (state.teamModalId && !data.entrants.some(e => e.id === state.teamModalId)) state.teamModalId = null;
    if (state.adminPin){
      try{
        const rc = await store.adminListContacts(state.adminPin);
        state.contacts = {};
        if (rc.ok && Array.isArray(rc.data)) rc.data.forEach(x => { state.contacts[x.entrant_id] = x.phones || []; });
      }catch(e){}
    }
  }catch(e){
    /* A superseded slow reload that FAILS must not poison the state a newer
       successful one just wrote: the "Trying to reconnect" bar was appearing
       over data that was perfectly fresh. */
    if (gen !== loadGen) return;
    let msg = e.message || String(e);
    if (/does not exist|schema cache/i.test(msg)){
      msg = "The database tables aren't set up yet. Run supabase-schema.sql once in the Supabase SQL editor, then refresh.";
    }
    state.loadError = msg;
  }
  render();
  if (!autoBracketBusy){
    autoBracketBusy = true;
    try{ await maybeAutoBracket(); }catch(e){}
    autoBracketBusy = false;
  }
}
let autoBracketBusy = false;

/* Every device quietly keeps an offline copy of the whole tournament in its
   own browser storage, refreshed each time another 25 matches are recorded.
   If the database is ever wiped or broken, any phone that had the page open
   still holds the last snapshot (Admin has a download button for it). Never
   overwritten by a suddenly emptier database: that is the moment it is for. */
/* Bump this to throw away every device's snapshot at once. A backup lives in
   each phone's own browser storage, so there is no server-side way to clear
   one; stamping the epoch on the way in and refusing to read a snapshot that
   does not carry the current one retires them all without anyone tapping
   anything. Bumped 2026-08-24 (Drew): the stored copies held test rosters and
   test draws from before the real entries went in. */
const BACKUP_EPOCH = "2026-08-24";
/* The only way in. A snapshot from an earlier epoch is deleted rather than
   returned, so nothing downstream has to remember to check. */
function readBackup(){
  let bk = null;
  try{ bk = JSON.parse(safeLocal("pb_backup") || "null"); }catch(_){}
  if (!bk || typeof bk !== "object") return null;
  if (bk.v !== BACKUP_EPOCH){ safeLocal("pb_backup", null); return null; }
  return bk;
}
function maybeBackup(rosterChanged){
  try{
    const played = (data.matches || []).filter(m => m.status === "played").length;
    const prev = readBackup();
    const prevPlayed = (prev && prev.played) || 0;
    /* Archiving events legitimately shrinks the played count (their matches
       leave data entirely), and the wipe guard used to read that as a
       database wipe and freeze the backup for the rest of the tournament.
       An event SET that shrank means archive/delete, not a wipe: start a new
       baseline instead of refusing forever. */
    const evIds = (data.events || []).map(e => e.id).sort();
    const prevEvIds = (prev && prev.eventIds) || null;
    const setShrank = prevEvIds && prevEvIds.some(id => !evIds.includes(id));
    if (played < prevPlayed - 5 && !setShrank) return;   /* looks like a wipe: keep the old copy */
    /* A roster save is worth a snapshot on its own: before any match is
       played the roster IS the tournament, and it lives nowhere else.
       setShrank writes too, and that is the whole point of it: the chunk gate
       below compares against the OLD baseline, so an archived event that took
       40 played matches with it left every later count failing the gate and no
       new baseline ever being written. The snapshot froze for the rest of the
       tournament, which is the opposite of what the guard above intends. */
    if (!rosterChanged && !setShrank){
      if (!played) return;
      if (prev && Math.floor(played / 25) <= Math.floor(prevPlayed / 25)) return;
    }
    safeLocal("pb_backup", JSON.stringify({
      v: BACKUP_EPOCH,
      taken_at: new Date().toISOString(), played, eventIds: evIds,
      tournament: data.tournament && data.tournament.name,
      events: data.events, entrants: data.entrants, matches: data.matches,
      participants: (state.pLoaded && Array.isArray(state.pRows))
        ? state.pRows.filter(r => String(r.name || "").trim())
        : (prev && prev.participants) || null
    }));
  }catch(_){}
}
function downloadBackup(){
  const bk = readBackup();
  if (!bk){ toast("No backup saved on this device yet."); return; }
  const blob = new Blob([JSON.stringify(bk)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nairobi-open-backup.json";
  document.body.appendChild(a); a.click(); a.remove();

    const s2 = parseInt(document.getElementById("score2").value, 10);

      if (!lenient && strict && !confirm(swText(strict) + " " + swText("Save anyway (admin override)?"))) return;
    }

/* Mirror of the server's move: slot the match between its event neighbours by
   play_order midpoint. Applied locally before the round-trip so the row lands
   where it is going the moment the number is entered instead of jumping late. */
function applyLocalMove(matchId, beforeId){
  const m = data.matches.find(x => x.id === matchId);
  if (!m) return;
  const sibs = data.matches
    .filter(x => x.event_id === m.event_id && x.status === "scheduled" && x.id !== m.id)
    .sort((a, b) => a.play_order - b.play_order);
  if (!sibs.length) return;
  if (beforeId == null){ m.play_order = sibs[sibs.length - 1].play_order + 10; m.postponed = false; return; }
  const t = sibs.find(x => x.id === beforeId);
  if (!t) return;
  const prev = sibs.filter(x => x.play_order < t.play_order).pop();
  m.play_order = prev ? (prev.play_order + t.play_order) / 2 : t.play_order - 10;
  m.postponed = false;
}
/* Reorder the queue by typing the place a match should take, using the numbers
   the Up next list shows. A match still only holds a position within its own
   event (the display interleaves events to share courts fairly), so the number
   resolves to "before the next match of its own event at or below that place";
   with one event running, that lands exactly on the number typed. */
/* Where a waiting match should sit, picked from the queue as it actually is
   rather than typed as a number, which meant counting rows on a phone. It
   replaces both the old Move prompt and the Postpone button: sending a match
   to the back is just choosing the last place, and choosing it by name is
   harder to get wrong than remembering what Postpone did. */
function queuePlaceSelect(matchId){
  const q = pendingQueue();
  const cur = q.findIndex(x => x.id === matchId);
  if (cur === -1) return '';
  const mine = q.filter(x => x.event_id === q[cur].event_id);
  if (mine.length < 2)
    return '<span class="qtag">Only one waiting</span>';
  const label = x => entrantName(x.entrant1_id) + " v " + entrantName(x.entrant2_id);
  /* Only the places around this row. Listing the whole queue meant every row
     carried every other row: with one real event drawn and nothing played that
     was tens of thousands of options and seconds of layout per render, on a
     board that re-renders whenever any score lands. */
  const SPAN = 12;
  const lo = Math.max(0, cur - SPAN), hi = Math.min(q.length, cur + SPAN + 1);
  let h = '<select class="mv qplace" onchange="moveQueueTo(\'' + matchId + '\', this.value)">';
  h += '<option value="">Move to…</option>';
  if (lo > 0) h += '<option value="front">1. the very front</option>';
  for(let i = lo; i < hi; i++){
    if (i === cur) continue;
    h += '<option value="' + esc(q[i].id) + '">' + (i + 1) + '. before ' + esc(label(q[i])) + '</option>';
  }
  h += '<option value="end">Last in the queue</option>';
  return h + '</select>';
}
async function moveQueueTo(matchId, choice){
  if (choice === "") return;
  const q = pendingQueue();
  const cur = q.findIndex(x => x.id === matchId);
  if (cur === -1){ toast("That match is not waiting in the queue."); return; }
  const m = q[cur];
  const rest = q.filter(x => x.id !== matchId);
  /* Options carry MATCH IDS, not queue positions. The queue shifts under an
     open picker whenever a score lands and the board re-renders, and a stale
     position silently sent the match somewhere the desk never chose; a stale
     id either still names the same neighbour or is caught right here.
     Ordering is then resolved inside the match's own event, because across
     events the court rotation decides, so the anchor is the first match of
     this event at or after the chosen neighbour. */
  let from;
  if (choice === "end") from = rest.length;
  else if (choice === "front") from = 0;
  else {
    from = rest.findIndex(x => x.id === choice);
    if (from === -1){ toast("That spot in the queue just changed. Pick the place again."); render(); return; }
  }
  const anchor = rest.slice(from).find(x => x.event_id === m.event_id);
  const beforeId = anchor ? anchor.id : null;
  applyLocalMove(matchId, beforeId);
  render();
  const r = await store.adminMoveMatch(state.adminPin, matchId, beforeId);
  if (!r.ok) toast(r.error || "Could not move it.");
  await reload();
}

/* Reads the settings panel. Returns null if something is out of range, so a
   typo in a points target can't be saved: public score entry checks against
   that target, so a stray "210" would quietly block every score in the event. */
function readEventSettings(ev){
  let bad = null;
  const num = (id, dflt, lo, hi, label) => {
    const el = document.getElementById(id);
    if (!el) return dflt;
    const v = parseInt(el.value, 10);
    if (!Number.isInteger(v) || v < lo || v > hi){
      /* Translate the field name here; the sentence around it is a pattern. */
      if (!bad) bad = swText(label) + " has to be between " + lo + " and " + hi + ".";
      return dflt;
    }
    return v;
  };
  const ksEl = document.getElementById("adm-ksize");
  const ks = ksEl ? ksEl.value : String(evSetting(ev, "knockout_size", "auto"));
  const wbEl = document.getElementById("adm-wb2");
  const fpEl = document.getElementById("adm-fromp");
  /* Court override: every box ticked means no restriction (share every court);
     a subset limits the event to those courts. Unticking them all is a mistake
     rather than a setting, since an empty list reads as "no restriction"
     everywhere else, the opposite of what the empty boxes suggest. Preserve the
     saved value when the checkboxes aren't on screen. */
  const courtBoxes = Array.from(document.querySelectorAll(".adm-court"));
  let courts;
  if (!courtBoxes.length){
    courts = Array.isArray(ev.settings && ev.settings.courts) ? ev.settings.courts : [];
  } else {
    const picked = courtBoxes.filter(b => b.checked).map(b => parseInt(b.value, 10));
    if (!picked.length){
      bad = bad || "Tick at least one court. To take this event off court entirely, pause it instead.";
      courts = Array.isArray(ev.settings && ev.settings.courts) ? ev.settings.courts : [];
    } else {
      courts = picked.length >= courtsCount() ? [] : picked.sort((a, b) => a - b);
    }
  }
  /* Only the keys this panel owns. nairobi_admin_update_event merges them into
     whatever is stored, so saving here can't roll back an edit someone else
     made to a different setting on another device. */
  const out = ({
    points_to_group: num("adm-ptg", evSetting(ev, "points_to_group", 15), 5, 51, "Group games to"),
    points_to_knockout: num("adm-ptk", evSetting(ev, "points_to_knockout", 11), 5, 51, "Knockout games to"),
    best_of_group: num("adm-bog", evSetting(ev, "best_of_group", 1), 1, 5, "Group format"),
    best_of_knockout: num("adm-bok", evSetting(ev, "best_of_knockout", 3), 1, 5, "Knockout format"),
    knockout_size: ks === "auto" ? "auto" : parseInt(ks, 10),
    advance_per_group: num("adm-adv", evSetting(ev, "advance_per_group", 2), 1, 4, "Advance per group"),
    group_size: num("adm-gsize", evSetting(ev, "group_size", 6), 3, 32, "Group size"),
    win_by_two: wbEl ? wbEl.checked : !!evSetting(ev, "win_by_two", false),
    from_participants: fpEl ? fpEl.checked : !!evSetting(ev, "from_participants", false),
    courts: courts
  });
  return bad ? { error: bad } : out;
}
/* The sentence under the format fields. Prices the settings currently on
   screen (not the saved ones) and, when the group stage is multi-game, says
   what one game would cost instead: organisers reach for best of 3 without
   seeing that it is most of an extra afternoon. */
/* Built bilingually here rather than through the dictionary: the sentence is
   assembled from too many moving numbers for a text-node pattern to catch. */
function fmtHoursSw(mins){
  const r = Math.round(mins / 15) * 15;
  const h = Math.floor(r / 60), m = r % 60;
  if (!h) return "dakika " + m;
  return "saa " + h + (m ? " dak " + m : "");
}
function estimateText(ev, o){
  const est = eventDurationEstimate(ev, o);
  const sw = state.lang === "sw";
  const hrs = sw ? fmtHoursSw : fmtHours;
  if (!est.matches) return sw
    ? "Weka washiriki na uchore makundi ili kuona makadirio."
    : "Add entrants and draw the groups to see an estimate.";
  const bits = [];
  if (est.group) bits.push(sw ? "mechi " + est.group + " za makundi"
    : est.group + " group match" + (est.group === 1 ? "" : "es"));
  if (est.ko) bits.push(sw ? "mechi " + est.ko + " za mtoano"
    : est.ko + " knockout match" + (est.ko === 1 ? "" : "es"));
  let s = sw
    ? "<b>Jipange kwa kama " + hrs(est.minutes) + "</b> kwenye " +
      (est.courts === 1 ? "uwanja 1" : "viwanja " + est.courts) + ": " + bits.join(" na ") + "."
    : "<b>Plan for about " + fmtHours(est.minutes) + "</b> on " + est.courts +
      " court" + (est.courts === 1 ? "" : "s") + ": " + bits.join(" and ") + ".";
  const bg = o ? o.boGroup : parseInt(evSetting(ev, "best_of_group", 1), 10) || 1;
  if (bg > 1){
    const one = eventDurationEstimate(ev, Object.assign({}, o, { boGroup: 1 }));
    const saved = est.minutes - one.minutes;
    if (saved > 20) s += sw
      ? " Gemu moja katika hatua ya makundi badala yake: kama " +
        hrs(one.minutes) + ", ukiokoa karibu " + hrs(saved) + "."
      : " One game in the group stage instead: about " +
        fmtHours(one.minutes) + ", saving roughly " + fmtHours(saved) + ".";
  }
  /* The turnover and court-occupancy constants behind this used to be printed
     underneath. They are working assumptions, not something an organiser needs
     to read, and spelling them out made the estimate look like arithmetic
     homework. */
  return s;
}

/* Fill the entry rows from a CSV: one entrant per row. Handles Excel's quoted
   cells and comma/semicolon/tab separators. With a header row the columns are
   matched by name, which is the only way to tell a DUPR ID from anything else;
   without one, names come first and 1-8 numbers are ratings. The file only
   fills the boxes for review; drawing the groups is still its own step. */
function entrantsCsvPicked(input){
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  const ev = eventById(state.adminEventId);
  if (!ev) return;
  const reader = new FileReader();
  reader.onload = () => {
    const cells = line => {
      const out = [];
      let cur = "", inQ = false;
      for(let i = 0; i < line.length; i++){
        const ch = line[i];
        if (inQ){
          if (ch === '"' && line[i + 1] === '"'){ cur += '"'; i++; }
          else if (ch === '"') inQ = false;
          else cur += ch;
        }
        else if (ch === '"') inQ = true;
        else if (ch === ',' || ch === ';' || ch === '\t'){ out.push(cur); cur = ""; }
        else cur += ch;
      }
      out.push(cur);
      /* Keep empty cells: the header branch below assigns roles BY POSITION, so
         dropping a blank "DUPR ID" cell slides every later value one column
         left and a player's name ends up as somebody's rating. Only a row that
         is entirely empty is discarded. */
      const t = out.map(c => c.trim());
      return t.some(c => c) ? t : [];
    };
    let rows = String(reader.result).split(/\r\n|\r|\n/).map(cells).filter(cs => cs.length);
    /* Treat the first row as headers only when every cell IS a header phrase:
       one header word, optionally followed by another header word or a number
       ("Player", "Name 1", "Team Name", "DUPR ID 2"). A real team like "Team
       Rocket" has a non-header second word, so it is never eaten. */
    const HEAD = /^(name|player|partner|team|entrant|first|last|dupr|rating|id)s?\s*(name|id|no|number|[0-9]+)?\s*([0-9]+)?$/i;
    const headerish = rows.length > 1 && rows[0].filter(c => c).length &&
      rows[0].filter(c => c).filter(c => HEAD.test(c.trim())).length / rows[0].filter(c => c).length;
    const header = headerish === 1 ? rows.shift() : null;
    /* Half-recognised first rows ("Player Name, DUPR Rating") are the ones that
       quietly enter as a team, so flag them rather than guessing. */
    const maybeHeader = !header && headerish >= 0.5;
    const isRating = c => /^[0-9]+(\.[0-9]+)?$/.test(c) && parseFloat(c) >= 1 && parseFloat(c) <= 8;
    /* Column roles, when the file names them. "DUPR ID" must be tested before
       "DUPR", or every ID column reads as a rating column. */
    const roleOf = h => {
      const t = h.toLowerCase();
      /* "Ids" and "IdNo" are id columns too: \bid\b missed both and their
         DUPR IDs landed in the partner-name field. */
      if (/\bids?\b|duprid|idno/.test(t)) return "id";
      if (/dupr|rating/.test(t)) return "dupr";
      return "name";
    };
    const out = [];
    let extraNames = 0;
    for(const cs of rows){
      const r = blankEntryRow();
      const names = [], duprs = [], ids = [];
      if (header){
        cs.forEach((c, i) => {
          /* keep EMPTY cells too: each role's Nth column is its Nth slot, and
             skipping blanks shifted every later value of that role one player
             left, e.g. a partner-only DUPR ID landing on player 1 (the
             "Brian & 4.41" class, back through this path) */
          const role = i < header.length ? roleOf(header[i]) : "name";
          (role === "id" ? ids : role === "dupr" ? duprs : names).push(c || "");
        });
      } else {
        /* No header to go on. A rating is 1-8; a long run of digits with no
           decimal point is a DUPR ID, not somebody called "9". */
        cs.filter(c => c).forEach(c => {
          if (isRating(c)) duprs.push(c);
          else if (/^[0-9]{4,}$/.test(c)) ids.push(c);
          else names.push(c);
        });
      }
      if (!names.some(n => n && n.trim())) continue;
      if (names.filter(n => n && n.trim()).length > 2) extraNames++;
      r.n1 = names[0] || ""; r.n2 = names[1] || "";
      r.d1 = duprs[0] || "";  r.d2 = duprs[1] || "";
      r.i1 = ids[0] || "";    r.i2 = ids[1] || "";
      out.push(r);
    }
    /* A first/middle/last export has three name columns; dropping the extras
       silently turned "Mary Jane Otieno" into "Mary". Say so. */
    if (extraNames) toast(extraNames + (extraNames === 1 ? " row" : " rows") + " had more than two name columns; only the first two were used. Check those rows.");
    if (!out.length){ toast("No names found in that file."); return; }
    const filled = entryRows().filter(r => String(r.n1 || "").trim() || String(r.n2 || "").trim()).length;
    if (filled && !confirm(swText("Replace the " + filled + " entrants already entered with the " + out.length + " rows from the file?"))) return;
    /* Keep a few spare rows on the end so the next entrant can just be typed. */
    state.entryRows = out.concat(Array.from({ length: ENTRY_CHUNK }, blankEntryRow));
    /* Follow the file in both directions rather than only ever switching on.
       A two-name file loaded into an event called "singles" is a real
       possibility (a "First, Last" export), so say what was assumed. */
    const looksDoubles = out.some(r => r.n2);
    const wasSingles = !entryIsDoubles(ev);
    state.entryDoubles = looksDoubles;
    render();
    toast(out.length + " entrants loaded. Check the rows, then draw." +
      (looksDoubles && wasSingles ? " Two name columns, so these came in as doubles teams." : "") +
      (maybeHeader ? " Row 1 looks like column headings; check it is not sitting in the list as a team." : ""));
  };
  reader.readAsText(f);
}

function normalizePhone(s){
  s = s.trim().replace(/[\s()-]/g, "");
  if (/^0[17]\d{8}$/.test(s)) return "+254" + s.slice(1);
  if (/^254\d{9}$/.test(s)) return "+" + s;
  if (/^\+\d{10,14}$/.test(s)) return s;
  return null;
}

  if (raw == null) return;
  const parts = raw.split(",").map(s => s.trim()).filter(Boolean);
  const phones = [];
  for(const p of parts){
    const n = normalizePhone(p);
    if (!n){ toast('"' + p + '" does not look like a phone number.'); return; }
    phones.push(n);
  }
  const r = await store.adminSetContacts(state.adminPin, id, phones);
  if (!r.ok){ toast(r.error); return; }
  toast(phones.length ? "Numbers saved" : "Numbers removed");

}
async function addTeamToGroup(){
  const ev = eventById(state.adminEventId);
  if (!ev) return;
  const name = document.getElementById("adm-addteam-name").value.trim();
  const group = document.getElementById("adm-addteam-group").value;
  if (!name){ toast("Type a name first."); return; }
  if (data.entrants.some(e => e.event_id === ev.id && e.name === name)){ toast("That name is already entered."); return; }
  const members = data.entrants.filter(e => e.event_id === ev.id && e.group_name === group);
  const maxSeed = Math.max(0, ...members.map(e => e.seed || 0));
  const duprs = ((document.getElementById("adm-addteam-dupr") || {}).value || "").split(/[\s,;\/]+/).map(s => pNum(s)).filter(v => v != null);
  const dids = ((document.getElementById("adm-addteam-did") || {}).value || "").split(/[\s,;\/]+/).map(s => s.trim()).filter(Boolean);
  const meta = {};
  if (duprs.length){ meta.dupr = Math.round(duprs.reduce((a, b) => a + b, 0) / duprs.length * 100) / 100; meta.duprs = duprs; }
  if (dids.length) meta.duprIds = dids;
  const entrant = { id: uid(), event_id: ev.id, name, group_name: group, seed: maxSeed + 1, meta };
  const groupMs = data.matches.filter(m => m.event_id === ev.id && m.stage === "group" && m.group_name === group);
  const startRound = Math.max(0, ...groupMs.map(m => m.round || 0)) + 1;
  const maxOrder = Math.max(0, ...data.matches.filter(m => m.event_id === ev.id).map(m => m.play_order || 0));
  const matches = buildCatchupMatches(ev.id, group, entrant.id, members.map(e => e.id), startRound, maxOrder);
  const r = await store.adminAddEntrant(state.adminPin, ev.id, entrant, matches);
  if (!r.ok){ toast(r.error); return; }
  toast(name + " added to Group " + group);
  await reload();
}
/* ---------- entrant entry grid ----------
   Rows live in state, never only in the DOM: the admin panel re-renders
   whenever anything changes anywhere, and typing into a box you cannot see
   the bottom of is exactly when a score lands on another phone. */
const ENTRY_CHUNK = 5;
function blankEntryRow(){ return { n1: "", d1: "", i1: "", n2: "", d2: "", i2: "" }; }
function clearEntry(){ state.entryRows = null; state.entryDoubles = null; }
function entryRows(){
  if (!Array.isArray(state.entryRows) || !state.entryRows.length)
    state.entryRows = Array.from({ length: ENTRY_CHUNK }, blankEntryRow);
  return state.entryRows;
}
/* Doubles unless the event calls itself singles; the organiser can override
   and that choice sticks for as long as the draw block is open. */
function entryIsDoubles(ev){
  if (state.entryDoubles != null) return state.entryDoubles;
  return !(ev && /singles/i.test(ev.name));
}
/* render() defers while focus sits in an admin field, and a <select> keeps
   focus after its change event, so without the blur the grid went on showing
   doubles boxes after Singles was chosen and the draw dropped every player 2. */
function blurThenRender(){
  const a = document.activeElement;
  if (a && a.blur) try{ a.blur(); }catch(e){}
  render();
}
function setEntryDoubles(v){ state.entryDoubles = !!v; blurThenRender(); }
function setEntryCell(i, key, val){
  const rows = entryRows();
  if (!rows[i]) return;
  rows[i][key] = val;
  updateDrawSummary();
}
function addEntryRows(){
  entryRows().push(...Array.from({ length: ENTRY_CHUNK }, blankEntryRow));
  blurThenRender();
}
function clearEntryRow(i){
  const rows = entryRows();
  if (!rows[i]) return;
  rows[i] = blankEntryRow();
  blurThenRender();
}
const cleanNum = s => { const v = parseFloat(String(s).trim()); return Number.isFinite(v) && v >= 1 && v <= 8 ? v : null; };
/* One entry per filled row. A row counts as filled when it has any name at
   all, so a half-typed doubles pair is still visible in the summary rather
   than silently dropped; blank rows are simply ignored. */
function parseEntryRows(ev){
  const dbl = entryIsDoubles(ev);
  return entryRows().map(r => {
    const names = [String(r.n1 || "").trim(), dbl ? String(r.n2 || "").trim() : ""].filter(Boolean);
    if (!names.length) return null;
    /* POSITIONAL, never compacted: slot 0 is always player 1 and slot 1 is
       always player 2. Filtering the empties shifted a partner-only DUPR ID
       into player 1's slot and it rode all the way into the results CSV that
       goes to DUPR, crediting matches to the wrong human. */
    const duprSlots = [cleanNum(r.d1), dbl ? cleanNum(r.d2) : null];
    const idSlots = [String(r.i1 || "").trim(), dbl ? String(r.i2 || "").trim() : ""];
    const rated = duprSlots.filter(v => v != null);
    const dupr = rated.length ? Math.round(rated.reduce((a, b) => a + b, 0) / rated.length * 100) / 100 : null;
    return { name: names.join(" & "), duprs: duprSlots, dupr, duprIds: idSlots, partial: dbl && names.length < 2 };
  }).filter(Boolean);
}
function renderEntryGrid(ev){

    '<select id="entry-format" onchange="setEntryDoubles(this.value===\'d\')">' +
    '<option value="d"' + (dbl ? ' selected' : '') + '>Doubles teams</option>' +
    '<option value="s"' + (dbl ? '' : ' selected') + '>Single players</option></select></div></div>';
  h += '<div class="egrid">';

/* ---------- players: the roster, in public ----------
   The same people as the Participants tab, minus the PIN and minus every
   column that carries a gender or a DUPR id. It gets its own store call rather
   than filtering the desk's rows, because what is publishable is decided in
   the database: nothing on this side can widen it by accident, and a column
   added to the table later cannot ride along. */
async function loadPublicPlayers(){
  if (state.pubBusy) return;
  state.pubBusy = true;
  try{
    const r = await store.publicParticipants();
    if (r && r.ok){
      state.pubRows = (r.data || [])
        .map(x => ({ id: x.id, name: String(x.name || "").trim(), entries: x.entries || {} }))
        .filter(x => x.name);
      state.pubLoaded = true;
      state.pubError = null;
    } else if (!state.pubLoaded){
      /* To somebody checking whether they are entered, an empty roster and a
         failed call look exactly alike. Say which it was. */
      state.pubError = (r && r.error) || "Could not load the players.";
    }
  } catch(e){
    if (!state.pubLoaded) state.pubError = "Could not load the players.";
  } finally { state.pubBusy = false; }
}
function togglePlayer(id){ state.pubOpen = state.pubOpen === id ? null : id; render(); }
let plSearchT = null;
function setPlayerSearch(v){ state.pubSearch = v; clearTimeout(plSearchT); plSearchT = setTimeout(render, 150); }

/* What one person is entered in. The event's real name comes from the board
   rather than the roster, so a renamed event reads correctly here; an entry
   whose event has since been deleted is dropped rather than rendered as a bare
   id, and hidden and archived ones never arrive in the first place. */
function playerEntries(pl){
  const byId = {};
  publicEvents().forEach(e => { byId[e.id] = e; });
  return Object.keys(pl.entries || {})
    .map(id => ({ ev: byId[id], partner: String((pl.entries[id] || {}).partner || "").trim() }))
    .filter(x => x.ev)
    .sort((a, b) => (a.ev.sort_order || 0) - (b.ev.sort_order || 0) ||
      String(a.ev.name).localeCompare(String(b.ev.name)));
}

function renderPlayers(){
  let h = '<span class="print-title">' + esc(data.tournament.name) + ' · Players</span>';
  h += '<section class="card"><h2>Players</h2>' +
    '<p class="note">Everyone entered in the tournament. Tap a name to see what they are playing.</p>';

  if (!state.pubLoaded)
    return h + '<div class="empty">' + (state.pubError ? esc(swText(state.pubError)) : 'Loading…') + '</div></section>';

  /* Display order only. Sorting the list by name decides nothing competitive,
     which is the one thing a name is never allowed to decide here. */
  const rows = (state.pubRows || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  if (!rows.length)
    return h + '<div class="empty">Nobody is entered yet.</div></section>';

  const term = String(state.pubSearch || "").trim().toLowerCase();
  const shown = term ? rows.filter(x => x.name.toLowerCase().indexOf(term) >= 0) : rows;

  h += '<input class="psearch" id="pl-search" type="text" placeholder="Search names" value="' +
    esc(state.pubSearch || "") + '" oninput="setPlayerSearch(this.value)">';
  h += '<p class="note" style="margin:8px 0 2px">' + rows.length + ' ' +
    (rows.length === 1 ? 'player' : 'players') + (term ? ' · ' + shown.length + ' shown' : '') + '</p>';

  if (!shown.length){
    h += '<div class="empty">No name matches that.</div>';
  } else {
    h += '<div class="plist">';
    shown.forEach(pl => {
      const evs = playerEntries(pl);

        '<button aria-expanded="' + open + '" onclick="togglePlayer(\'' + jsAttr(pl.id) + '\')">' +
        '<span class="pchev">' + (open ? '▼' : '▶') + '</span>' +
        '<span>' + esc(pl.name) + '</span>' +
        '<span class="pcount">' + evs.length + ' ' + (evs.length === 1 ? 'event' : 'events') + '</span></button>';
      if (open){

  }
  h += '</section>';

/* ---------- participants ----------
   The desk's roster of people. An entrant is whatever plays a given event, and
   in doubles that is a pair; a participant is a human, so their ratings and
   DUPR id are entered once and follow them into every event they tick.
   Everything lives in state and is written back into the markup on each render,
   which is what keeps a background score from wiping half a typed roster. */
const P_CHUNK = 5;
function blankParticipant(){ return { id: null, name: "", gender: "", ds: "", dd: "", did: "", entries: {} }; }
function pRows(){
  if (!Array.isArray(state.pRows) || !state.pRows.length)
    state.pRows = Array.from({ length: P_CHUNK }, blankParticipant);
  return state.pRows;
}
/* Only events that say they take entries this way get a tick column, so the
   roster does not sprout thirteen of them. The tick is on the event's own
   admin panel. */
/* Hidden means hidden from players, not from the desk: an event is usually
   still hidden while its roster is being built, so this list deliberately
   ignores that flag and only asks whether the event takes its entries here. */
function participantEvents(){
  return data.events.filter(e => e.settings && e.settings.from_participants)
    .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
}
async function loadParticipants(force){
  if (!state.adminPin) return;

  const r = await store.adminListParticipants(state.adminPin);
  if (!r.ok){ toast(r.error || "Could not load the participants."); return; }
  const rows = (r.data || []).map(p => ({

function setPCell(i, key, val){
  const rows = pRows();
  if (!rows[i]) return;
  /* Naming a blank row (or blanking a named one) changes what the row can do:
     its tick boxes enable or disable. render() defers while the box is
     focused, so this lands the moment the desk leaves the field rather than
     ripping the keyboard away mid-name. */
  if (key === "name" && !!String(rows[i].name || "").trim() !== !!String(val || "").trim())
    setTimeout(render, 0);
  /* A rename has to follow the person into every partner box pointing at them,
     or the pair quietly stops counting. */
  if (key === "name"){
    const was = String(rows[i].name || "").trim();
    if (was && was !== String(val || "").trim()){
      rows.forEach(r => {
        if (r === rows[i] || !r.entries) return;
        Object.keys(r.entries).forEach(evId => {
          if (String(r.entries[evId].partner || "").trim().toLowerCase() === was.toLowerCase())
            r.entries[evId] = Object.assign({}, r.entries[evId], { partner: val });
        });
      });
    }
  }

}

function setPEntry(i, evId, on){

     somebody who is no longer in it. */
  if (!on) setPPartnerRaw(rows, i, evId, "");
  const entries = Object.assign({}, rows[i].entries);
  if (on) entries[evId] = entries[evId] || { partner: "" };
  else delete entries[evId];
  rows[i].entries = entries;

/* The reciprocal clear, without the re-render setPPartner does. */
function setPPartnerRaw(rows, i, evId, val){
  const me = rows[i];
  if (!me || !me.entries || !me.entries[evId]) return;
  const was = String(me.entries[evId].partner || "").trim();
  if (was){
    const other = rows.find(r => r !== me && String(r.name || "").trim().toLowerCase() === was.toLowerCase()
                              && r.entries && r.entries[evId]);
    if (other) other.entries[evId] = Object.assign({}, other.entries[evId], { partner: val });
  }
  me.entries[evId] = Object.assign({}, me.entries[evId], { partner: val });
}
/* Picking a partner sets it on both people at once, and frees whoever either
   of them was previously down with. Typing the name by hand was the whole
   source of "these two do not name each other": one side gets updated, the
   other keeps pointing somewhere else, and the pair silently does not count. */
function setPPartner(i, evId, name){
  const rows = pRows();
  const me = rows[i];
  if (!me || !me.entries[evId]) return;
  const key = n => String(n || "").trim().toLowerCase();
  const partnerOf = r => (r && r.entries && r.entries[evId]) ? String(r.entries[evId].partner || "").trim() : "";
  const setP = (r, v) => { if (r && r.entries && r.entries[evId])
    r.entries[evId] = Object.assign({}, r.entries[evId], { partner: v }); };
  const find = n => rows.find(r => r !== me && key(r.name) === key(n) && r.entries && r.entries[evId]);

  /* Whoever I was with is now free. */
  const old = find(partnerOf(me));
  if (old) setP(old, "");

  if (!String(name || "").trim()){ setP(me, ""); }
  else {
    const them = find(name);
    if (!them){ setP(me, ""); }
    else {
      /* And whoever they were with is free too. */
      const theirs = find(partnerOf(them));
      if (theirs && theirs !== me) setP(theirs, "");
      setP(me, them.name);
      setP(them, me.name);
    }
  }

  blurThenRender();
}

function clearPRow(i){

      !confirm(swText('Remove "' + r.name + '" from the participants list?'))) return;
  /* Free their partners first, so nobody is left pointing at a person who no
     longer exists (the rename path already follows people; delete was the one
     path that did not). */

/* Singles or doubles is read off the event name, the same test the entry grid
   uses, so a "Singles" division never asks anyone for a partner. */
const evIsDoubles = ev => !/singles/i.test((ev && ev.name) || "");
/* Ticks and partner names make pairs. Both halves have to be ticked for the
   same event and name each other, otherwise the desk is told exactly who is
   unmatched rather than the seeding quietly guessing. A singles event skips
   all of that: every ticked person is simply in. */
function participantPairs(ev){
  const rows = parseParticipants().filter(p => p.entries && p.entries[ev.id]);
  if (!evIsDoubles(ev))
    return { pairs: rows.map(p => [p]), problems: [], ticked: rows.length, singles: true };
  const byName = new Map(rows.map(p => [p.name.toLowerCase(), p]));
  const pairs = [], seen = new Set(), problems = [];
  rows.forEach(p => {
    if (seen.has(p.name.toLowerCase())) return;
    const wanted = String((p.entries[ev.id] || {}).partner || "").trim();
    if (!wanted){ problems.push(p.name + " has no partner"); return; }
    const q = byName.get(wanted.toLowerCase());
    if (!q){ problems.push(p.name + "'s partner “" + wanted + "” is not ticked for this event"); return; }
    const back = String((q.entries[ev.id] || {}).partner || "").trim();
    if (back.toLowerCase() !== p.name.toLowerCase()){
      problems.push(p.name + " and " + q.name + " do not name each other");
      return;
    }
    seen.add(p.name.toLowerCase()); seen.add(q.name.toLowerCase());
    pairs.push([p, q]);
  });
  return { pairs, problems, ticked: rows.length };
}

  const groups = sizes.length;
  const matchCount = sizes.reduce((sum, n) => sum + n * (n - 1) / 2, 0);
  let lines = names.length + " entrants into " + groups + " groups (" + sizes.join(", ") + ")\n" +
    matchCount + " group matches";
  if (s.knockout_size === "auto"){
    const base = groups * s.advance_per_group;
    const size = nextPow2(Math.max(2, base));
    lines += "\nTop " + s.advance_per_group + " per group = " + base + " qualifiers; bracket of " + size +
      (size > base ? " adds " + (size - base) + " best next-placed" : "");
  } else {
    const size = s.knockout_size;
    const full = Math.floor(size / groups);
    const fill = size - full * groups;
    lines += "\nKnockout of " + size + ": top " + full + " per group" + (fill ? " plus " + fill + " best " + ordinal(full + 1) + "-placed" : "");
  }
  if (useDupr){
    const rated = entries.filter(e => e.dupr != null).length;

  const entrants = [];
  groups.forEach(g => g.members.forEach((name, i) =>
    entrants.push({ id: uid(), event_id: ev.id, name, group_name: g.name, seed: i + 1,
                    meta: entrantMetaFor(byName.get(name)) })));
  const idsByGroup = g => entrants.filter(e => e.group_name === g).map(e => e.id);
  const matches = buildEventMatches(ev.id, groups.map(g => ({ name: g.name, entrantIds: idsByGroup(g.name) })), 0);
  const r = await store.adminReplaceEvent(state.adminPin, ev.id, { name: ev.name, sort_order: ev.sort_order, settings }, entrants, matches, !!(played || onCourt));
  if (!r.ok){ toast(r.error); return; }
  state.setupPreview = null;
  state.showRedraw = false;
  clearEntry();
  gClear();
  toast("Groups drawn. Pick courts and start when ready.");
  await reload();
}
async function confirmGroupStage(){
  /* Seed from a fresh pull, not the cached picture: a score entered on
     another phone seconds ago must be in the standings the bracket uses. */
  await reload();
  const ev = eventById(state.adminEventId);
  if (!ev) return;
  const groups = groupsOfEvent(ev);
  if (!groups.length){ toast("This event has no groups yet."); return; }
  const left = data.matches.filter(m => m.event_id === ev.id && m.stage === "group" && m.status === "scheduled").length;
  const hadKo = data.matches.some(m => m.event_id === ev.id && m.stage === "knockout");
  const ties = unresolvedTiesAtCut(ev);
  if (ties.length){
    /* The standings only flag a tie once a group has finished, so this can be
       the first the desk hears of it. Unlock the warning blocks on the way
       through, or the panel it lands on has no Draw lots button. */
    state.tiesForced = true;
    toast(ties.map(t => "Group " + t.group + ": " + t.names.join(", ")).join(" · ") +
      " are level on every tiebreaker. Draw lots first.");
    state.view = "admin";
    render();
    return;
  }
  const sTies = seedTiesFor(ev);
  if (sTies.length){
    state.tiesForced = true;
    toast(sTies.map(t => ordinal(t.place) + " places: " + t.names.join(", ")).join(" · ") +
      " are level on everything that decides seeding. Draw lots first.");
    state.view = "admin";
    render();
    return;
  }
  const wcTie = wildcardTieFor(ev);
  if (wcTie && !confirm(swText("A wildcard place is tied between " + wcTie.names.join(", ") +
      " on every cross-group measure; the pick will be alphabetical. Seed the bracket anyway? Edit teams can fix it after."))) return;
  const msg = (left ? left + " group matches are still unplayed. " : "") +
    (hadKo ? "Rebuild the bracket from current standings? Knockout scores are wiped." :
      "Confirm the group stage is finished and create the knockout bracket?");
  if (!confirm(swText(msg))) return;
  const field = seedFieldFor(ev);
  if (field.seeds.length < 2){ toast("Not enough qualifiers yet."); return; }
  const maxOrder = Math.max(0, ...data.matches.filter(m => m.event_id === ev.id).map(m => m.play_order || 0));
  const rows = buildBracket(ev.id, field.seeds, maxOrder);
  const r = await store.adminGenerateBracket(state.adminPin, ev.id, rows);
  if (!r.ok){ toast(r.error); return; }
  autoBracketTried.delete(ev.id);
  if (evSetting(ev, "no_autobracket", false))
    await store.adminUpdateEvent(state.adminPin, ev.id, ev.name, { no_autobracket: false });
  toast("Bracket created");
  state.view = "bracket"; state.eventId = ev.id;
  await reload();
}
/* The bracket used to wait for someone to press "Finish group stage", which
   meant the last group result sat there doing nothing while players asked who
   they had drawn. Once every group match of an event is played and no bracket
   exists yet, the desk seeds it by itself.
   Only an unlocked admin device does this, and it re-reads before writing, so
   a second desk phone finding the bracket already there simply stops. Each
   event is attempted once per session: a failure must not become a loop. */
const autoBracketTried = new Set();
async function maybeAutoBracket(){
  if (!state.adminPin) return;
  for(const ev of data.events){
    if (autoBracketTried.has(ev.id) || isAmericano(ev)) continue;
    if (evSetting(ev, "no_autobracket", false)) continue;   /* the desk sent it back to the group stage */
    const ms = data.matches.filter(m => m.event_id === ev.id);
    const group = ms.filter(m => m.stage === "group");
    if (!group.length || ms.some(m => m.stage === "knockout")) continue;
    if (group.some(m => m.status !== "played")) continue;
    if (!groupsOfEvent(ev).length) continue;
    if (unresolvedTiesAtCut(ev).length || wildcardTieFor(ev) || seedTiesFor(ev).length) continue;   /* wait for the desk to settle the tie */
    if (seedFieldFor(ev).seeds.length < 2) continue;
    await reload();
    /* Re-check everything against the fresh pull, not just some of it: another
       desk phone may have seeded it, a correction may have reopened a group
       match, and a correction can also CREATE a tie that has to be drawn. */
    const fresh = eventById(ev.id);
    if (!fresh || evSetting(fresh, "no_autobracket", false)) continue;
    const freshMs = data.matches.filter(m => m.event_id === ev.id);
    if (freshMs.some(m => m.stage === "knockout")) continue;
    if (freshMs.filter(m => m.stage === "group").some(m => m.status !== "played")) continue;
    if (unresolvedTiesAtCut(fresh).length || wildcardTieFor(fresh) || seedTiesFor(fresh).length) continue;
    const field = seedFieldFor(fresh);
    if (field.seeds.length < 2) continue;
    const maxOrder = Math.max(0, ...freshMs.map(m => m.play_order || 0));
    const r = await store.adminGenerateBracket(state.adminPin, ev.id, buildBracket(ev.id, field.seeds, maxOrder));
    /* Only now is it "tried": marking it before the write meant one dropped
       request left the event with no bracket and no message, for good. */
    if (!r.ok){ toast(r.error || "Could not draw the bracket for " + ev.name + "."); continue; }
    autoBracketTried.add(ev.id);
    toast("Group stage finished. Bracket drawn for " + ev.name + ".");
    await reload();
  }
}
async function resetBracket(){
  const ev = eventById(state.adminEventId);
  if (!ev) return;
  if (!confirm(swText("Remove the knockout bracket and its scores for this event?"))) return;
  /* Deliberate removal, so the auto-draw must not put it straight back. It has
     to be recorded on the event, not in this page's memory: another desk phone
     reloads within seconds and would re-seed it. */
  autoBracketTried.add(ev.id);
  const r = await store.adminResetBracket(state.adminPin, ev.id);
  if (!r.ok){ toast(r.error); return; }
  /* The server now arms no_autobracket itself; this write is belt and braces
     for older deployments, and a failure must be SEEN, not shrugged off: an
     unarmed flag means another phone re-seeds the bracket within seconds. */
  const rf = await store.adminUpdateEvent(state.adminPin, ev.id, ev.name, { no_autobracket: true });
  if (!rf.ok) toast(rf.error || "Could not switch the auto-draw off; the bracket may redraw itself.");
  toast("Back to group stage");
  await reload();
}
function csvCell(v){
  v = String(v == null ? "" : v);
  /* A name starting with = + - or @ is a formula to Excel and Sheets, so
     prefix it before quoting. */
  if (/^[=+\-@]/.test(v)) v = "'" + v;
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
/* Results export: one row per played match, team names split into players,
   per-game score column pairs. Copies cleanly into DUPR's club CSV template. */
function downloadResults(allEvents){
  const evs = allEvents
    ? data.events.slice().sort((a, b) => a.sort_order - b.sort_order || String(a.name).localeCompare(String(b.name)) || String(a.id).localeCompare(String(b.id)))
    : [eventById(state.adminEventId)].filter(Boolean);
  const played = [];
  evs.forEach(ev => {
    data.matches
      .filter(m => m.event_id === ev.id && m.status === "played" && m.score1 != null)
      .sort((a, b) => (a.stage === b.stage ? a.play_order - b.play_order : a.stage === "group" ? -1 : 1))
      .forEach(m => played.push([ev, m]));
  });
  if (!played.length){ toast("No played matches to export yet."); return; }
  const maxGames = Math.max(1, ...played.map(([, m]) => Array.isArray(m.games) ? m.games.length : 1));
  const head = ["Event", "Stage", "Date", "Format",
    "Team 1 Player A", "Team 1 Player B", "Team 2 Player A", "Team 2 Player B",
    /* DUPR identifies people by ID, which is the whole reason the entry grid
       collects one per player; without these columns they were collected and
       never used. */
    "Team 1 Player A DUPR ID", "Team 1 Player B DUPR ID",
    "Team 2 Player A DUPR ID", "Team 2 Player B DUPR ID"];
  for(let g = 1; g <= maxGames; g++) head.push("Game " + g + " Team 1", "Game " + g + " Team 2");
  head.push("Winner", "Notes");
  const lines = [head.map(csvCell).join(",")];
  /* Doubles teams are stored as one free-text name, so the export can only
     split them on the documented " & ". Anything else lands as a single player
     and would import into DUPR as the wrong person, so those rows get called
     out rather than silently mangled. */
  const unsplit = [];
  played.forEach(([ev, m]) => {
    const split = id => {
      const name = entrantName(id) || "";
      const parts = name.split(" & ");
      /* a singles entrant has no " & " by design; only doubles rows are wrong */
      if (parts.length < 2 && name && evIsDoubles(ev)) unsplit.push(name);
      return [parts[0] || "", parts.slice(1).join(" & ") || ""];
    };
    const [a1, a2] = split(m.entrant1_id), [b1, b2] = split(m.entrant2_id);
    /* Ids sit in the same order the names were entered, so they line up with
       the split above. */
    const idsOf = id => { const e = entrantById(id); const v = (e && e.meta && e.meta.duprIds) || []; return [v[0] || "", v[1] || ""]; };
    const [ia1, ia2] = idsOf(m.entrant1_id), [ib1, ib2] = idsOf(m.entrant2_id);
    const d = m.updated_at ? new Date(m.updated_at) : null;
    const pad = n => String(n).padStart(2, "0");
    const date = d && !isNaN(d) ? pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + "/" + d.getFullYear() : "";
    const row = [ev.name, m.stage === "group" ? "Group " + (m.group_name || "") : koLabel(m), date,
      a2 || b2 ? "Doubles" : "Singles", a1, a2, b1, b2, ia1, ia2, ib1, ib2];
    /* A walkover has no real games: score1/score2 are a placeholder, and in a
       best-of event they are games won, not points. Leave the columns empty so
       nothing imports as a played result. */
    const games = m.walkover ? [] : (Array.isArray(m.games) && m.games.length ? m.games : [[m.score1, m.score2]]);
    for(let g = 0; g < maxGames; g++) row.push(games[g] ? games[g][0] : "", games[g] ? games[g][1] : "");
    row.push(entrantName(m.score1 > m.score2 ? m.entrant1_id : m.entrant2_id) || "",
             m.walkover ? "Walkover" : m.retired ? "Retired: " + (entrantName(m.retired) || "") : "");
    lines.push(row.map(csvCell).join(","));
  });
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (allEvents ? "nairobi-open-results-all" : "nairobi-open-results-" +
    (evs[0] ? evs[0].name.toLowerCase().replace(/[^a-z0-9]+/g, "-") : "event")) + ".csv";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  const odd = [...new Set(unsplit)];
  if (odd.length){
    toast("CSV downloaded: " + (lines.length - 1) + " matches. " + odd.length +
      " name" + (odd.length > 1 ? "s" : "") + " had no \" & \" to split on (" +
      odd.slice(0, 3).join(", ") + (odd.length > 3 ? ", …" : "") +
      "), so they exported as singles. Fix them before importing to DUPR.");
  } else {
    toast("CSV downloaded: " + (lines.length - 1) + " matches");
  }
}
async function doChangePin(){
  const oldEl = document.getElementById("adm-oldpin");
  const newEl = document.getElementById("adm-newpin");
  const msg = document.getElementById("adm-pinmsg");
  /* A toast is easy to miss on a busy desk phone, and "nothing happened" is
     exactly how a failed PIN change reads. Say it in the panel as well. */
  const say = (t, bad) => {
    toast(swText(t));
    if (msg){ msg.textContent = swText(t); msg.style.color = bad ? "var(--danger)" : "var(--court)"; msg.style.fontWeight = "700"; }
  };
  if (!oldEl || !newEl){ say("The PIN boxes are not on screen. Reload the page and try again.", true); return; }
  const oldPin = oldEl.value.trim();
  const newPin = newEl.value.trim();
  if (!oldPin){ say("Type the current PIN first.", true); return; }
  if (newPin.length < 4){ say("New PIN needs at least 4 characters.", true); return; }
  if (oldPin === newPin){ say("That is already the PIN.", true); return; }
  const r = await store.changePin(oldPin, newPin);
  if (!r.ok){ say(r.error || "Could not change the PIN.", true); return; }
  state.adminPin = newPin;
  safeSession("pb_admin_pin", newPin);
  /* Clear the boxes and forget what admRestore captured, or the next render
     paints the old values straight back in and it looks like nothing took. */
  oldEl.value = ""; newEl.value = "";
  if (admShown.vals){ delete admShown.vals["adm-oldpin"]; delete admShown.vals["adm-newpin"]; }
  say("PIN changed. Other phones stay unlocked until their tab is closed.", false);
}

/* ---------- init ---------- */
(async function init(){
  state.dismissedCalled = loadDismissedCalled();
  const savedDiv = safeSession("pb_division");
  if (savedDiv) state.division = savedDiv;
  /* Paint before the first fetch, so a slow connection shows "Loading…"
     rather than a blank page that reads as a broken link. */
  render();
  const savedPin = safeSession("pb_admin_pin");
  if (savedPin){
    const r = await store.verifyPin(savedPin).catch(() => ({ ok: false }));
    /* Forget the saved PIN only when the server says it is wrong. A throttled
       window, or a flaky connection at the venue, used to look identical to a
       bad PIN here and would have quietly signed out every admin phone that
       reloaded while it was shut. */
    if (r.ok) state.adminPin = savedPin;
    else if (r.wrongPin) safeSession("pb_admin_pin", null);
  }
  store.subscribe(() => reload(true));
  await reload();
  /* Refresh so "go to court" banners expire on time, without stomping on forms. */
  setInterval(() => {
    const ae = document.activeElement;
    const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
    if (!document.hidden && !typing && !state.modalMatchId && !state.slotEditId && !state.teamModalId &&
        !state.offCourtId && state.assignCourt == null && state.view !== "admin") render();
  }, 45000);
  window.__APP_READY = true;
})();
</script>
