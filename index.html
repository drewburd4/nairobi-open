      : Array.from({ length: 8 }, (_, k) => pool[2 * k] + " & " + pool[2 * k + 1]);
    allOther = allOther.concat(buildFor(ev, names));
  }

  /* Play strictly in queue order. The doubles group stage is fully played so
     the knockout flow can be tested end to end (confirm bracket, KO scores).
     Singles stops mid round 4 to show a live group stage. */
  const playInOrder = (rows, count, pts) => {
    rows.slice().sort((a, b) => a.play_order - b.play_order).slice(0, count).forEach(m => {
      const s1 = skills[m.entrant1_id], s2 = skills[m.entrant2_id];
      const p1 = s1 / (s1 + s2);
      const oneWins = rand() < p1;
      const spread = Math.abs(s1 - s2);
      /* pts - 2, not pts - 1: win-by-2 is on by default now, so a mock that
         generated 15-14 would be showing the offline demo a score the app
         itself refuses. */
      const loserPts = Math.max(2, Math.min(pts - 2, Math.round((pts - 2) * (1 - spread) * (0.55 + rand() * 0.5))));
      m.score1 = oneWins ? pts : loserPts;
      m.score2 = oneWins ? loserPts : pts;
      m.status = "played";
    });
  };
  playInOrder(matchesD, matchesD.length, 15);
  playInOrder(matchesS, 20, 15);

  /* The people behind those entrants, so the offline demo has a Players tab
     worth looking at. Doubles names split on the documented " & ", singles
     stand alone, and everyone carries the events they were entered in. */
  const participants = (function(){
    const byName = new Map();
    const person = name => {
      const key = String(name).trim();
      if (!byName.has(key))
        byName.set(key, { id: "pp" + (byName.size + 1), name: key, gender: "",
          dupr_singles: null, dupr_doubles: null, dupr_id: "", entries: {},
          sort_order: byName.size, updated_at: "2026-01-01T00:00:00.000Z" });
      return byName.get(key);
    };
    entrants.forEach(e => {
      const parts = String(e.name).split(" & ").map(x => x.trim()).filter(Boolean);
      if (parts.length === 2){
        const a = person(parts[0]), b = person(parts[1]);
        a.entries[e.event_id] = { partner: b.name };
        b.entries[e.event_id] = { partner: a.name };
      } else if (parts.length === 1){
        person(parts[0]).entries[e.event_id] = { partner: "" };
      }
    });
    return Array.from(byName.values());
  })();

  const db = { tournament, events, entrants, matches: matchesD.concat(matchesS, allOther), participants };

  const pendingS = matchesS.filter(m => m.status === "scheduled")
    .sort((a, b) => a.play_order - b.play_order);
  if (pendingS.length > 4){
    const target = pendingS[1];
    target.postponed = true;
    target.play_order = pendingS[Math.min(8, pendingS.length - 1)].play_order + 1;
  }

  assignCourtsGlobal(db);
  return db;
}
/*__LOGIC_END__*/
</script>

<script>
/* ================= STORES =================
   Both stores expose the same interface, so the UI never needs to know
   whether it is talking to sample data or to Supabase. */

function demoStore(){
  const db = buildMockData();
  /* Offline sample data only, never a live tournament, so this is printed on
     the demo banner. Deliberately not a real PIN: nothing in this repo should
     be usable against a real database. */
  const PIN = "1234";
  const subs = [];
  const notify = () => subs.forEach(f => { try{ f(); }catch(e){} });
  const ok = () => ({ ok: true });
  const fail = msg => ({ ok: false, error: msg });
  const findMatch = id => db.matches.find(m => m.id === id);
  const eventOf = m => db.events.find(e => e.id === m.event_id);
  /* Busy test by PLAYER NAME, mirroring the SQL: a person entered in two
     events has an entrant row in each, so an id test never fires for them. */
  const pNames = id => { const e = db.entrants.find(x => x.id === id); return String((e && e.name) || "").split(" & ").map(s => s.trim()).filter(Boolean); };
  const sharesBusyPlayer = (e1, e2, excludeMatchId) => {
    const mine = pNames(e1).concat(pNames(e2));
    return db.matches.some(x => x.status === "scheduled" && x.court != null && x.id !== excludeMatchId &&
      pNames(x.entrant1_id).concat(pNames(x.entrant2_id)).some(p => mine.includes(p)));
  };
  const settingFor = (m, base) => {
    const ev = eventOf(m);
    const key = base + (m.stage === "knockout" ? "_knockout" : "_group");
    return (ev && ev.settings && ev.settings[key]) || (base === "points_to" ? 21 : 1);
  };
  const checkPin = pin => pin === PIN;

  function advanceWinner(m, oldW){
    if (m.status !== "played" || m.score1 == null || m.score2 == null) return;
    const w = m.score1 > m.score2 ? m.entrant1_id : m.entrant2_id;
    const l = m.score1 > m.score2 ? m.entrant2_id : m.entrant1_id;
    /* Whoever the old winner was, the old loser was the other team. */
    const oldL = oldW == null ? null
      : (oldW === m.entrant1_id ? m.entrant2_id : oldW === m.entrant2_id ? m.entrant1_id : null);
    /* Respect a manual bracket edit: only overwrite the slot when it is
       empty, already this team, or still holds this feeder's old result. */
    const push = (id, slot, team, was) => {
      if (!id || team == null) return;
      const nm = findMatch(id);
      if (!nm || nm.status !== "scheduled") return;
      const cur = slot === 1 ? nm.entrant1_id : nm.entrant2_id;
      if (cur == null || cur === team || (was != null && cur === was)){
        if (slot === 1) nm.entrant1_id = team; else nm.entrant2_id = team;
      }
    };
    push(m.next_match_id, m.next_slot, w, oldW);
    /* And the loser sideways, which only the third place match asks for. */
    push(m.loser_match_id, m.loser_slot, l, oldL);
  }

  /* Mirrors nairobi_score_text / nairobi_log_score so the offline build shows
     the same history the live one does. */
  function scoreText(m){
    if (!m || m.status !== "played" || m.score1 == null) return null;
    /* winner's name on purpose, mirroring the SQL: flipping a walkover to the
       other team must read as a change or the log's dedupe skips the line */
    if (m.walkover){
      const wId = m.score1 > m.score2 ? m.entrant1_id : m.entrant2_id;
      const we = db.entrants.find(x => x.id === wId);
      return "walkover · " + ((we && we.name) || "?");
    }
    if (Array.isArray(m.games) && m.games.length) return m.games.map(g => g[0] + "-" + g[1]).join(", ");
    return m.score1 + "-" + m.score2;
  }
  function logScore(matchId, action, from, to, byDesk){
    if (from === to) return;
    db.log = db.log || [];
    db.log.push({ id: uid(), match_id: matchId, at: new Date().toISOString(),
                  action, from_text: from, to_text: to, by_desk: !!byDesk });
  }
  function applyScore(m, s1, s2, games, isAdmin, walkover){
    const pts = settingFor(m, "points_to");
    const bo = settingFor(m, "best_of");
    const ev = eventOf(m);
    const wb2 = m.stage === "knockout" || !!(ev && ev.settings && ev.settings.win_by_two);
    if (walkover){
      m.score1 = s1; m.score2 = s2; m.games = null;
    } else if (bo > 1){
      const v = validateGames(games || [], pts, isAdmin, bo, wb2);
      if (v.error) return v.error;
      m.score1 = v.w1; m.score2 = v.w2; m.games = games;
    } else {
      const err = validateScore(s1, s2, pts, isAdmin, wb2, dbIsAmericano(ev) ? pts : null);
      if (err) return err;
      m.score1 = s1; m.score2 = s2; m.games = null;
    }
    m.status = "played"; m.postponed = false; m.court = null; m.held = false;
    m.walkover = !!walkover; m.retired = null;
    return null;
  }
  /* Mirror of nairobi_admin_retire: completed games stand, the game in progress
     is finished for the opponent, and the opponent takes the match. */
  function applyRetire(m, retireeId, s1, s2, games){
    if (retireeId !== m.entrant1_id && retireeId !== m.entrant2_id) return "Say which team retired.";
    const winSlot = retireeId === m.entrant1_id ? 2 : 1;
    const pts = settingFor(m, "points_to"), bo = settingFor(m, "best_of");
    if (bo > 1){
      const g = (games || []).map(x => [parseInt(x[0], 10), parseInt(x[1], 10)]);
      if (!g.length) return "Enter the games that were played before the retirement.";
      if (g.length > bo) return "Best of " + bo + ": that is too many games.";
      if (g.some(x => !Number.isInteger(x[0]) || !Number.isInteger(x[1]) || x[0] < 0 || x[1] < 0))
        return "Enter both scores as whole numbers.";
      const w1 = g.filter(x => x[0] > x[1]).length, w2 = g.filter(x => x[1] > x[0]).length;
      const need = Math.floor(bo / 2) + 1;
      if (winSlot === 1){ m.score1 = Math.max(w1, need); m.score2 = Math.min(w2, m.score1 - 1); }
      else { m.score2 = Math.max(w2, need); m.score1 = Math.min(w1, m.score2 - 1); }
      m.games = g;
    } else {
      if (!Number.isInteger(s1) || !Number.isInteger(s2) || s1 < 0 || s2 < 0)
        return "Enter the score as it stood when they retired.";
      m.score1 = s1; m.score2 = s2; m.games = null;
      if (winSlot === 1 && m.score1 <= m.score2) m.score1 = m.score2 + 1;
      if (winSlot === 2 && m.score2 <= m.score1) m.score2 = m.score1 + 1;
    }
    m.status = "played"; m.postponed = false; m.court = null; m.held = false;
    m.walkover = false; m.retired = retireeId;
    return null;
  }

  /* Mirror of nairobi_autostart_due: an admin-set start time flips the event
     on an hour and a quarter early, once, and only if the event has not
     opted out. Manual Start/Pause consumes the flag, so a
     deliberately paused event stays paused; saving a new start time re-arms. */
  function autostartDue(){
    let hit = false;
    for(const e of db.events){
      const s = e.settings || {};
      if (e.active || s.autostarted || !s.start_time) continue;
      const t = new Date(s.start_time).getTime();
      if (isNaN(t)) continue;
      if (t <= Date.now() + 5 * 60000 && t > Date.now() - 12 * 3600000 &&
          db.matches.some(m => m.event_id === e.id)){
        e.active = true; s.autostarted = true; e.settings = s; hit = true;
      }
    }
    if (hit) assignCourtsGlobal(db);
  }

  return {
    mode: "demo",
    demoPin: PIN,
    subscribe(f){ subs.push(f); },
    async loadAll(activeOnly){
      autostartDue();
      const snap = JSON.parse(JSON.stringify(db));
      snap.log = snap.log || [];
      if (activeOnly){
        const ids = new Set(snap.events.filter(e => e.active).map(e => e.id));
        snap.matches = snap.matches.filter(m => ids.has(m.event_id));
      }
      return snap;
    },
    async verifyPin(pin){ return checkPin(pin) ? ok() : Object.assign(fail("Wrong PIN."), { wrongPin: true }); },
    async changePin(){ return fail("PIN changes only work on the live site."); },
    async submitScore(matchId, s1, s2, games){
      const m = findMatch(matchId);
      if (!m) return fail("Match not found.");
      if (m.status === "played") return fail("A score is already in. Ask the desk to change it.");
      if (!m.entrant1_id || !m.entrant2_id) return fail("Teams for this match aren't decided yet.");
      if (m.court == null) return fail("This match isn't on a court yet. The score is entered from the Courts tab once it's called; corrections go through the desk.");
      if ((db.tournament.settings || {}).player_scores === false)
        return fail("The desk is entering all scores today. Please report your result at the desk.");
      /* Mirrors the server: more public entries in five minutes than there are
         courts is nobody finishing a match. */
      const cap = Math.max(4, (db.tournament.settings || {}).courts || 4);
      const since = Date.now() - 5 * 60 * 1000;
      if ((db.log || []).filter(l => !l.by_desk && l.action === "score" && new Date(l.at).getTime() > since).length >= cap)
        return fail("That is more scores than the courts can have finished. Wait a few minutes or ask the desk to enter it.");
      const was = scoreText(m);
      const err = applyScore(m, s1, s2, games, false, false);
      if (err) return fail(err);
      logScore(m.id, "score", was, scoreText(m), false);
      advanceWinner(m);
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminSubmitScore(pin, matchId, s1, s2, games, walkover, hadScore){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const m = findMatch(matchId);
      if (!m) return fail("Match not found.");
      if (!m.entrant1_id || !m.entrant2_id) return fail("Teams for this match aren't decided yet.");
      /* The saving screen believed the match was unscored, but a score has
         landed meanwhile: refuse rather than silently overwrite it. */
      if (hadScore === false && m.status === "played")
        return fail("A score just came in for this match; close and reopen it before changing anything.");
      /* A retirement is a recorded outcome, not a normal score: the stored
         games are partial, so a blind re-save would re-derive the winner from
         them and can flip the match to the player who retired. */
      if (m.retired)
        return fail("This match ended by retirement. Clear the score first if it needs changing.");
      const bo = settingFor(m, "best_of");
      let newW;
      if (walkover){
        if (!Number.isInteger(s1) || !Number.isInteger(s2) || s1 === s2) return fail("Bad walkover score.");
        newW = s1 > s2 ? m.entrant1_id : m.entrant2_id;
      } else if (bo > 1){
        const v = validateGames(games || [], settingFor(m, "points_to"), true, bo);
        if (v.error) return fail(v.error);
        newW = v.w1 > v.w2 ? m.entrant1_id : m.entrant2_id;
      } else {
        const err = validateScore(s1, s2, settingFor(m, "points_to"), true);
        if (err) return fail(err);
        newW = s1 > s2 ? m.entrant1_id : m.entrant2_id;
      }
      if (m.next_match_id){
        const nm = findMatch(m.next_match_id);
        /* Refuse only when the played next round actually used a different
           team in this feeder's slot: a manually pre-filled and played later
           round with the same winner must not block scoring the feeder. */
        if (nm && nm.status === "played" &&
            (m.next_slot === 1 ? nm.entrant1_id : nm.entrant2_id) !== newW)
          return fail("The next round already has a score. Clear it first.");
      }
      const oldW = m.status === "played" ? (m.score1 > m.score2 ? m.entrant1_id : m.entrant2_id) : null;
      const was = scoreText(m);
      applyScore(m, s1, s2, games, true, walkover);
      logScore(m.id, walkover ? "walkover" : "score", was, scoreText(m), true);
      advanceWinner(m, oldW);
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminRetire(pin, matchId, retireeId, s1, s2, games){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const m = findMatch(matchId);
      if (!m) return fail("Match not found.");
      if (!m.entrant1_id || !m.entrant2_id) return fail("Teams for this match aren't decided yet.");
      if (m.retired)
        return fail("This match ended by retirement. Clear the score first if it needs changing.");
      if (m.status === "played")
        return fail("This match already has a score. Clear it first if it actually ended by retirement.");
      const oldW = m.status === "played" ? (m.score1 > m.score2 ? m.entrant1_id : m.entrant2_id) : null;
      const was = scoreText(m);
      const err = applyRetire(m, retireeId, s1, s2, games);
      if (err) return fail(err);
      logScore(m.id, "retire", was, scoreText(m), true);
      advanceWinner(m, oldW);
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminClearScore(pin, matchId){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const m = findMatch(matchId);
      if (!m) return fail("Match not found.");
      const played = m.status === "played" && m.score1 != null;
      const won  = played ? (m.score1 > m.score2 ? m.entrant1_id : m.entrant2_id) : null;
      const lost = played ? (m.score1 > m.score2 ? m.entrant2_id : m.entrant1_id) : null;
      const nm = m.next_match_id ? findMatch(m.next_match_id) : null;
      const lm = m.loser_match_id ? findMatch(m.loser_match_id) : null;
      if (nm && nm.status === "played") return fail("The next round already has a score. Clear it first.");
      if (lm && lm.status === "played") return fail("The third place match already has a score. Clear it first.");
      /* Only pull back this feeder's own result; a manually substituted team in
         either slot stays put. */
      const pull = (target, slot, team) => {
        if (!target || team == null) return;
        if (slot === 1){ if (target.entrant1_id === team) target.entrant1_id = null; }
        else if (target.entrant2_id === team) target.entrant2_id = null;
      };
      pull(nm, m.next_slot, won);
      pull(lm, m.loser_slot, lost);
      const was = scoreText(m);
      m.score1 = null; m.score2 = null; m.games = null; m.walkover = false; m.retired = null;
      m.status = "scheduled"; m.court = null; m.held = false;
      logScore(m.id, "clear", was, null, true);
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminPostpone(pin, matchId, toEnd){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const m = findMatch(matchId);
      if (!m) return fail("Match not found.");
      if (m.status !== "scheduled") return fail("That match already has a score.");
      const pending = db.matches
        .filter(x => x.event_id === m.event_id && x.status === "scheduled" && x.id !== m.id)
        .sort((a, b) => a.play_order - b.play_order);
      if (toEnd){
        m.play_order = (pending.length ? pending[pending.length - 1].play_order : m.play_order) + 10;
      } else {
        /* Mirror the SQL exactly: land midway between the 8th and 9th match
           behind this one (a flat +1 slowly eats the gaps until two matches
           share a position), else to the back. */
        const after = pending.filter(x => x.play_order > m.play_order);
        const a8 = after[7], a9 = after[8];
        if (a8) m.play_order = (a8.play_order + (a9 ? a9.play_order : a8.play_order + 20)) / 2;
        else m.play_order = (pending.length ? pending[pending.length - 1].play_order : m.play_order) + 10;
      }
      m.postponed = true; m.court = null;
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminPlayNext(pin, matchId){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const m = findMatch(matchId);
      if (!m) return fail("Match not found.");
      if (m.status !== "scheduled") return fail("That match already has a score.");
      const pending = db.matches.filter(x => x.event_id === m.event_id && x.status === "scheduled" && x.id !== m.id);
      m.play_order = (pending.length ? Math.min(...pending.map(x => x.play_order)) : m.play_order) - 1;
      m.postponed = false; m.held = false;
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminSwapOut(pin, matchId){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const m = findMatch(matchId);
      if (!m) return fail("Match not found.");
      if (m.status !== "scheduled" || m.court == null) return fail("That match is not on a court.");
      if (dbIsAmericano(eventOf(m))) return fail("Americano rounds rotate on their own; enter the score or pause the event instead.");
      /* Same gate as court assignment: never bring on a PERSON who is already
         mid-game on another main court. By player name, mirroring the SQL. */
      const busyNow = new Set();
      db.matches.forEach(x => {
        if (x.status === "scheduled" && x.court != null && x.id !== m.id && !dbIsAmericano(eventOf(x))){
          pNames(x.entrant1_id).forEach(p => busyNow.add(p));
          pNames(x.entrant2_id).forEach(p => busyNow.add(p));
        }
      });
      /* Also honour the replacement event's court restriction, the way the SQL
         does: without it the demo brought a court-3-only event onto court 1. */
      const allowedFor = x => {
        const e = eventOf(x);
        const a = e && e.settings && Array.isArray(e.settings.courts) ? e.settings.courts : [];
        return !a.length || a.indexOf(m.court) !== -1;
      };
      const repl = weavePending(db).find(x =>
        !pNames(x.entrant1_id).concat(pNames(x.entrant2_id)).some(p => busyNow.has(p)) && allowedFor(x));
      if (!repl) return fail("No other match is waiting, so it stays on court.");
      repl.court = m.court; repl.postponed = false; repl.held = false;
      repl.called_at = new Date().toISOString(); repl.called_ack = false;
      const pending = db.matches.filter(x => x.event_id === m.event_id && x.status === "scheduled" && x.court == null && x.id !== m.id);
      m.court = null; m.called_at = null; m.called_ack = false; m.postponed = false;
      m.play_order = (pending.length ? Math.min(...pending.map(x => x.play_order)) : m.play_order) - 1;
      notify(); return ok();
    },
    async adminAckCalled(pin, matchId){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const m = findMatch(matchId);
      if (!m) return fail("Match not found.");
      m.called_ack = true;
      notify(); return ok();
    },
    async adminAssignCourt(pin, matchId, court){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const m = findMatch(matchId);
      if (!m) return fail("Match not found.");
      if (m.status !== "scheduled" || m.court != null) return fail("That match is not waiting for a court.");
      if (!m.entrant1_id || !m.entrant2_id) return fail("This match's teams aren't set yet.");
      if (sharesBusyPlayer(m.entrant1_id, m.entrant2_id, m.id))
        return fail("That team is already mid-game on another court.");
      const total = (db.tournament && db.tournament.settings && db.tournament.settings.courts) || 4;
      if (!(court >= 1 && court <= total)) return fail("No such court.");
      if (db.matches.some(x => x.status === "scheduled" && x.court === court)) return fail("Court " + court + " was just filled. Pick another.");
      m.court = court; m.postponed = false;
      m.called_at = new Date().toISOString(); m.called_ack = false;
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    /* Move a waiting match so it sits directly before beforeId in its own
       event's queue, or last if beforeId is null. Mirrors the SQL function:
       play_order is numeric, so slotting between two neighbours is just their
       midpoint and no other row has to be renumbered. */
    async adminMoveMatch(pin, matchId, beforeId){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const m = findMatch(matchId);
      if (!m) return fail("Match not found.");
      if (m.status !== "scheduled" || m.court != null) return fail("That match is not waiting in the queue.");
      /* Every scheduled match of the event, on court or not: matches already on
         a court still hold play_order values, so skipping them would let the
         new position land exactly on one. */
      const sibs = db.matches
        .filter(x => x.event_id === m.event_id && x.status === "scheduled" && x.id !== m.id)
        .sort((a, b) => a.play_order - b.play_order);
      if (!sibs.length) return ok();
      if (beforeId == null){
        m.play_order = sibs[sibs.length - 1].play_order + 10;
      } else {
        const t = findMatch(beforeId);
        if (!t || t.event_id !== m.event_id) return fail("Move it within its own event.");
        if (t.status !== "scheduled" || t.court != null) return fail("That spot is gone; try again.");
        const prev = sibs.filter(x => x.play_order < t.play_order).pop();
        m.play_order = prev ? (prev.play_order + t.play_order) / 2 : t.play_order - 10;
      }
      /* moving a match is a re-queue: it is no longer "postponed" */
      m.postponed = false; m.held = false;
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminSwapTo(pin, offId, onId){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      if (offId === onId) return fail("Pick a different match.");
      const offm = findMatch(offId), onm = findMatch(onId);
      if (!offm) return fail("Match not found.");
      if (offm.status !== "scheduled" || offm.court == null) return fail("That match is not on a court.");
      if (!onm) return fail("The match to bring on was not found.");
      if (onm.status !== "scheduled" || onm.court != null) return fail("That match is not waiting for a court.");
      if (!onm.entrant1_id || !onm.entrant2_id) return fail("That match's teams aren't set yet.");
      if (dbIsAmericano(eventOf(offm)) || dbIsAmericano(eventOf(onm)))
        return fail("Americano rounds rotate on their own; enter the score or pause the event instead.");
      /* never call a PERSON who is mid-game on another court (the off match's
         own players are the ones leaving, so it does not count) */
      if (sharesBusyPlayer(onm.entrant1_id, onm.entrant2_id, offm.id))
        return fail("That team is already mid-game on another court.");
      const c = offm.court;
      onm.court = c; onm.postponed = false; onm.called_at = new Date().toISOString(); onm.called_ack = false;
      const pending = db.matches.filter(x => x.event_id === offm.event_id && x.status === "scheduled" && x.court == null && x.id !== offm.id);
      offm.court = null; offm.called_at = null; offm.called_ack = false; offm.postponed = false;
      offm.play_order = (pending.length ? Math.min(...pending.map(x => x.play_order)) : offm.play_order) - 1;
      notify(); return ok();
    },
    async adminUpdateEvent(pin, eventId, name, settings){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const ev = db.events.find(e => e.id === eventId);
      if (!ev) return fail("Event not found.");
      /* Merge, matching the SQL: callers send only the keys they changed. */
      ev.name = name; ev.settings = Object.assign({}, ev.settings, settings || {});
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminSetActive(pin, eventId, active){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const ev = db.events.find(e => e.id === eventId);
      if (!ev) return fail("Event not found.");
      if (active && !db.matches.some(m => m.event_id === eventId)) return fail("Draw groups first, then start the event.");
      ev.active = active;
      /* A manual start or pause consumes the pending auto-start. */
      ev.settings = Object.assign({}, ev.settings, { autostarted: true });
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminSetEntrantMeta(pin, entrantId, meta){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const e = db.entrants.find(x => x.id === entrantId);
      if (!e) return fail("Team not found.");
      e.meta = meta || {};
      notify(); return ok();
    },
    async adminHold(pin, matchId, held){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const m = findMatch(matchId);
      if (!m) return fail("Match not found.");
      if (m.status === "played") return fail("That match already has a score.");
      m.held = !!held;
      if (held){ m.court = null; m.called_at = null; m.called_ack = false; }
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminSetActiveMany(pin, eventIds, active){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const evs = db.events.filter(e => eventIds.indexOf(e.id) !== -1);
      if (!evs.length) return fail("Event not found.");
      if (active && evs.some(e => !db.matches.some(m => m.event_id === e.id)))
        return fail("Draw groups first, then start the event.");
      evs.forEach(e => {
        e.active = active;
        e.settings = Object.assign({}, e.settings, { autostarted: true });
      });
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminSetPlayerScores(pin, on){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      db.tournament.settings = Object.assign({}, db.tournament.settings, { player_scores: !!on });
      notify(); return ok();
    },
    async adminSetFinalsSunday(pin, on){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      db.tournament.settings = Object.assign({}, db.tournament.settings, { finals_sunday: !!on });
      notify(); return ok();
    },
    async adminDeleteEvent(pin, eventId){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const ev = db.events.find(e => e.id === eventId);
      if (!ev) return fail("Event not found.");
      db.matches = db.matches.filter(m => m.event_id !== eventId);
      db.entrants = db.entrants.filter(e => e.event_id !== eventId);
      db.events = db.events.filter(e => e.id !== eventId);
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminReplaceEvent(pin, eventId, meta, entrants, matches, force){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      let ev = eventId ? db.events.find(e => e.id === eventId) : null;
      if (!ev){
        ev = { id: uid(), tournament_id: db.tournament.id, name: meta.name, sort_order: db.events.length,
          stage: "group", active: false, settings: meta.settings };
        db.events.push(ev);
      } else {
        /* A rebuild deletes every match of the division, results included, and
           the score history goes with them. Only a draw the desk explicitly
           confirmed over played or on-court matches may do that. */
        if (!force && db.matches.some(x => x.event_id === ev.id && (x.status === "played" || x.court != null)))
          return fail("This event has played or on-court matches, so the redraw was not applied.");
        ev.name = meta.name; ev.settings = meta.settings; ev.stage = "group"; ev.active = false;
      }
      db.entrants = db.entrants.filter(e => e.event_id !== ev.id);
      db.matches = db.matches.filter(m => m.event_id !== ev.id);
      entrants.forEach(e => db.entrants.push(Object.assign({}, e, { event_id: ev.id })));
      matches.forEach(m => db.matches.push(Object.assign({}, m, { event_id: ev.id, court: null })));
      assignCourtsGlobal(db);
      notify(); return { ok: true, eventId: ev.id };
    },
    async adminRenameEntrant(pin, entrantId, name){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const e = db.entrants.find(x => x.id === entrantId);
      if (!e) return fail("Team not found.");
      e.name = name;
      notify(); return ok();
    },
    async adminRemoveEntrant(pin, entrantId){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const e = db.entrants.find(x => x.id === entrantId);
      if (!e) return fail("Team not found.");
      if (db.matches.some(m => m.stage === "knockout" && (m.entrant1_id === entrantId || m.entrant2_id === entrantId)))
        return fail("They're in the knockout bracket. Edit the bracket or reset it first.");
      if (db.matches.some(m => (m.entrant1_id === entrantId || m.entrant2_id === entrantId) && m.status === "scheduled" && m.court != null))
        return fail("That team's match is on a court right now. Score it or take it off court first.");
      db.matches = db.matches.filter(m => !(m.entrant1_id === entrantId || m.entrant2_id === entrantId));
      db.entrants = db.entrants.filter(x => x.id !== entrantId);
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminAddEntrant(pin, eventId, entrant, matches){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      if (!db.events.some(e => e.id === eventId)) return fail("Event not found.");
      db.entrants.push(Object.assign({}, entrant, { event_id: eventId }));
      matches.forEach(m => db.matches.push(Object.assign({}, m, { event_id: eventId, court: null })));
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminMoveEntrant(pin, entrantId, newGroup, matches){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const e = db.entrants.find(x => x.id === entrantId);
      if (!e) return fail("Team not found.");
      if (db.matches.some(m => m.stage === "knockout" && (m.entrant1_id === entrantId || m.entrant2_id === entrantId)))
        return fail("They're in the knockout bracket. Edit the bracket or reset it first.");
      if (db.matches.some(m => (m.entrant1_id === entrantId || m.entrant2_id === entrantId) && m.status === "scheduled" && m.court != null))
        return fail("That team's match is on a court right now. Score it or take it off court first.");
      db.matches = db.matches.filter(m => !(m.stage === "group" && (m.entrant1_id === entrantId || m.entrant2_id === entrantId)));
      e.group_name = newGroup;
      matches.forEach(m => db.matches.push(Object.assign({}, m, { event_id: e.event_id, court: null })));
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminSetContacts(){ return fail("Phone numbers only work on the live site."); },
    async adminListContacts(){ return { ok: true, data: [] }; },
    async publicParticipants(){
      /* The same three columns the SQL function publishes, and no more: names,
         which non-hidden events each person is in, and the partner. */
      const vis = new Set((db.events || []).filter(e => !isHidden(e) && !isArchived(e)).map(e => e.id));
      return { ok: true, data: (db.participants || []).map(p => {
        const out = {};
        Object.keys(p.entries || {}).forEach(k => {
          if (vis.has(k)) out[k] = { partner: String((p.entries[k] || {}).partner || "") };
        });
        return { id: p.id, name: p.name, entries: out };
      }) };
    },
    async adminListParticipants(pin){
      /* A stale PIN must say so: an ok-but-empty answer reads as a deleted
         roster and arms a save that would make it true. Deep copy on the way
         out, so unsaved UI edits can never alias into the "saved" store. */
      if (!checkPin(pin)) return fail("Wrong PIN.");
      return { ok: true, data: JSON.parse(JSON.stringify(db.participants || [])) };
    },
    async adminSaveParticipants(pin, rows, seen){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      if (!Array.isArray(rows)) return fail("Nothing to save.");
      const named = JSON.parse(JSON.stringify(rows.filter(r => String(r.name || "").trim())))
        .map(r => Object.assign(r, { id: r.id || uid(), name: String(r.name).trim(),
          updated_at: new Date().toISOString() }));
      if (!named.length) return fail("The roster cannot be saved empty. Add at least one person first.");
      /* Mirrors the SQL: a row this save leaves out is deleted only when this
         desk had seen its latest version; anyone saved on another phone after
         `seen` survives, so two desks merge instead of deleting each other's
         people. */
      const keep = new Set(named.map(r => r.id));
      const survivors = (db.participants || []).filter(p =>
        !keep.has(p.id) && seen != null && String(p.updated_at || "") > String(seen));
      db.participants = survivors.concat(named);
      notify(); return ok();
    },
    async adminSetBracketTeams(pin, matchId, e1, e2){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const m = findMatch(matchId);
      if (!m) return fail("Match not found.");
      if (m.stage !== "knockout") return fail("Only knockout matches can be edited here.");
      if (m.status === "played") return fail("This match already has a score. Clear it first.");
      m.entrant1_id = e1 || null; m.entrant2_id = e2 || null;
      /* a match with an emptied slot cannot be played: free its court */
      if (!m.entrant1_id || !m.entrant2_id){ m.court = null; m.called_at = null; m.called_ack = false; }
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminGenerateBracket(pin, eventId, rows){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const ev = db.events.find(e => e.id === eventId);
      if (!ev) return fail("Event not found.");
      db.matches = db.matches.filter(m => !(m.event_id === eventId && m.stage === "knockout"));
      rows.forEach(m => db.matches.push(Object.assign({}, m, { event_id: eventId })));
      ev.stage = "knockout";
      assignCourtsGlobal(db);
      notify(); return ok();
    },
    async adminResetBracket(pin, eventId){
      if (!checkPin(pin)) return fail("Wrong PIN.");
      const ev = db.events.find(e => e.id === eventId);
      if (!ev) return fail("Event not found.");
      db.matches = db.matches.filter(m => !(m.event_id === eventId && m.stage === "knockout"));
      ev.stage = "group";
      /* mirrors the SQL: a deliberate reset arms no_autobracket on the event
         itself, so another phone's auto-draw cannot put the bracket back */
      ev.settings = Object.assign({}, ev.settings, { no_autobracket: true });
      assignCourtsGlobal(db);
      notify(); return ok();
    }
  };
}

function liveStore(){
  let client = null;
  const subs = [];
  let needFullReload = false;
  const notify = () => subs.forEach(f => { try{ f(); }catch(e){} });
  let debounceT = null;
  /* Reload live data only when the tab is actually being looked at, and let a
     burst of changes coalesce into one reload, to keep egress down. A
     backgrounded tab catches up the instant it returns to the foreground (see
     the visibilitychange handler below), so "you're up" still lands on time. */
  const debouncedNotify = () => {
    clearTimeout(debounceT);
    debounceT = setTimeout(() => { if (document.visibilityState === "visible") notify(); }, 1500);
  };

  function loadScript(src){
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = () => rej(new Error("Could not load " + src));
      document.head.appendChild(s);
    });
  }

  let clientPromise = null;
  async function ensureClient(){
    /* Memoize the PROMISE, not the client: two concurrent callers during boot
       both saw `client` still null and each built a client with its own
       realtime subscription and its own 3-minute poll, doubling every
       phone's egress against the shared free-tier cap. */
    if (clientPromise) return clientPromise;
    clientPromise = buildClient();
    return clientPromise;
  }
  async function buildClient(){
    await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js");
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    /* Subscribe per table: the shared project also holds the Dispatch app's
       tables, and their changes shouldn't trigger reloads here. */
    client.channel("nairobi-db-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "nairobi_tournaments" }, debouncedNotify)
      .on("postgres_changes", { event: "*", schema: "public", table: "nairobi_events" }, debouncedNotify)
      .on("postgres_changes", { event: "*", schema: "public", table: "nairobi_entrants" }, debouncedNotify)
      .on("postgres_changes", { event: "*", schema: "public", table: "nairobi_matches" }, p => {
        /* A change to a PAUSED event's match (a Thursday correction made on
           Friday) never shows up in the active-only background refresh, so
           flag the next reload to pull everything. */
        try{
          const eid = p && ((p.new && p.new.event_id) || (p.old && p.old.event_id));
          if (eid && data && data.events && !data.events.some(e => e.id === eid && e.active)) needFullReload = true;
          /* A DELETE payload carries only the row's id (replica identity), so
             eid is null and the paused-event test above can never fire: pull
             everything, or a match deleted on a paused event lives forever on
             the other phones. */
          if (p && p.eventType === "DELETE" && !eid) needFullReload = true;
        }catch(_){}
        debouncedNotify();
      })
      /* A correction has to reach the other phones as fast as the score did. */
      .on("postgres_changes", { event: "*", schema: "public", table: "nairobi_match_log" }, debouncedNotify)
      .subscribe();
    setInterval(() => { if (document.visibilityState === "visible") notify(); }, 180000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") notify(); });
    return client;
  }

  const rpc = async (fn, args) => {
    try{
      const c = await ensureClient();
      const { data, error } = await c.rpc(fn, args);
      if (error) return { ok: false, error: error.message };
      if (typeof data === "string" && data !== "OK" && !data.startsWith("OK")) return { ok: false, error: data };
      return { ok: true, data };
    }catch(e){ return { ok: false, error: e.message || "Network error." }; }
  };

  return {
    mode: "live",
    subscribe(f){ subs.push(f); },
    takeFullReloadHint(){ const v = needFullReload; needFullReload = false; return v; },
    async loadAll(activeOnly){
      const c = await ensureClient();
      const [t, ev, en] = await Promise.all([
        /* Never select "*" here: row level security is per row, not per column,
           so the public read policy would hand admin_pin_hash to every visitor,
           and a 4 digit PIN behind a readable hash cracks offline in no time. */
        c.from("nairobi_tournaments").select("id,name,settings,created_at").limit(1),
        c.from("nairobi_events").select("*").order("sort_order").order("id"),
        c.from("nairobi_entrants").select("*").order("group_name").order("seed")
      ]);
      /* Background refreshes pull matches only for the running events (the bulk
         of the payload); the rest are merged back in from the last full load in
         reload(). Tables other than matches stay small, so fetch them in full. */
      let ma;
      if (activeOnly){
        const ids = (ev.data || []).filter(e => e.active).map(e => e.id);
        ma = ids.length
          ? await c.from("nairobi_matches").select("*").in("event_id", ids).order("play_order")
          : { data: [], error: null };
      } else {
        ma = await c.from("nairobi_matches").select("*").order("play_order");
      }
      /* One row per score write, so this stays tiny next to the matches. */
      const lg = await c.from("nairobi_match_log").select("*").order("at");
      const err = t.error || ev.error || en.error || ma.error || lg.error;
      if (err) throw new Error(err.message);
      return { tournament: (t.data && t.data[0]) || null, events: ev.data || [], entrants: en.data || [],
               matches: ma.data || [], log: lg.data || [] };
    },
    /* nairobi_unlock, not nairobi_verify_pin: the throttled entry point, and
       the only PIN check anon can reach. Too many wrong PINs in a short window
       and it refuses everything for a few minutes, which is why the message
       says so rather than insisting the PIN is wrong. */
    verifyPin: pin => rpc("nairobi_unlock", { p_pin: pin }).then(r =>
      r.ok ? { ok: true }
        /* wrongPin only when the server actually said so. A throttle, or a
           dropped connection, must not convince a phone to forget a PIN that
           was right: the restore path signs itself out on that flag. */
        : { ok: false, error: r.error || "Could not check the PIN.",
            wrongPin: r.error === "Wrong PIN." }),
    changePin: (oldPin, newPin) => rpc("nairobi_change_admin_pin", { p_old: oldPin, p_new: newPin }),
    submitScore: (id, s1, s2, games) => rpc("nairobi_submit_score", { p_match_id: id, p_score1: s1, p_score2: s2, p_games: games || null }),
    adminSubmitScore: (pin, id, s1, s2, games, walkover, hadScore) => rpc("nairobi_admin_submit_score", { p_pin: pin, p_match_id: id, p_score1: s1, p_score2: s2, p_games: games || null, p_walkover: !!walkover, p_had_score: hadScore == null ? null : !!hadScore }),
    adminClearScore: (pin, id) => rpc("nairobi_admin_clear_score", { p_pin: pin, p_match_id: id }),
    adminRetire: (pin, id, retireeId, s1, s2, games) => rpc("nairobi_admin_retire", { p_pin: pin, p_match_id: id, p_retiree_id: retireeId, p_score1: s1 == null ? null : s1, p_score2: s2 == null ? null : s2, p_games: games || null }),
    adminPostpone: (pin, id, toEnd) => rpc("nairobi_admin_postpone", { p_pin: pin, p_match_id: id, p_to_end: !!toEnd }),
    adminPlayNext: (pin, id) => rpc("nairobi_admin_play_next", { p_pin: pin, p_match_id: id }),
    adminSwapOut: (pin, id) => rpc("nairobi_admin_swap_out", { p_pin: pin, p_match_id: id }),
    adminAckCalled: (pin, id) => rpc("nairobi_admin_ack_called", { p_pin: pin, p_match_id: id }),
    adminAssignCourt: (pin, id, court) => rpc("nairobi_admin_assign_court", { p_pin: pin, p_match_id: id, p_court: court }),
    adminMoveMatch: (pin, id, beforeId) => rpc("nairobi_admin_move_match", { p_pin: pin, p_match_id: id, p_before_id: beforeId }),
    adminSwapTo: (pin, offId, onId) => rpc("nairobi_admin_swap_to", { p_pin: pin, p_off_match: offId, p_on_match: onId }),
    adminUpdateEvent: (pin, eventId, name, settings) => rpc("nairobi_admin_update_event", { p_pin: pin, p_event_id: eventId, p_name: name, p_settings: settings }),
    adminSetActive: (pin, eventId, active) => rpc("nairobi_admin_set_active", { p_pin: pin, p_event_id: eventId, p_active: !!active }),
    adminDeleteEvent: (pin, eventId) => rpc("nairobi_admin_delete_event", { p_pin: pin, p_event_id: eventId }),
    adminSetActiveMany: (pin, ids, active) => rpc("nairobi_admin_set_active_many", { p_pin: pin, p_event_ids: ids, p_active: !!active }),
    adminSetEntrantMeta: (pin, id, meta) => rpc("nairobi_admin_set_entrant_meta", { p_pin: pin, p_entrant_id: id, p_meta: meta || {} }),
    adminHold: (pin, id, held) => rpc("nairobi_admin_hold", { p_pin: pin, p_match_id: id, p_held: !!held }),
    autostartDue: () => rpc("nairobi_autostart_due", {}),
    adminReplaceEvent: async (pin, eventId, meta, entrants, matches, force) => {
      const r = await rpc("nairobi_admin_replace_event", {
        p_pin: pin, p_event_id: eventId, p_name: meta.name,
        p_sort_order: meta.sort_order != null ? meta.sort_order : 0,
        p_settings: meta.settings, p_entrants: entrants, p_matches: matches,
        p_force: !!force
      });
      if (r.ok && typeof r.data === "string" && r.data.startsWith("OK:")) r.eventId = r.data.slice(3);
      return r;
    },
    adminRenameEntrant: (pin, id, name) => rpc("nairobi_admin_rename_entrant", { p_pin: pin, p_entrant_id: id, p_name: name }),
    adminRemoveEntrant: (pin, id) => rpc("nairobi_admin_remove_entrant", { p_pin: pin, p_entrant_id: id }),
    adminAddEntrant: (pin, eventId, entrant, matches) => rpc("nairobi_admin_add_entrant", { p_pin: pin, p_event_id: eventId, p_entrant: entrant, p_matches: matches }),
    adminMoveEntrant: (pin, id, group, matches) => rpc("nairobi_admin_move_entrant", { p_pin: pin, p_entrant_id: id, p_group: group, p_matches: matches }),
    adminSetContacts: (pin, entrantId, phones) => rpc("nairobi_admin_set_contacts", { p_pin: pin, p_entrant_id: entrantId, p_phones: phones }),
    adminListContacts: pin => rpc("nairobi_admin_list_contacts", { p_pin: pin }),
    adminSetBracketTeams: (pin, matchId, e1, e2) => rpc("nairobi_admin_set_bracket_teams", { p_pin: pin, p_match_id: matchId, p_entrant1_id: e1 || null, p_entrant2_id: e2 || null }),
    adminGenerateBracket: (pin, eventId, rows) => rpc("nairobi_admin_generate_bracket", { p_pin: pin, p_event_id: eventId, p_matches: rows }),
    adminResetBracket: (pin, eventId) => rpc("nairobi_admin_reset_bracket", { p_pin: pin, p_event_id: eventId }),
    /* No PIN: this is the one window into the roster that anyone may open. The
       function itself decides what is publishable, so the client cannot widen
       it by asking for more columns. */

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
/* For a value passed to an inline onclick as a single-quoted JS string.

   the string. Escape it for JS first, then for the attribute. */
function jsAttr(s){
  return esc(String(s == null ? "" : s)
    .replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\r?\n/g, "\\n"));
}
function safeSession(key, val){
  try{
    if (val === undefined) return window.sessionStorage.getItem(key);
    if (val === null) window.sessionStorage.removeItem(key);
    else window.sessionStorage.setItem(key, val);
  }catch(e){ return null; }
}
function safeLocal(key, val){
  try{
    if (val === undefined) return window.localStorage.getItem(key);
    if (val === null) window.localStorage.removeItem(key);
    else window.localStorage.setItem(key, val);
  }catch(e){ return null; }
}
/* Banner dismissals survive refresh; entries expire with the banners. */
function loadDismissedCalled(){
  try{
    const o = JSON.parse(safeLocal("pb_dismissed") || "{}");
    const now = Date.now(), keep = {};
    Object.keys(o).forEach(k => {
      const t = Date.parse(k.split("|")[1] || "");
      if (t && now - t < CALLED_FRESH_MS * 3) keep[k] = true;
    });
    return keep;
  }catch(e){ return {}; }

  "Admin powers on the other tabs": "Uwezo wa msimamizi kwenye kurasa zingine",
  "While unlocked: tap any match anywhere (Courts, Schedule, a team in Standings, or the Bracket) to fix or clear its score or enter a walkover. Players can only enter a score while a match is on a court; admins can score anything from anywhere. An on-court match can be sent back with \"Take off court\": either the next match in line takes its court, or you pick the one to bring on. Pause the finished event: with nothing running, the Courts tab previews the next batch's courts (the tournament's opening events a day ahead, every later batch from 12 hours before its start). The Courts tab has Postpone on the queue and Play next on postponed matches, and each waiting row's Move button asks for the queue place it should take. On a \"go to court\" banner, ✓ On court dismisses it for everyone; a plain tap hides it only on that phone. On the Bracket tab, unplayed matches have an Edit teams link for manual fixes. Everything updates live on everyone's phone.":
    "Ukiwa umefungua: gusa mechi yoyote popote (Viwanja, Ratiba, timu kwenye Msimamo, au Mchujo) kurekebisha au kufuta matokeo yake, kuweka walkover, au kuahirisha. Wachezaji wanaweza kuweka matokeo tu mechi ikiwa uwanjani; wasimamizi wanaweza kuweka matokeo ya chochote kutoka popote. Mechi iliyo uwanjani inaweza kurudishwa kwa \"Ondoa uwanjani\": ama mechi inayofuata kwenye foleni huchukua uwanja wake, au unachagua ya kuingiza. Sitisha shindano lililomalizika: bila kinachoendelea, ukurasa wa Viwanja huonyesha mapema viwanja vya fungu lijalo la mashindano (mashindano ya ufunguzi siku moja kabla, kila fungu la baadaye kuanzia masaa 12 kabla ya kuanza kwake). Ukurasa wa Viwanja una Ahirisha kwenye foleni na Iwe ijayo kwenye mechi zilizoahirishwa, na kitufe cha Hamisha cha kila mstari unaosubiri huuliza nafasi ya foleni inayotakiwa. Kwenye tangazo la \"nenda uwanjani\", ✓ Uwanjani huliondoa kwa kila mtu; kugusa kwa kawaida hulificha kwenye simu hiyo tu. Kwenye ukurasa wa Mchujo, mechi ambazo hazijachezwa zina kitufe cha Badilisha timu kwa marekebisho ya mkono. Kila kitu husasishwa moja kwa moja kwenye simu ya kila mtu.",

  data.entrants.filter(e => e.event_id === ev.id)
    .forEach(e => splitPair(e.name).forEach(touch));
  data.matches
    .filter(m => m.event_id === ev.id && m.status === "played" && m.score1 != null && m.score2 != null)
    .forEach(m => {
      const s1 = splitPair(entrantName(m.entrant1_id)), s2 = splitPair(entrantName(m.entrant2_id));
      /* A walkover counts as a played win but adds no points either way (same
         rule as the group standings); in a points-first table an invented
         11-0 would otherwise decide the leaderboard. */
      const p1 = m.walkover ? 0 : m.score1, p2 = m.walkover ? 0 : m.score2;

    .sort((a, b) => b.pf - a.pf || b.diff - a.diff || b.w - a.w);

    /* Fold the legacy single slot into the map on the way past, so a team is

    const meta = Object.assign({}, e.meta || {}, { lots });
    delete meta.lot; delete meta.lotFor;

function matchLog(id){

    .sort((a, b) => String(a.at).localeCompare(String(b.at)));
}
/* True once a score has been written more than once: the match everybody is
   about to argue over. */
const wasCorrected = id => matchLog(id).length > 1;
function gamesStr(m){
  if (Array.isArray(m.games) && m.games.length) return m.games.map(g => g[0] + "-" + g[1]).join(", ");
  return null;
}
function onCourtMatches(){
  return data.matches
    .filter(m => m.status === "scheduled" && m.court != null && m.entrant1_id && m.entrant2_id)
    /* Hidden events are invisible to players, so their matches must not be
       announced either: the "go to court" banner was calling people to a match
       they could not open, on courts the board was drawing as free. */
    .filter(m => { const ev = eventById(m.event_id); return ev && ev.active && !isHidden(ev); })
    .sort((a, b) => a.court - b.court);
}
/* Every occupied court, hidden events included: hiding an event hides it from
   players, it does not free its courts (the server keeps them occupied). Used
   wherever OCCUPANCY is the question: the board's In use cards, wait
   estimates, and the busy-player gates. The announced list above stays
   hidden-free so banners never call people to invisible matches. */
function onCourtMatchesAll(){
  return data.matches
    .filter(m => m.status === "scheduled" && m.court != null && m.entrant1_id && m.entrant2_id)
    .filter(m => { const ev = eventById(m.event_id); return ev && ev.active; })
    .sort((a, b) => a.court - b.court);
}
/* The main-draw queue. Americano is a self-managing separate pool (its board
   shows its own courts), so it is never part of this queue, the "up next" list,
   the manual court-assign picker, or the wait estimates. */
function pendingQueue(){
  const lists = activeEvents().filter(ev => !isAmericano(ev)).map(ev => data.matches
    .filter(m => m.event_id === ev.id && m.status === "scheduled" && m.court == null && !m.held && m.entrant1_id && m.entrant2_id)
    .sort((a, b) => a.play_order - b.play_order));
  return weaveQueues(lists);
}
/* Matches the desk pulled off court and is holding until both teams turn up. */
/* Deliberately NOT filtered on the event being active: a held match whose
   event is then paused for rain used to vanish from every screen with no way
   to release it, and it is still out of the queue when play resumes. */
function heldMatches(){
  return data.matches.filter(m => m.status === "scheduled" && m.held &&
    eventById(m.event_id) && !isHidden(eventById(m.event_id)))
    .sort((a, b) => a.play_order - b.play_order);
}

/* ---------- wait estimates ---------- */
/* Between matches: last point to first serve of the next one. Not just walking
   off; it is finding four people who wandered off to eat or watch, and warming
   them up. Six or seven minutes is normal, and it is the single biggest lever
   an organiser actually controls. */
const TURNOVER_MIN = 7;
/* Courts do not stay busy all day. Players are double-entered and can only be
   on one court, groups run out of playable pairings near the end, and the desk
   is chasing scores. Even a well-run day with a queue board lands near 80%,
   which is why a plan built on perfect utilisation always runs late. */
const COURT_BUSY = 0.8;
/* Average games a match takes. A best of 3 needs 2 wins, and a minority of
   matches go the distance: the 2025 draws came out around 2.1 games per match,
   so 2.25 leaves a little room without being alarmist. */
const expectedGamesForBo = bo => (bo <= 1 ? 1 : (bo + 1) / 2 + (bo - 1) / 8);
const expectedGamesFor = m => expectedGamesForBo(matchBestOf(m));
/* Minutes for a single game: close to linear in the points target, plus a
   couple of minutes for the warm-up, side changes, chasing balls off the next
   court and the odd timeout. Win by 2 adds a tail of deuce points. Calibrated
   against the 2025 event running roughly 12 hours, not against clean play. */
const gameMinutesFor = (pts, winBy2) => 0.85 * pts + 2 + (winBy2 ? 1 : 0);
/* Live wait estimates only: a game to 21 runs about 13 minutes of play. */
const LIVE_GAME_MIN = 0.52;
const allowedCourtCount = ev => {
  const a = ev && ev.settings && Array.isArray(ev.settings.courts) ? ev.settings.courts : [];
  return a.length ? a.length : courtsCount();
};
/* Minutes one game takes. Measured from today's finished matches (court call
   to score entry) once a few exist, so a switch to best of 3 or a slow field
   feeds straight back into the number; before that, a guess scaled to the
   points target (one game to 21 runs somewhere near 17 minutes). */
function perGameMinutes(m){
  const durs = [];
  const now = Date.now();
  for(const x of data.matches){
    if (x.status !== "played" || x.walkover || !x.called_at || !x.updated_at) continue;
    /* calibrate on this event's own recent matches: another day's (or another
       format's) game lengths say little about this queue right now */
    if (x.event_id !== m.event_id) continue;
    if (now - Date.parse(x.updated_at) > 18 * 3600000) continue;
    const mins = (Date.parse(x.updated_at) - Date.parse(x.called_at)) / 60000;
    const g = Array.isArray(x.games) && x.games.length ? x.games.length : 1;
    const per = (mins - TURNOVER_MIN) / g;
    if (per >= 5 && per <= 45) durs.push(per);
  }
  if (durs.length >= 3){
    durs.sort((a, b) => a - b);
    return durs[Math.floor(durs.length / 2)];
  }
  /* Cold start, before this event has three finished matches to learn from.
     Deliberately tighter than the whole-day planner's gameMinutesFor: that one
     is calibrated against how long a tournament day really takes, slack and
     chased scores included, and pricing the next twenty minutes with it told
     the team next in line to expect twenty-five for a single game to 21. */
  return Math.min(24, Math.max(6, LIVE_GAME_MIN * matchPts(m) + 2 + (matchWinBy2(m) ? 1 : 0)));
}
const expectedMatchMinutes = m => expectedGamesFor(m) * perGameMinutes(m) + TURNOVER_MIN;
/* Turnover for the live wait estimate: last point to the next first serve on
   the same court. Drew's number; the planning estimator keeps its more
   conservative 7 because whole-day plans should not assume a sharp desk. */
const WAIT_TURNOVER_MIN = 5;
/* Rough minutes until a waiting match should reach a court. Position in the
   woven queue already reflects how running events share the courts. Each
   occupied court is priced by how long its match has actually been on
   (called_at), so the number tightens as courts run long or finish early.
   Main pool only: americano matches hold americano courts, never these. */
/* Players on a main-pool court right now, by name, mirroring the assigner. */
function busyPlayerNames(){
  const set = new Set();
  onCourtMatchesAll().filter(x => !isAmericano(eventById(x.event_id))).forEach(x => {
    splitPair(entrantName(x.entrant1_id)).concat(splitPair(entrantName(x.entrant2_id)))
      .forEach(n => { if (n) set.add(n); });
  });
  return set;
}
/* A match nobody can be called to yet, because one of its players is mid-game. */
function blockedByCourt(m, busy){
  const P = splitPair(entrantName(m.entrant1_id)).concat(splitPair(entrantName(m.entrant2_id)));
  return P.some(n => busy.has(n));
}
function estimatedWaitMinutes(m){
  const q = pendingQueue();
  const ahead = q.findIndex(x => x.id === m.id);
  if (ahead < 0) return null;
  const now = Date.now();
  const playMinutes = x => expectedGamesFor(x) * perGameMinutes(x);
  /* Which courts a match may be called to: its event's restriction, or all. */
  const allowedOf = x => {
    const ev2 = eventById(x.event_id);
    const a = ev2 && ev2.settings && Array.isArray(ev2.settings.courts) ? ev2.settings.courts : [];
    return a.length ? a : null;
  };
  const mainOn = onCourtMatchesAll().filter(x => !isAmericano(eventById(x.event_id)));
  const freeAt = [];
  for(let c = 1; c <= courtsCount(); c++){
    const on = mainOn.find(x => x.court === c);
    if (!on){ freeAt.push(0); continue; }
    const t = on.called_at ? Date.parse(on.called_at) : NaN;
    const elapsed = isFinite(t) ? (now - t) / 60000 : 0;
    freeAt.push(Math.max(0, playMinutes(on) - elapsed) + WAIT_TURNOVER_MIN);
  }
  if (!freeAt.length) return null;
  /* Drain the queue ahead, each match onto the soonest-free court IT is
     allowed to use; an event pinned to one court must not be priced as if
     the whole building were available to it. */
  const soonestFor = x => {
    const allowed = allowedOf(x);
    let k = -1;
    for(let j = 0; j < freeAt.length; j++){
      if (allowed && allowed.indexOf(j + 1) === -1) continue;
      if (k === -1 || freeAt[j] < freeAt[k]) k = j;
    }
    return k;
  };
  for(let i = 0; i < ahead; i++){
    const k = soonestFor(q[i]);
    if (k !== -1) freeAt[k] += playMinutes(q[i]) + WAIT_TURNOVER_MIN;
  }
  const mine = soonestFor(m);
  if (mine === -1) return null;
  return Math.round(freeAt[mine]);
}
function eventStartDate(ev){
  const s = evSetting(ev, "start_time", "");
  if (!s) return null;
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
/* Before an event starts: where the match falls in the queue its batch will
   form, drained onto whichever court frees first, the same walk the live board
   does once play is on. Everything else starting on the same clock is in the
   batch. Priced on its own queue alone, an event sharing the morning with
   another read as if the whole building were its own, so two events at 8:00
   both called their fifth match "8:17" when the woven queue puts it in the
   third wave. One event starting by itself prices exactly as before. */
function estimatedStartTime(m, ev){
  const start = eventStartDate(ev);
  if (!start) return null;
  const key = evSetting(ev, "start_time", "");
  const batch = publicEvents().filter(e => e.id === ev.id ||
    (!e.active && !isAmericano(e) && evSetting(e, "start_time", "") === key));
  if (!batch.some(e => e.id === ev.id)) batch.push(ev);
  const sim = { events: batch.map(e => Object.assign({}, e, { active: true })), matches: data.matches };
  const q = weavePending(sim);
  const ahead = q.findIndex(x => x.id === m.id);
  if (ahead < 0) return null;
  const n = courtsCount();
  const freeAt = [];
  for(let c = 0; c < n; c++) freeAt.push(0);
  const allowedOf = x => {
    const e2 = sim.events.find(e => e.id === x.event_id);
    const a = e2 && e2.settings && Array.isArray(e2.settings.courts) ? e2.settings.courts : [];
    return a.length ? a : null;
  };
  const soonestFor = x => {
    const allowed = allowedOf(x);
    let k = -1;
    for(let j = 0; j < n; j++){
      if (allowed && allowed.indexOf(j + 1) === -1) continue;
      if (k === -1 || freeAt[j] < freeAt[k]) k = j;
    }
    return k;
  };
  for(let i = 0; i < ahead; i++){
    const k = soonestFor(q[i]);
    if (k !== -1) freeAt[k] += expectedMatchMinutes(q[i]);
  }
  const mine = soonestFor(m);
  if (mine === -1) return null;
  return new Date(start.getTime() + freeAt[mine] * 60000);
}
function fmtWaitMin(w){
  const r = Math.max(5, Math.round(w / 5) * 5);
  if (r < 60) return "about " + r + " minutes";
  return "about " + Math.floor(r / 60) + "h" + (r % 60 ? " " + (r % 60) + "m" : "");
}
function fmtHours(mins){
  const r = Math.round(mins / 15) * 15;
  const h = Math.floor(r / 60), m = r % 60;
  if (!h) return m + "m";
  return h + "h" + (m ? " " + m + "m" : "");
}
/* How long a whole event will take under a given format. Counts the real match
   list once the draw exists, and projects round robins from the entrant list
   before that, so an organiser can see the cost of "best of 3" before drawing.
   Overrides let the admin panel price the settings on screen, unsaved. */
function eventDurationEstimate(ev, o){
  o = o || {};
  const pick = (v, dflt) => (v == null || v !== v ? dflt : v);
  const pg = pick(o.pointsGroup, evSetting(ev, "points_to_group", 15));
  const pk = pick(o.pointsKo, evSetting(ev, "points_to_knockout", 11));
  const bg = pick(o.boGroup, parseInt(evSetting(ev, "best_of_group", 1), 10) || 1);
  const bk = pick(o.boKo, parseInt(evSetting(ev, "best_of_knockout", 3), 10) || 1);
  const wb2 = pick(o.winBy2, !!evSetting(ev, "win_by_two", false));
  const courts = Math.max(1, pick(o.courts, allowedCourtCount(ev)));

  const ms = data.matches.filter(m => m.event_id === ev.id);
  let nGroup = ms.filter(m => m.stage === "group").length;
  let nKo = ms.filter(m => m.stage === "knockout").length;
  let nGroups = groupsOfEvent(ev).length;
  const ents = data.entrants.filter(e => e.event_id === ev.id).length;
  if (!nGroup && ents > 1){
    const sizes = groupSizes(ents, pick(o.groupSize, evSetting(ev, "group_size", 6)));
    nGroup = sizes.reduce((t, s) => t + s * (s - 1) / 2, 0);
    nGroups = sizes.length;
  }
  if (!nKo && nGroups){
    const adv = pick(o.advance, evSetting(ev, "advance_per_group", 2));
    const ks = String(pick(o.koSize, evSetting(ev, "knockout_size", "auto")));
    const size = ks === "auto" ? nextPow2(Math.max(2, nGroups * adv)) : (parseInt(ks, 10) || 0);
    nKo = Math.max(0, size - 1);
  }
  const per = (pts, bo, w) => expectedGamesForBo(bo) * gameMinutesFor(pts, w) + TURNOVER_MIN;
  const ideal = (nGroup * per(pg, bg, wb2) + nKo * per(pk, bk, true)) / courts;
  /* `minutes` is the day an organiser should plan for; `idealMinutes` is the
     floor it would hit only if no court ever sat empty. */
  return { group: nGroup, ko: nKo, matches: nGroup + nKo, courts,
           idealMinutes: ideal, minutes: ideal / COURT_BUSY };
}

function calledMatches(){
  const now = Date.now();
  return onCourtMatches().filter(m =>
    m.called_at && !m.called_ack && (now - Date.parse(m.called_at)) < CALLED_FRESH_MS &&
    !state.dismissedCalled[m.id + "|" + m.called_at]);
}

/* ---------- rendering ---------- */
/* Only touch the DOM when the generated markup actually changed. Periodic and
   realtime refreshes with no visible difference then leave the page alone, so
   taps never land on elements that were just replaced mid-gesture. */
let renderedHtml = null;
function commitHtml(app, html){
  if (html === renderedHtml) return false;
  app.innerHTML = html;
  renderedHtml = html;
  applyLanguage(app);
  return true;
}
/* A re-render replaces the admin panel's HTML wholesale, so anything typed
   but not yet saved reverted without a word: a group size snapped back to the
   saved one between Preview and Draw, an uploaded entrant list emptied when a
   score landed on another phone. Unsaved field values are carried across,
   keyed by which panel is on screen so changing event or tab starts clean. */
let admShown = { key: null, vals: null, rendered: null, courts: null, courtsRendered: null, dirty: false, skip: false };
const ADM_SEL = 'input[id^="adm-"],select[id^="adm-"],textarea[id^="adm-"]';
const fieldVal = el => el.type === "checkbox" ? el.checked : el.value;
function admKey(){
  return state.view !== "admin" ? null : "e:" + state.adminEventId + "|r:" + (state.showRedraw ? 1 : 0);
}
/* What the panel was just rendered with. Without it the capture below could not
   tell a field somebody typed in from one the server changed, so it carried
   every field and pinned the whole panel to its first render: another desk
   phone's saved settings were painted in and immediately overwritten, and the
   next Save pushed the stale values back over them. Court restrictions were the
   worst of it, because an untouched panel saved them back as "no restriction". */
function admSnapshot(app){
  const r = {};
  app.querySelectorAll(ADM_SEL).forEach(el => { r[el.id] = fieldVal(el); });
  admShown.rendered = r;
  admShown.courtsRendered = Array.from(app.querySelectorAll("input.adm-court")).map(el => el.checked);
}
function admCapture(app){
  /* skip: the panel was just saved, so the next render must show the event's
     own values and drop the "Not saved yet" marker. */
  if (admShown.key == null || admShown.skip){ admShown.vals = null; admShown.skip = false; return; }
  const rendered = admShown.rendered || {};
  const vals = {};
  app.querySelectorAll(ADM_SEL).forEach(el => {
    const v = fieldVal(el);
    if (!(el.id in rendered) || rendered[el.id] !== v) vals[el.id] = v;
  });
  admShown.vals = vals;
  const courts = Array.from(app.querySelectorAll("input.adm-court")).map(el => el.checked);
  const was = admShown.courtsRendered;
  admShown.courts = (was && was.length === courts.length && was.every((b, i) => b === courts[i])) ? null : courts;
  const d = document.getElementById("adm-dirty");
  admShown.dirty = !!(d && d.style.display !== "none");
}
function admRestore(app){
  if (!admShown.vals || admKey() !== admShown.key) return;
  for(const id in admShown.vals){
    const el = document.getElementById(id);
    if (!el) continue;
    if (el.type === "checkbox") el.checked = admShown.vals[id];
    else el.value = admShown.vals[id];
  }
  const boxes = app.querySelectorAll("input.adm-court");
  if (admShown.courts && admShown.courts.length === boxes.length)
    boxes.forEach((el, i) => { el.checked = admShown.courts[i]; });
  if (admShown.dirty){
    const d = document.getElementById("adm-dirty");
    if (d) d.style.display = "";
    const sb = document.getElementById("adm-save");
    if (sb) sb.classList.remove("secondary");
  }
}
/* The same story inside the modals, and worse there. Score boxes are rendered
   from the stored match, so a re-render between typing a correction and pressing
   Save refilled them with the score that was already saved, and the desk saved
   that straight back with "Score saved" on top: the correction vanished with no
   sign it ever happened. Covers the score boxes, the per-game boxes, the
   bracket's Edit teams selects and the off-court queue place. */
let modShown = { key: null, vals: null, rendered: null };
const MOD_SEL = ".score-in,#slot1,#slot2,#off-place";
function modKey(){
  return state.modalMatchId || state.slotEditId || state.offCourtId || null;
}
function modSnapshot(app){
  const r = {};
  app.querySelectorAll(MOD_SEL).forEach(el => { if (el.id) r[el.id] = el.value; });
  modShown.rendered = r;
}
function modCapture(app){
  if (modShown.key == null){ modShown.vals = null; return; }
  const rendered = modShown.rendered || {};
  const vals = {};
  app.querySelectorAll(MOD_SEL).forEach(el => {
    if (el.id && (!(el.id in rendered) || rendered[el.id] !== el.value)) vals[el.id] = el.value;
  });
  modShown.vals = vals;
}
function modRestore(app){
  if (!modShown.vals || modKey() !== modShown.key) return;
  for(const id in modShown.vals){
    const el = document.getElementById(id);
    if (el) el.value = modShown.vals[id];
  }
}
function render(){
  const app = document.getElementById("app");
  const ae = document.activeElement;
  const typingInForm = ae && app.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.id !== "pin-input" && ae.id !== "search-input";
  if (typingInForm && (state.view === "admin" || state.view === "participants" || state.modalMatchId || state.slotEditId || state.offCourtId || state.assignCourt != null)){
    state.pendingRender = true;
    return;
  }
  const restoreId = ae && ae.id;
  const restoreVal = restoreId && ae.value;
  admCapture(app);
  modCapture(app);

  /* Only take over the screen when there is nothing to show. A refresh that
     fails on patchy venue wifi must not throw away a board that is already on
     screen and still broadly right; it says so quietly and keeps retrying. */
  if (state.loadError && !data.tournament){
    commitHtml(app, '<div class="wrap"><div class="empty">Could not load tournament data.<br>' + esc(state.loadError) + '<br><br><button class="btn secondary" onclick="location.reload()">Retry</button></div></div>');
    return;
  }
  if (!data.tournament){
    commitHtml(app, '<div class="wrap"><div class="empty">Loading…</div></div>');
    return;
  }

  /* Participants is desk-only: the roster carries genders and DUPR ids, so the
     tab is not even offered until the panel is unlocked. */
  const tabs = [
    ["board", "Courts"], ["schedule", "Schedule"],
    ["standings", "Standings"], ["bracket", "Bracket"]
  ];
  /* Players is the public half of the roster and stays on the bar for
     everyone; Participants is the desk's editing grid for the same people. */
  tabs.push(["players", "Players"]);
  if (state.adminPin) tabs.push(["participants", "Participants"]);
  tabs.push(["admin", "Admin"]);
  let html = '<div class="topbar">';
  if (store.mode === "demo") html += '<div class="demo-banner">Demo with sample data. Changes reset on refresh. Admin PIN: ' + esc(store.demoPin) + '</div>';
  /* Club badge, top left: the Nairobi Pickleball Club logo, cropped square,
     round-masked, and embedded as a data URI so the page stays self-contained
     (source file: npc_logo.png in the repo). */

/* "Go to court now" banners: fresh court assignments, auto-expire.
   Tapping a banner hides it on this phone only; the admin ✓ dismisses it
   for everyone. Scores are never entered from here. */
/* True when a match belongs to the division currently being viewed. Only the
   Courts board is filtered; every other tab shows the whole tournament. */
function inDivision(m){
  if (state.view !== "board") return true;
  const ev = eventById(m.event_id);
  /* The division is remembered across a reload, so a phone left on the
     Americano board would otherwise sit on an empty screen once that event
     stops running. */
  if (state.division === "americano" && !americanoEvent()) return !isAmericano(ev);
  return state.division === "americano" ? isAmericano(ev) : !isAmericano(ev);
}
/* Events the desk has told never to start themselves. The afternoon batch is
   set this way: left to autostart it would come on top of a morning that is
   still playing, and with the courts split between four events neither batch
   would finish. So the desk is asked instead of told. */
const manualStart = ev => evSetting(ev, "autostart", true) === false;
function manualStartDue(){
  const now = Date.now();
  return publicEvents().filter(ev => {
    if (ev.active || !manualStart(ev)) return false;
    const d = eventStartDate(ev);
    if (!d) return false;
    /* From five minutes before the printed time until twelve hours after, the
       same window autostart uses, so a bar that was ignored is still there
       when somebody picks the phone up. */
    if (d.getTime() - now > 5 * 60 * 1000 || now - d.getTime() > 12 * 3600 * 1000) return false;
    const ms = data.matches.filter(m => m.event_id === ev.id);
    /* Nothing to start, or already played in: a paused half-finished event is
       the desk's to resume by hand, not something to nag about. */
    return ms.length > 0 && !ms.some(m => m.status === "played");
  }).sort((a, b) => a.sort_order - b.sort_order);
}
/* Finals and the third place match are held for the last day, so while that is
   the plan they are not what the next batch is waiting on. */
const finalsSundayOn = () => !(data.tournament && data.tournament.settings &&
  data.tournament.settings.finals_sunday === false);
function matchesLeftRunning(){
  const sunday = finalsSundayOn();
  const koTotal = {};
  data.matches.forEach(m => {
    if (m.stage !== "knockout") return;
    koTotal[m.event_id] = Math.max(koTotal[m.event_id] || 0, m.bracket_round || 0);
  });
  return data.matches.filter(m => {
    const ev = eventById(m.event_id);
    if (!ev || !ev.active || isHidden(ev) || isAmericano(ev)) return false;
    if (m.status === "played") return false;
    if (sunday && m.stage === "knockout" &&
        (m.bracket_round === 0 || m.bracket_round === koTotal[m.event_id])) return false;
    return true;
  }).length;
}
const WIND_DOWN_AT = 3;
function renderStartDue(){
  if (!state.adminPin) return "";
  const due = manualStartDue();
  if (!due.length) return "";
  const running = activeEvents().filter(e => !isAmericano(e)).length;
  const left = matchesLeftRunning();
  const holdEl = due.map(e => evSetting(e, "delay_until", "")).find(v => v) || "";
  const heldTill = holdEl ? new Date(holdEl) : null;
  const holding = heldTill && !isNaN(heldTill.getTime()) && heldTill.getTime() > Date.now();
  const names = due.map(e => e.name).join(", ");
  let h = '<div class="startbar">';
  h += '<span>' + swText("Due to start") + ': ' + esc(names) + '</span>';
  h += '<button class="btn small" onclick="startDueEvents()">' +
    swText(due.length === 1 ? "Start it" : "Start them") + '</button>';
  /* A time rather than a snooze: the desk knows when it wants these, and a ten
     minute nag it has to dismiss six times is not that. */
  h += '<span class="sbhold"><input type="datetime-local" id="startbar-hold" value="' + esc(holdEl) + '">' +
    '<button class="btn small secondary" onclick="holdDueEvents()">' + swText("Hold until") + '</button></span>';
  /* Why it will happen on its own, so the desk can leave it alone. */
  let why;
  if (!running) why = swText("Nothing is running, so these come on by themselves.");
  else if (left <= WIND_DOWN_AT) why = swText("Only") + " " + left + " " +
    swText("left in what is running, so these come on by themselves.");
  else why = swText("Matches still to play in what is running") + ": " + left + ". " +
    swText("These come on by themselves once that is down to") + " " + WIND_DOWN_AT + "." +
    (holding ? " " + swText("Held until") + " " +
      heldTill.toLocaleString(state.lang === "sw" ? "sw" : [], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) + "." : "");
  h += '<span class="sbwhat">' + why + '</span>';
  return h + '</div>';
}
async function holdDueEvents(){
  const el = document.getElementById("startbar-hold");
  const v = el ? el.value : "";
  const due = manualStartDue();
  if (!due.length) return;
  for(const ev of due){
    const r = await store.adminUpdateEvent(state.adminPin, ev.id, ev.name, { delay_until: v || "" });
    if (!r.ok){ toast(r.error); return; }
  }
  toast(v ? "Held until " + v.replace("T", " ") : "Hold cleared");
  await reload();
}
async function startDueEvents(){
  const due = manualStartDue();
  if (!due.length) return;
  const r = await store.adminSetActiveMany(state.adminPin, due.map(e => e.id), true);
  if (!r.ok){ toast(r.error); return; }
  toast(due.map(e => e.name).join(", ") + " started");
  await reload();
}
