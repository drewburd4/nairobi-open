/* ---------- wait estimates ---------- */
/* Between matches: last point to first serve of the next one. Not just walking
   off; it is finding four people who wandered off to eat or watch, and warming
   them up. Six or seven minutes is normal, and it is the single biggest lever
   an organiser actually controls. */
const TURNOVER_MIN = 7;
/* Courts do not stay busy all day. Players are double-entered and can only be
   on one court, groups run out of playable pairings near the end, and the desk
   is chasing scores. Even a well-run day with a queue board lands near 80%,
   which is why a plan built on perfect utilisation always runs late. */
const COURT_BUSY = 0.8;
/* Average games a match takes. A best of 3 needs 2 wins, and a minority of
   matches go the distance: the 2025 draws came out around 2.1 games per match,
   so 2.25 leaves a little room without being alarmist. */
const expectedGamesForBo = bo => (bo <= 1 ? 1 : (bo + 1) / 2 + (bo - 1) / 8);
const expectedGamesFor = m => expectedGamesForBo(matchBestOf(m));
/* Minutes for a single game: close to linear in the points target, plus a
   couple of minutes for the warm-up, side changes, chasing balls off the next
   court and the odd timeout. Win by 2 adds a tail of deuce points. Calibrated
   against the 2025 event running roughly 12 hours, not against clean play. */
const gameMinutesFor = (pts, winBy2) => 0.85 * pts + 2 + (winBy2 ? 1 : 0);
const allowedCourtCount = ev => {
  const a = ev && ev.settings && Array.isArray(ev.settings.courts) ? ev.settings.courts : [];
  return a.length ? a.length : courtsCount();
};
/* Minutes one game takes. Measured from today's finished matches (court call
   to score entry) once a few exist, so a switch to best of 3 or a slow field
   feeds straight back into the number; before that, a guess scaled to the
   points target (one game to 21 runs somewhere near 17 minutes). */
function perGameMinutes(m){
  const durs = [];
  const now = Date.now();
  for(const x of data.matches){
    if (x.status !== "played" || x.walkover || !x.called_at || !x.updated_at) continue;
    /* calibrate on this event's own recent matches: another day's (or another
       format's) game lengths say little about this queue right now */
    if (x.event_id !== m.event_id) continue;
    if (now - Date.parse(x.updated_at) > 18 * 3600000) continue;
    const mins = (Date.parse(x.updated_at) - Date.parse(x.called_at)) / 60000;
    const g = Array.isArray(x.games) && x.games.length ? x.games.length : 1;
    const per = (mins - TURNOVER_MIN) / g;
    if (per >= 5 && per <= 45) durs.push(per);

    durs.sort((a, b) => a - b);
    return durs[Math.floor(durs.length / 2)];

const expectedMatchMinutes = m => expectedGamesFor(m) * perGameMinutes(m) + TURNOVER_MIN;

   conservative 7 because whole-day plans should not assume a sharp desk. */
const WAIT_TURNOVER_MIN = 5;
/* Rough minutes until a waiting match should reach a court. Position in the
   woven queue already reflects how running events share the courts. Each
   occupied court is priced by how long its match has actually been on
   (called_at), so the number tightens as courts run long or finish early.

  const q = pendingQueue();
  const ahead = q.findIndex(x => x.id === m.id);
  if (ahead < 0) return null;
  const now = Date.now();
  const playMinutes = x => expectedGamesFor(x) * perGameMinutes(x);
  /* Which courts a match may be called to: its event's restriction, or all. */
  const allowedOf = x => {
    const ev2 = eventById(x.event_id);
    const a = ev2 && ev2.settings && Array.isArray(ev2.settings.courts) ? ev2.settings.courts : [];

  for(let c = 1; c <= courtsCount(); c++){
    const on = mainOn.find(x => x.court === c);
    if (!on){ freeAt.push(0); continue; }
    const t = on.called_at ? Date.parse(on.called_at) : NaN;
    const elapsed = isFinite(t) ? (now - t) / 60000 : 0;
    freeAt.push(Math.max(0, playMinutes(on) - elapsed) + WAIT_TURNOVER_MIN);
  }
  if (!freeAt.length) return null;
  /* Drain the queue ahead, each match onto the soonest-free court IT is
     allowed to use; an event pinned to one court must not be priced as if
     the whole building were available to it. */
  const soonestFor = x => {
    const allowed = allowedOf(x);
    let k = -1;
    for(let j = 0; j < freeAt.length; j++){
      if (allowed && allowed.indexOf(j + 1) === -1) continue;
      if (k === -1 || freeAt[j] < freeAt[k]) k = j;
    }
    return k;
  };
  for(let i = 0; i < ahead; i++){
    const k = soonestFor(q[i]);
    if (k !== -1) freeAt[k] += playMinutes(q[i]) + WAIT_TURNOVER_MIN;

function eventStartDate(ev){
  const s = evSetting(ev, "start_time", "");

  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;

/* Before an event starts: its own queue position against the admin-set start

function estimatedStartTime(m, ev){
  const start = eventStartDate(ev);
  if (!start) return null;
  const sibs = data.matches
    .filter(x => x.event_id === ev.id && x.status === "scheduled" &&
      (!x.postponed || x.id === m.id) && x.entrant1_id && x.entrant2_id)
    .sort((a, b) => a.play_order - b.play_order);
  const pos = sibs.findIndex(x => x.id === m.id);
  if (pos < 0) return null;
  const allowed = ev.settings && Array.isArray(ev.settings.courts) && ev.settings.courts.length

/* How long a whole event will take under a given format. Counts the real match

   Overrides let the admin panel price the settings on screen, unsaved. */
function eventDurationEstimate(ev, o){
  o = o || {};
  const pick = (v, dflt) => (v == null || v !== v ? dflt : v);
  const pg = pick(o.pointsGroup, evSetting(ev, "points_to_group", 21));
  const pk = pick(o.pointsKo, evSetting(ev, "points_to_knockout", 11));
  const bg = pick(o.boGroup, parseInt(evSetting(ev, "best_of_group", 1), 10) || 1);
  const bk = pick(o.boKo, parseInt(evSetting(ev, "best_of_knockout", 3), 10) || 1);
  const wb2 = pick(o.winBy2, !!evSetting(ev, "win_by_two", false));
  const courts = Math.max(1, pick(o.courts, allowedCourtCount(ev)));

  const ms = data.matches.filter(m => m.event_id === ev.id);
  let nGroup = ms.filter(m => m.stage === "group").length;
  let nKo = ms.filter(m => m.stage === "knockout").length;
  let nGroups = groupsOfEvent(ev).length;

    const sizes = groupSizes(ents, pick(o.groupSize, evSetting(ev, "group_size", 6)));
    nGroup = sizes.reduce((t, s) => t + s * (s - 1) / 2, 0);
    nGroups = sizes.length;

  if (!nKo && nGroups){
    const adv = pick(o.advance, evSetting(ev, "advance_per_group", 2));
    const ks = String(pick(o.koSize, evSetting(ev, "knockout_size", "auto")));

     floor it would hit only if no court ever sat empty. */
  return { group: nGroup, ko: nKo, matches: nGroup + nKo, courts,

}

/* "Go to court now" banners: fresh court assignments, auto-expire.
   Tapping a banner hides it on this phone only; the admin ✓ dismisses it
   for everyone. Scores are never entered from here. */
/* True when a match belongs to the division currently being viewed. Only the
   Courts board is filtered; every other tab shows the whole tournament. */
function inDivision(m){
  if (state.view !== "board") return true;
  const ev = eventById(m.event_id);
  return state.division === "americano" ? isAmericano(ev) : !isAmericano(ev);
}
function renderCallouts(){
  const called = calledMatches().filter(inDivision);
  if (!called.length) return "";
  const multi = activeEvents().length > 1;
  let h = "";
  called.slice(0, 4).forEach(m => {
    const ev = eventById(m.event_id);
    h += '<button class="callout" onclick="dismissCallout(\'' + m.id + '\')" title="Tap to dismiss"><span class="cinner">' +
      '<span class="ctext">Court ' + m.court + ' now: ' + esc(entrantName(m.entrant1_id)) + ' <span class="cdim">vs</span> ' + esc(entrantName(m.entrant2_id)) +
      (multi && ev ? ' <span class="cdim">· ' + esc(ev.name) + '</span>' : '') + '</span>' +
      (state.adminPin
        ? '<span class="ack" role="button" onclick="event.stopPropagation();ackCalled(\'' + m.id + '\')">✓ On court</span>'
        : '<span class="ack" aria-hidden="true">✕</span>') +
      '</span></button>';
  });
  if (called.length > 4) h += '<div class="callout"><span class="cinner"><span class="ctext cdim">' + (called.length - 4) + ' more matches just called</span></span></div>';
  return h;
}

function eventLabel(ev){
  let l = ev.name;
  if (ev.active) l += " · running";
  else if (evSetting(ev, "schedule_note", "")) l += " · " + evSetting(ev, "schedule_note", "");
  return l;
}
function renderEventTabs(){
  const cur = currentEvent();
  let evs = data.events.slice().sort((a, b) => a.sort_order - b.sort_order);
  /* Americano has no knockout, it is decided on total points, so it never
     appears as an option under the Bracket tab. */
  if (state.view === "bracket") evs = evs.filter(e => !isAmericano(e));
  return '<div class="subtabs evtabs" role="tablist">' + evs.map(ev =>
    '<button class="subtab" aria-current="' + (cur && ev.id === cur.id) + '" onclick="setEvent(\'' + ev.id + '\')">' +
    esc(ev.name) + (ev.active ? ' <span class="livedot" aria-hidden="true">●</span>' : '') + '</button>').join("") +
    '</div>';
}

function queueRow(m, opts){
  opts = opts || {};
  const ev = eventById(m.event_id);
  let row = '<div class="queue-row click" data-mid="' + m.id + '" data-eid="' + m.event_id + '" onclick="openMatch(\'' + m.id + '\')">';
  if (opts.pos != null) row += '<span class="qpos">' + opts.pos + '</span>';
  row += '<span class="qnames">' + esc(entrantName(m.entrant1_id)) + ' <span class="qv">vs</span> ' + esc(entrantName(m.entrant2_id)) + '</span>';
  if (m.postponed && !opts.inPostponed) row += '<span class="qtag">Postponed</span>';
  if (opts.showEvent && ev) row += '<span class="qtag">' + esc(ev.name) + '</span>';
  if (state.adminPin && opts.action === "postpone")
    row += '<span class="queue-actions">' +
      '<button class="btn small secondary" title="Type the queue place this match should take"' +
      ' onclick="event.stopPropagation();moveQueuePrompt(\'' + m.id + '\')">Move</button>' +
      '<button class="btn small secondary" onclick="event.stopPropagation();postpone(\'' + m.id + '\', false)">Postpone</button></span>';
  if (state.adminPin && opts.action === "playnext")
    row += '<span class="queue-actions"><button class="btn small secondary" onclick="event.stopPropagation();playNext(\'' + m.id + '\')">Play next</button></span>';
  row += '</div>';
  return row;
}

/* The Americano page is the whole division on one screen: the round on court
   now, what is coming, and the running individual table. Everyone plays every
   round, so there is no queue to manage, just a round counter. */
function renderAmericanoBoard(ev){
  const ms = data.matches.filter(m => m.event_id === ev.id);
  if (!ms.length) return '<div class="empty">This division has no rounds yet.</div>';
  const rounds = americanoRounds(ev);
  const left = ms.filter(m => m.status === "scheduled");
  const pts = evSetting(ev, "points_to_group", 11);
  const done = ms.length - left.length;
  const courts = ev.settings && Array.isArray(ev.settings.courts) && ev.settings.courts.length ? ev.settings.courts : [1, 2];

  /* 1. The courts, one card each, showing the match on that court now. */
  let h = '<div class="section-h"><h2>' + (left.length ? 'On court' : 'All rounds played') +
    '</h2><span class="hint">' + done + ' of ' + ms.length + ' matches played · scores add up to ' + pts + '</span></div>';
  if (left.length){
    h += '<div class="courtgrid">';
    courts.forEach(c => {
      const m = ms.find(x => x.court === c && x.status === "scheduled");
      if (m){
        h += '<button class="courtcard" onclick="openMatch(\'' + m.id + '\')">' +
          '<div class="chead"><span class="cnum">Court ' + c + '</span><span class="tag plain">Round ' + m.round + '</span></div>' +
          '<div class="team">' + esc(entrantName(m.entrant1_id)) + '</div>' +
          '<div class="vs">vs</div><div class="team">' + esc(entrantName(m.entrant2_id)) + '</div>' +
          '<div class="cta">Tap to enter the score</div></button>';
      } else {
        h += '<div class="courtcard idle"><div class="chead"><span class="cnum">Court ' + c + '</span></div>' +
          '<div class="team">Free</div><div class="note" style="margin-top:4px">Next match starts once its players are off court</div></div>';
      }
    });
    h += '</div>';
  }

  /* 2. The schedule, round by round. */
  h += '<div class="section-h"><h2>Schedule</h2></div>';
  rounds.forEach(r => {
    const list = ms.filter(m => m.round === r).sort((a, b) => a.play_order - b.play_order);
    const allIn = list.every(m => m.status === "played");
    const onNow = list.some(m => m.court != null);
    h += '<div class="roundblock"><h3>Round ' + r +
      (allIn ? ' <span class="hint">done</span>' : onNow ? ' <span class="hint">on court</span>' : '') + '</h3>';
    list.forEach(m => { h += scheduleRow(m, false); });
    h += '</div>';
  });

  /* 3. Standings, at the bottom. */
  const table = americanoStandings(ev);
  if (table.length){
    h += '<div class="section-h"><h2>Standings</h2><span class="hint">Total points won</span></div>';
    h += renderAmericanoTable(table);
  }
  return h;
}
function renderAmericanoTable(table){
  let h = '<table class="standings"><thead><tr><th></th><th class="tname">Player</th>' +
    '<th>Pld</th><th>Won</th><th>Points</th><th>Diff</th></tr></thead><tbody>';
  table.forEach((r, i) => {
    h += '<tr><td>' + (i + 1) + '</td><td class="tname">' + esc(r.name) + '</td>' +
      '<td>' + r.p + '</td><td>' + r.w + '</td><td><b>' + r.pf + '</b></td>' +
      '<td>' + (r.diff > 0 ? '+' : '') + r.diff + '</td></tr>';
  });
  return h + '</tbody></table>';
}

/* The Americano division runs on its own courts alongside the main draw, so
   the board can be filtered rather than showing one mixed grid. */
function renderDivisionTabs(){
  const amer = americanoEvent();
  if (!amer) return "";
  const on = state.division === "americano";
  return '<div class="subtabs"><button class="subtab" aria-current="' + on +
    '" onclick="setDivision(\'' + (on ? "main" : "americano") + '\')">' +

}
/* Events that may preview on the Courts tab. The tournament's opening events
   (the earliest start time on the books) show a full day ahead; every later
   batch holds until 12 hours before its start. Only the next batch to play
   (starts within an hour of the earliest upcoming) shows at all, so an
   afternoon event never previews alongside the morning one it waits behind. */
function upcomingSoon(){
  const now = Date.now();
  const withStart = data.events.filter(e => eventStartDate(e));
  if (!withStart.length) return [];
  const minStart = Math.min.apply(null, withStart.map(e => eventStartDate(e).getTime()));
  const eligible = withStart.filter(e => {
    if (e.active || isAmericano(e)) return false;
    const t = eventStartDate(e).getTime();
    /* keep previewing through a 10-minute grace past the start, so the board
       never shows "nothing running" in the sliver between the start moment
       and the next phone's auto-start ping */
    if (t <= now - 10 * 60000) return false;
    if (t - now > (t === minStart ? 24 : 12) * 3600000) return false;
    return data.matches.some(m => m.event_id === e.id && m.status === "scheduled" && m.entrant1_id && m.entrant2_id);
  }).sort((a, b) => eventStartDate(a) - eventStartDate(b));
  if (!eligible.length) return [];
  const first = eventStartDate(eligible[0]).getTime();
  return eligible.filter(e => eventStartDate(e).getTime() <= first + 3600000);
}
/* The next batch's board ahead of time: run the real court-assignment logic
   on a copy of the data with the upcoming events switched on, and show the
   courts and queue exactly as they will stand when play starts. Only rendered
   while nothing is running on the main courts, so it can never contradict a
   live board: pausing the finished event is what swaps this preview in. */
function renderCourtsPreview(soon){
  const sim = JSON.parse(JSON.stringify({ tournament: data.tournament, events: data.events, entrants: data.entrants, matches: data.matches }));
  const ids = new Set(soon.map(e => e.id));
  sim.events.forEach(e => { if (ids.has(e.id)) e.active = true; });
  assignCourtsGlobal(sim);
  const multi = soon.length > 1;
  const when = soon.map(e => esc(e.name) + ' · ' +
    eventStartDate(e).toLocaleString(state.lang === "sw" ? "sw" : [], { weekday: 'short', hour: 'numeric', minute: '2-digit' })).join('&ensp;');
  let h = '<div class="section-h"><h2>Coming up</h2><span class="hint">' + when + '</span></div>';
  h += '<div class="courtgrid">';
  const simOn = sim.matches.filter(m => ids.has(m.event_id) && m.status === "scheduled" && m.court != null);
  for(let c = 1; c <= courtsCount(); c++){
    const m = simOn.find(x => x.court === c);
    if (m){
      const ev = sim.events.find(e => e.id === m.event_id);
      h += '<button class="courtcard" onclick="openMatch(\'' + m.id + '\')">' +
        '<div class="chead"><span class="cnum">Court ' + c + '</span>' +
        (multi ? '<span class="tag plain">' + esc(ev.name) + '</span>' : '') + '</div>' +
        '<div class="team">' + esc(entrantName(m.entrant1_id)) + '</div>' +
        '<div class="vs">vs</div>' +
        '<div class="team">' + esc(entrantName(m.entrant2_id)) + '</div>' +
        '<div class="cta">First up here</div></button>';
    } else {
      h += '<div class="courtcard idle"><div class="chead"><span class="cnum">Court ' + c + '</span></div>' +
        '<div class="team">Free</div></div>';
    }
  }
  h += '</div>';
  const q = weavePending(sim).filter(m => ids.has(m.event_id)).slice(0, 8);
  if (q.length){
    h += '<div class="section-h"><h2>Then</h2></div><div class="roundblock" style="padding-top:2px">';
    h += q.map((m, i) => queueRow(m, { pos: i + 1, showEvent: multi })).join("");
    h += '</div>';
  }
  h += '<p class="note" style="margin-top:10px">A look ahead: this is how the courts will stand when play starts (the event turns itself on 5 minutes before). Tap a match for its estimated time; the full order is on the Schedule tab.</p>';
  return h;
}
function renderBoard(){

  const inView = m => act.some(e => e.id === m.event_id);

        '<div class="team">' + esc(entrantName(m.entrant1_id)) + '</div>' +
        '<div class="vs">vs</div>' +
        '<div class="team">' + esc(entrantName(m.entrant2_id)) + '</div>' +
        '<div class="cta">Tap to enter the score</div></button>';
    } else {
      const canPlace = state.adminPin && q.length > 0;

      if (canPlace){

    h += upNext.map((m, i) => queueRow(m, { pos: i + 1, showEvent: multi, action: "postpone" })).join("");
    h += '</div>';

    }
    if (state.showAllQueue && q.length > upNext.length){
      h += '<div class="roundblock" style="padding-top:2px">';

      h += '</div>';

  const postponedList = data.matches.filter(m => m.status === "scheduled" && m.postponed &&

  if (postponedList.length){
    h += '<div class="section-h"><h2>Postponed</h2><span class="hint">Waiting lower in the queue</span></div><div class="roundblock" style="padding-top:2px">';
    h += postponedList.map(m => queueRow(m, { showEvent: multi, action: "playnext", inPostponed: true })).join("");
    h += '</div>';
  }

  h += '<div class="boardnotes">';
  for(const ev of act){
    const total = data.matches.filter(m => m.event_id === ev.id && m.stage === "group").length;
    const done = data.matches.filter(m => m.event_id === ev.id && m.stage === "group" && m.status === "played").length;
    const ko = data.matches.filter(m => m.event_id === ev.id && m.stage === "knockout").length;
    h += '<span class="note">' + esc(ev.name) + ': ' + done + ' of ' + total + ' group matches played' + (ko ? ', knockout underway' : '') + '</span>';
  }
  h += '</div>';
  return h;
}

function scheduleRow(m, withScore){
  const played = m.status === "played" && m.score1 != null;
  const bye = m.stage === "knockout" && m.status === "played" && m.score1 == null;
  const clickable = !bye && m.entrant1_id && m.entrant2_id;
  let res = '';
  if (withScore){
    if (played){
      const gs = gamesStr(m);
      res = '<span class="res">' + (gs ? esc(gs) : m.score1 + '-' + m.score2) + '</span>' +
        (m.walkover ? ' <span class="tag warn">W/O</span>' : '');
    }
    else if (m.court != null) res = '<span class="res pending">Court ' + m.court + '</span>';
    else if (m.postponed) res = '<span class="res pending">Postponed</span>';
  } else if (played){
    res = '<span class="res pending">✓</span>';
  } else if (m.court != null){
    res = '<span class="res pending">Court ' + m.court + '</span>';
  } else if (m.postponed){
    res = '<span class="res pending">Postponed</span>';
  }
  const inner = '<span class="g">' + (m.group_name ? esc(m.group_name) : '') + '</span>' +
    '<span class="names">' + esc(entrantName(m.entrant1_id) || "TBD") + ' <span class="qv">vs</span> ' + esc(entrantName(m.entrant2_id) || (bye ? "BYE" : "TBD")) + '</span>' + res;
  return clickable
    ? '<button class="srow' + (played ? ' done' : '') + '" onclick="openMatch(\'' + m.id + '\')">' + inner + '</button>'
    : '<div class="srow' + (played ? ' done' : '') + '">' + inner + '</div>';
}
function termFilterFor(){
  const term = state.search.trim().toLowerCase();
  return m => {
    if (!term) return true;
    const n1 = entrantName(m.entrant1_id) || "", n2 = entrantName(m.entrant2_id) || "";
    return n1.toLowerCase().includes(term) || n2.toLowerCase().includes(term);
  };
}

function renderSchedule(){
  const ev = currentEvent();
  if (!ev) return '<div class="empty">No events yet.</div>';
  const evMatches = data.matches.filter(m => m.event_id === ev.id);
  if (!evMatches.length){
    const note = evSetting(ev, "schedule_note", "");
    return '<div class="empty">' + esc(ev.name) + ' has no schedule yet.' + (note ? '<br>Planned: ' + esc(note) : '') + '</div>';
  }
  const groupMs = evMatches.filter(m => m.stage === "group");
  const koMs = evMatches.filter(m => m.stage === "knockout");
  const maxRound = Math.max(0, ...groupMs.map(m => m.round));
  /* Heal a filter that no longer exists (event redrawn, bracket reset). */
  if (state.roundFilter === "ko" ? !koMs.length : state.roundFilter !== "all" && parseInt(state.roundFilter, 10) > maxRound) state.roundFilter = "all";

  let h = '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(ev.name) + ' · Schedule</span>';
  h += '<div class="controls">' +
    '<input class="search" id="search-input" type="text" placeholder="Find a name" value="' + esc(state.search) + '" oninput="setSearch(this.value)">' +
    '<button class="btn small secondary" onclick="window.print()">Print</button></div>';
  h += '<div class="subtabs" role="tablist">' +
    '<button class="subtab" aria-current="' + (state.roundFilter === "all") + '" onclick="setRoundFilter(\'all\')">All</button>';
  for(let r = 1; r <= maxRound; r++){
    h += '<button class="subtab" aria-current="' + (state.roundFilter === String(r)) + '" onclick="setRoundFilter(\'' + r + '\')">Round ' + r + '</button>';
  }
  if (koMs.length) h += '<button class="subtab" aria-current="' + (state.roundFilter === "ko") + '" onclick="setRoundFilter(\'ko\')">Knockout</button>';
  h += '</div>';

  const matchesTerm = termFilterFor();

  if (state.roundFilter === "ko"){
    if (!koMs.length) return h + '<div class="empty">No knockout matches yet.</div>';
    const total = Math.max(...koMs.map(x => x.bracket_round));
    for(let r = 1; r <= total; r++){
      const list = koMs.filter(m => m.bracket_round === r && matchesTerm(m)).sort((a, b) => a.bracket_pos - b.bracket_pos);
      if (!list.length) continue;
      h += '<div class="roundblock"><h3>' + roundLabelFor(r, total) + '</h3>' + list.map(m => scheduleRow(m, true)).join("") + '</div>';
    }
    return h;
  }

  const shown = groupMs.filter(m => (state.roundFilter === "all" || String(m.round) === state.roundFilter) && matchesTerm(m));
  const shownKo = state.roundFilter === "all" ? koMs.filter(matchesTerm) : [];
  if (!shown.length && !shownKo.length) return h + '<div class="empty">No matches found.</div>';
  for(let r = 1; r <= maxRound; r++){
    const list = shown.filter(m => m.round === r).sort((a, b) => a.play_order - b.play_order);
    if (!list.length) continue;
    const allDone = list.every(m => m.status === "played");
    if (allDone && state.roundFilter === "all"){
      /* Finished rounds fold away; tap to peek. */
      h += '<details class="roundblock folded"><summary><h3>Round ' + r + ' <span class="hint">complete · ' + list.length + ' matches</span></h3></summary>' +
        list.map(m => scheduleRow(m, true)).join("") + '</details>';
    } else {
      h += '<div class="roundblock"><h3>Round ' + r + '</h3>' + list.map(m => scheduleRow(m, true)).join("") + '</div>';
    }
  }
  /* Knockout matches show on the "All" page too while they're live, not only
     under the Knockout tab. */
  if (shownKo.length){
    const koTotal = Math.max(...koMs.map(x => x.bracket_round));
    for(let r = 1; r <= koTotal; r++){
      const list = shownKo.filter(m => m.bracket_round === r).sort((a, b) => a.bracket_pos - b.bracket_pos);
      if (!list.length) continue;
      h += '<div class="roundblock"><h3>' + roundLabelFor(r, koTotal) + '</h3>' + list.map(m => scheduleRow(m, true)).join("") + '</div>';
    }
  }
  h += '<p class="note">Matches run in this order, group A first, so everyone plays round 1 before round 2 starts. Played matches show their scores; tap a match for details. A score can be entered while the match is on a court, and corrections go through the desk.</p>';
  return h;
}

function renderStandings(){
  const ev = currentEvent();
  if (!ev) return '<div class="empty">No events yet.</div>';
  /* Americano is scored per player across rotating partners, so the group
     table would be 28 one-match "teams" and tell nobody anything. */
  if (isAmericano(ev)){
    const table = americanoStandings(ev);
    const played = data.matches.filter(m => m.event_id === ev.id && m.status === "played").length;
    const total = data.matches.filter(m => m.event_id === ev.id).length;
    let h = '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(ev.name) + ' · Standings</span>';
    h += '<div class="section-h"><h2>' + esc(ev.name) + '</h2><span class="hint">' +
      'Every point you win counts, whoever you are partnered with · ' + played + ' of ' + total + ' matches in</span></div>';
    return h + (table.length ? renderAmericanoTable(table) : '<div class="empty">No players yet.</div>');
  }
  const groups = groupsOfEvent(ev);
  if (!groups.length){
    const note = evSetting(ev, "schedule_note", "");
    return '<div class="empty">' + esc(ev.name) + ' has no groups yet.' + (note ? '<br>Planned: ' + esc(note) : '') + '</div>';
  }
  const field = seedFieldFor(ev);
  const adv = Math.max(1, field.guaranteed);
  if (state.standingsFilter !== "all" && !groups.includes(state.standingsFilter)) state.standingsFilter = "all";
  const f = state.standingsFilter;
  let h = '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(ev.name) + ' · Standings</span>';
  h += '<div class="section-h"><h2>' + esc(ev.name) + '</h2><span class="hint">Top ' + adv + ' per group advance' +
    (field.wildcards ? ' plus ' + field.wildcards + ' best next-placed' : '') + ' · tap a team for details</span></div>';
  if (groups.length > 1){
    h += '<div class="subtabs" role="tablist">' +
      '<button class="subtab" aria-current="' + (f === "all") + '" onclick="setStandingsFilter(\'all\')">All</button>' +
      groups.map(g => '<button class="subtab" aria-current="' + (f === g) + '" onclick="setStandingsFilter(\'' + jsAttr(g) + '\')">Group ' + esc(g) + '</button>').join("") +
      '</div>';
  }
  for(const g of groups){
    if (f !== "all" && f !== g) continue;
    const rows = standingsFor(ev, g);
    const left = data.matches.filter(m => m.event_id === ev.id && m.stage === "group" && m.group_name === g && m.status === "scheduled").length;
    h += '<div class="group-card"><h3><span>Group ' + esc(g) + '</span>' + (left ? '<span class="tag plain">' + left + ' left</span>' : '<span class="tag plain">Complete</span>') + '</h3>';
    h += '<table class="standings"><thead><tr><th></th><th class="tname">Team</th><th>P</th><th>W</th><th>L</th><th>+/-</th></tr></thead><tbody>';
    rows.forEach((r, i) => {
      h += '<tr onclick="openTeam(\'' + r.id + '\')"><td class="pos">' + (i + 1) + '</td><td class="tname">' + esc(r.name) + '</td>' +
        '<td>' + r.p + '</td><td>' + r.w + '</td><td>' + r.l + '</td><td>' + (r.diff > 0 ? '+' : '') + r.diff + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<p class="note">Tiebreakers follow the USA Pickleball order: wins, then head to head between the tied teams, ' +
    'then point difference, then head to head point difference. Teams still level after that are split on points scored. ' +
    'A walkover counts as a win but adds no points either way.</p>';
  return h;
}

/* Single-sided bracket geometry. Round r (0-based) match j sits at a fixed
   vertical centre; the spacing doubles each round so a pair's elbow always
   meets at the next round's slot. Mirrors design 4 from the mockups. */
const BK_P = 114, BK_MH = 76, BK_HALF = 38, BK_COLW = 152;
function bkCenter(r, j){ return BK_HALF + BK_P * (Math.pow(2, r) - 1) / 2 + j * BK_P * Math.pow(2, r); }
function bkBodyH(totalRounds){ return BK_MH + (Math.pow(2, totalRounds - 1) - 1) * BK_P; }
function bkTeamRow(name, cls, score, extra){
  return '<div class="bkteam ' + (cls || '') + '"><span class="bkname">' + name + (extra || '') + '</span>' +
    (score != null ? '<span class="bkscore">' + score + '</span>' : '') + '</div>';
}
function bkRoundCol(label, cells, bodyH){
  return '<div class="bkcol" style="width:' + BK_COLW + 'px"><div class="bkhead">' + esc(label) + '</div>' +
    '<div class="bkbody" style="height:' + bodyH + 'px">' + cells.join('') + '</div></div>';
}
/* Connector column between round r and r+1, where round r+1 has nNext matches. */
function bkConnCol(r, nNext, bodyH){
  let h = '<div class="bkconn"><div class="bkhead">&nbsp;</div><div class="bkbody" style="height:' + bodyH + 'px">';
  for(let j = 0; j < nNext; j++){
    const top = bkCenter(r, 2 * j), bot = bkCenter(r, 2 * j + 1);
    h += '<div class="bkelbow" style="top:' + top + 'px;height:' + (bot - top) + 'px"></div>';
    h += '<div class="bkarrow" style="top:' + bkCenter(r + 1, j) + 'px"></div>';
  }
  return h + '</div></div>';
}
function bkChampCol(champHtml, totalRounds, bodyH){
  const cy = bkCenter(totalRounds - 1, 0);
  return '<div class="bkconn"><div class="bkhead">&nbsp;</div><div class="bkbody" style="height:' + bodyH + 'px">' +
      '<div class="bkarrow bkarrow-champ" style="top:' + cy + 'px"></div></div></div>' +
    '<div class="bkcol" style="width:' + BK_COLW + 'px"><div class="bkhead">Champion</div>' +
      '<div class="bkbody" style="height:' + bodyH + 'px"><div class="bkchamp" style="top:' + (cy - 44) + 'px">' + champHtml + '</div></div></div>';
}
function bkSideCls(hasName, isWin, played){
  if (!hasName) return 'bkm-tbd';
  if (isWin) return 'bkm-win';
  if (played) return 'bkm-lose';
  return 'bkm-pending';
}
const bkChampTbd = '<div class="bkchamp-card tbd"><div class="bkchamp-trophy">🏆</div><div class="bkchamp-label">Champion</div><div class="bkchamp-name tbd">To be decided</div></div>';

function renderBracket(){
  const ev = currentEvent();
  if (!ev) return '<div class="empty">No events yet.</div>';
  if (isAmericano(ev)){
    return '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(ev.name) + '</span>' +
      '<div class="empty">' + esc(ev.name) + ' has no bracket. It is decided on total points won, so the Standings tab is the result.</div>';
  }
  const ko = data.matches.filter(m => m.event_id === ev.id && m.stage === "knockout");

  /* Projected bracket: before the desk confirms the knockout, show the seeds. */
  if (!ko.length){
    const groups = groupsOfEvent(ev);
    if (!groups.length) return '<div class="empty">' + esc(ev.name) + ' has no groups yet.</div>';
    const field = seedFieldFor(ev);
    if (field.seeds.length < 2) return '<div class="empty">Not enough teams yet.</div>';
    const left = data.matches.filter(m => m.event_id === ev.id && m.stage === "group" && m.status === "scheduled").length;
    const pairs = bracketPairs(field.seeds);
    const size = nextPow2(Math.max(2, field.seeds.length));
    const totalRounds = Math.log2(size);
    const bodyH = bkBodyH(totalRounds);
    const seedRow = s => !s ? bkTeamRow('BYE', 'bkm-tbd')
      : bkTeamRow(esc(s.group + s.place), 'bkm-seed', null, s.wildcard ? ' <span class="bktag">Best ' + ordinal(s.place) + '</span>' : '');
    const tbdRow = () => bkTeamRow('TBD', 'bkm-tbd');

    let h = '<div class="bkwrap"><div class="bk">';
    for(let r = 0; r < totalRounds; r++){
      const count = size / Math.pow(2, r + 1);
      const cells = [];
      for(let j = 0; j < count; j++){
        const top = bkCenter(r, j) - BK_HALF;
        const rows = r === 0 ? (seedRow(pairs[j][0]) + seedRow(pairs[j][1])) : (tbdRow() + tbdRow());
        cells.push('<div class="bkmatch" style="top:' + top + 'px">' + rows + '</div>');
      }
      h += bkRoundCol(roundLabelFor(r + 1, totalRounds), cells, bodyH);
      if (r < totalRounds - 1) h += bkConnCol(r, size / Math.pow(2, r + 2), bodyH);
    }
    h += bkChampCol(bkChampTbd, totalRounds, bodyH);
    h += '</div></div>';
    h += '<p class="note">A1 means the group A winner, C2 the group C runner-up, from standings right now, so matchups can shift until group play ends. ' +
      'Round 1 is on the left and winners move to the right, toward the final and champion. ' +
      field.seeds.length + ' qualify for a ' + size + '-slot bracket' +
      (field.wildcards ? ', including ' + field.wildcards + ' wildcard' + (field.wildcards > 1 ? 's' : '') + ' from the next places' : '') +
      '. The real bracket is created when the desk confirms the group stage is finished.</p>';
    return h;
  }

  /* Live bracket. */
  const total = Math.max(...ko.map(m => m.bracket_round));
  const bodyH = bkBodyH(total);
  const wo = ' <span class="bktag">W/O</span>';
  const matchCell = (m, r, j) => {
    const n1 = entrantName(m.entrant1_id), n2 = entrantName(m.entrant2_id);
    const played = m.status === "played" && m.score1 != null;
    const bye = m.status === "played" && m.score1 == null;
    const w1 = played && m.score1 > m.score2, w2 = played && m.score2 > m.score1;
    const rows =
      bkTeamRow(n1 ? esc(n1) : 'TBD', bkSideCls(!!n1, w1, played), played ? m.score1 : null, m.walkover && w1 ? wo : '') +
      bkTeamRow(n2 ? esc(n2) : (bye ? 'BYE' : 'TBD'), bkSideCls(!!n2, w2, played), played ? m.score2 : null, m.walkover && w2 ? wo : '');
    const top = bkCenter(r, j) - BK_HALF;
    const clickable = !bye && m.entrant1_id && m.entrant2_id;
    const editable = !!(state.adminPin && m.status === "scheduled" && !bye);
    /* Editable cells keep the two buttons as siblings, never nested. */
    if (editable){
      const main = clickable
        ? '<button class="bkmain" onclick="openMatch(\'' + m.id + '\')">' + rows + '</button>'
        : rows;
      return '<div class="bkmatch editable" style="top:' + top + 'px">' + main +
        '<button class="bedit" onclick="openSlotEditor(\'' + m.id + '\')">Edit</button></div>';
    }
    return clickable
      ? '<button class="bkmatch" style="top:' + top + 'px" onclick="openMatch(\'' + m.id + '\')">' + rows + '</button>'
      : '<div class="bkmatch" style="top:' + top + 'px">' + rows + '</div>';
  };

  const final = ko.find(m => m.bracket_round === total);
  let champHtml;
  if (final && final.status === "played" && final.score1 != null){
    const champ = final.score1 > final.score2 ? final.entrant1_id : final.entrant2_id;
    champHtml = '<div class="bkchamp-card"><div class="bkchamp-trophy">🏆</div><div class="bkchamp-label">Champion</div><div class="bkchamp-name win">' + esc(entrantName(champ)) + '</div></div>';
  } else {
    champHtml = bkChampTbd;
  }

  let h = '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(ev.name) + ' · Bracket</span>';
  h += '<div class="bkwrap"><div class="bk">';
  for(let r = 1; r <= total; r++){
    const list = ko.filter(m => m.bracket_round === r).sort((a, b) => a.bracket_pos - b.bracket_pos);
    h += bkRoundCol(roundLabelFor(r, total), list.map((m, j) => matchCell(m, r - 1, j)), bodyH);
    if (r < total) h += bkConnCol(r - 1, ko.filter(m => m.bracket_round === r + 1).length, bodyH);
  }
  h += bkChampCol(champHtml, total, bodyH);
  h += '</div></div>';
  h += '<p class="note">Winners move to the right, round by round, toward the champion. Tap a match to see or enter its result.' +
    (state.adminPin ? ' Unplayed matches have an Edit link to fix the teams by hand.' : '') + '</p>';
  return h;
}

  h += '<div class="panel"><h3>Admin powers on the other tabs</h3><p class="note">' +
    'While unlocked: tap any match anywhere (Courts, Schedule, a team in Standings, or the Bracket) to fix or clear its score, enter a walkover, or postpone. ' +
    'Players can only enter a score while a match is on a court; admins can score anything from anywhere. ' +
    'An on-court match can be sent back with "Take off court": either the next match in line takes its court, or you pick the one to bring on. ' +
    'Pause the finished event: with nothing running, the Courts tab previews the next batch\'s courts (the tournament\'s opening events a day ahead, every later batch from 12 hours before its start). ' +
    'The Courts tab has Postpone on the queue and Play next on postponed matches, and each waiting row\'s Move button asks for the queue place it should take. ' +

    'On the Bracket tab, unplayed matches have an Edit teams link for manual fixes. ' +
    'Everything updates live on everyone\'s phone.</p></div>';

  if (store.mode === "live"){
    h += '<div class="panel"><h3>Change PIN</h3><div class="fieldrow">' +
      '<div class="field"><label for="adm-oldpin">Current PIN</label><input id="adm-oldpin" type="password"></div>' +
      '<div class="field"><label for="adm-newpin">New PIN</label><input id="adm-newpin" type="password"></div></div>' +
      '<button class="btn small secondary" onclick="doChangePin()">Change PIN</button></div>';
  }
  h += '<p style="margin-top:6px"><button class="btn secondary small" onclick="adminSignOut()">Sign out of admin</button></p>';
  return h;
}

/* ---------- modals ---------- */
function renderScoreModal(){
  if (!state.modalMatchId) return "";
  const m = data.matches.find(x => x.id === state.modalMatchId);
  if (!m) return "";
  const n1 = entrantName(m.entrant1_id) || "TBD", n2 = entrantName(m.entrant2_id) || "TBD";
  const played = m.status === "played" && m.score1 != null;
  const isAdmin = !!state.adminPin;
  /* Players can only enter scores for matches currently on a court; everything
     else is read-only for them (admins can score any match from anywhere). */
  const onCourt = m.status === "scheduled" && m.court != null;
  const infoOnly = !isAdmin && !played && !onCourt;
  const pts = matchPts(m);
  const bo = matchBestOf(m);
  const ev = eventById(m.event_id);

  let h = '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">';
  h += '<h3>' + (played ? 'Match result' : infoOnly ? 'Upcoming match' : 'Enter score') + '</h3>';
  h += '<div class="sub">' + esc(ev ? ev.name : '') + ' · ' + esc(roundName(m)) + (m.court != null && !played ? ' · Court ' + m.court : '') +
    ' · ' + (matchSumTo(m)
      ? 'scores add up to ' + matchSumTo(m)
      : (bo > 1 ? 'best of ' + bo + ', games' : 'first') + ' to ' + pts + (matchWinBy2(m) ? ', win by 2' : '')) + '</div>';

  const adminExtras = () => {
    let x = '';
    if (isAdmin && m.status === "scheduled"){
      /* Americano matches rotate through their own pool; taking one off would
         hand its court number to a main-draw replacement. */
      if (m.court != null && !isAmericano(eventById(m.event_id)))
        x += '<button class="btn small secondary" onclick="openOffCourt(\'' + m.id + '\')">Take off court</button>';
      x += '<button class="btn small secondary" onclick="postpone(\'' + m.id + '\', false, true)">Postpone</button>';
    }
    if (isAdmin && played) x += '<button class="btn small danger" onclick="clearScore(\'' + m.id + '\')">Clear score</button>';
    return x;
  };
  const walkoverRow = () => {
    if (!isAdmin || !m.entrant1_id || !m.entrant2_id) return '';
    return '<p class="note" style="margin-top:10px">No-show? Record a walkover win:</p>' +
      '<div class="actions" style="margin-top:4px">' +
      '<button class="btn small secondary" onclick="walkover(\'' + m.id + '\', 1)">W/O · ' + esc(n1) + '</button>' +
      '<button class="btn small secondary" onclick="walkover(\'' + m.id + '\', 2)">W/O · ' + esc(n2) + '</button></div>';
  };

  if (played && !isAdmin){
    h += '<div class="score-line"><label>' + esc(n1) + '</label><span style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums">' + m.score1 + '</span></div>';
    h += '<div class="score-line"><label>' + esc(n2) + '</label><span style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums">' + m.score2 + '</span></div>';
    const gs = gamesStr(m);

    h += '<div class="game-line"><span class="glabel"></span><span style="flex:1;font-size:12px;font-weight:700;color:var(--muted);overflow-wrap:anywhere">' + esc(n1) + '</span><span style="flex:1;font-size:12px;font-weight:700;color:var(--muted);overflow-wrap:anywhere;text-align:right">' + esc(n2) + '</span></div>';

    if (!isAdmin) h += '<p class="note">One entry per match: after that, corrections go through the desk.</p>';
    h += '<div class="actions">' + adminExtras() +
      '<span class="spacer"></span><button class="btn secondary" onclick="closeModal()">Close</button>' +
      '<button class="btn" onclick="saveScore(\'' + m.id + '\')">' + (isAdmin ? 'Save (admin)' : 'Save score') + '</button></div>';
    h += walkoverRow();
  } else {
    h += '<div class="score-line"><label for="score1">' + esc(n1) + '</label><input class="score-in" id="score1" type="number" inputmode="numeric" min="0" value="' + (played ? m.score1 : '') + '"></div>';
    h += '<div class="score-line"><label for="score2">' + esc(n2) + '</label><input class="score-in" id="score2" type="number" inputmode="numeric" min="0" value="' + (played ? m.score2 : '') + '"></div>';
    h += '<div class="err" id="score-err"></div>';
    if (!isAdmin) h += '<p class="note">Winners report the score. One entry per match: after that, corrections go through the desk.</p>';
    h += '<div class="actions">' + adminExtras() +
      '<span class="spacer"></span><button class="btn secondary" onclick="closeModal()">Close</button>' +
      '<button class="btn" onclick="saveScore(\'' + m.id + '\')">' + (isAdmin ? 'Save (admin)' : 'Save score') + '</button></div>';
    h += walkoverRow();

  h += '</div></div>';

function renderTeamModal(){
  if (!state.teamModalId || state.modalMatchId) return "";
  const e = entrantById(state.teamModalId);
  if (!e) return "";
  const ev = eventById(e.event_id);
  const ms = data.matches
    .filter(m => (m.entrant1_id === e.id || m.entrant2_id === e.id))
    .sort((a, b) => (a.stage === b.stage ? a.play_order - b.play_order : a.stage === "group" ? -1 : 1));
  let w = 0, l = 0;
  ms.forEach(m => {
    if (m.status !== "played" || m.score1 == null) return;
    const mine = m.entrant1_id === e.id ? m.score1 : m.score2;
    const theirs = m.entrant1_id === e.id ? m.score2 : m.score1;
    if (mine > theirs) w++; else l++;
  });

  let h = '<div class="overlay" onclick="if(event.target===this)closeTeam()"><div class="modal" role="dialog" aria-modal="true">';
  h += '<h3>' + esc(e.name) + '</h3>';
  h += '<div class="sub">' + esc(ev ? ev.name : '') + (e.group_name ? ' · Group ' + esc(e.group_name) : '') + ' · ' + w + '-' + l + '</div>';
  h += ms.map(m => {
    const opp = entrantName(m.entrant1_id === e.id ? m.entrant2_id : m.entrant1_id);
    const played = m.status === "played" && m.score1 != null;
    const bye = m.stage === "knockout" && m.status === "played" && m.score1 == null;
    let res;
    if (played){
      const mine = m.entrant1_id === e.id ? m.score1 : m.score2;
      const theirs = m.entrant1_id === e.id ? m.score2 : m.score1;
      const gs = gamesStr(m);
      res = '<span class="tmres ' + (mine > theirs ? 'w' : 'l') + '">' + (mine > theirs ? 'W' : 'L') + ' ' + mine + '-' + theirs +
        (m.walkover ? ' <span class="tmgames">W/O</span>' : '') +
        (gs ? ' <span class="tmgames">(' + esc(gs) + ')</span>' : '') + '</span>';
    } else if (bye){
      res = '<span class="tmres pending">Bye</span>';
    } else if (m.court != null){
      res = '<span class="tmres pending">Court ' + m.court + '</span>';
    } else if (m.postponed){
      res = '<span class="tmres pending">Postponed</span>';
    } else {
      res = '<span class="tmres pending">To play</span>';
    }
    const clickable = !bye && m.entrant1_id && m.entrant2_id;
    const inner = '<span class="tmround">' + esc(roundName(m)) + '</span>' +
      '<span class="tmopp">' + (opp ? 'vs ' + esc(opp) : 'Opponent TBD') + '</span>' + res;
    return clickable
      ? '<button class="tmrow" onclick="openMatch(\'' + m.id + '\')">' + inner + '</button>'
      : '<div class="tmrow">' + inner + '</div>';
  }).join("");
  h += '<div class="actions"><span class="spacer"></span><button class="btn secondary" onclick="closeTeam()">Close</button></div>';
  h += '</div></div>';
  return h;
}

/* Admin: pick a waiting match to drop onto a specific free court. Lists the
   whole cross-event queue so any waiting match can override the auto pool. */
function renderCourtAssignModal(){
  if (state.assignCourt == null) return "";
  const c = state.assignCourt;
  /* only offer matches whose teams are free right now; the server enforces
     the same rule, this just keeps the picker honest */
  const busyIds = new Set(onCourtMatches().flatMap(m => [m.entrant1_id, m.entrant2_id]));
  const q = pendingQueue().filter(m => !busyIds.has(m.entrant1_id) && !busyIds.has(m.entrant2_id));
  const multi = activeEvents().length > 1;
  let h = '<div class="overlay" onclick="if(event.target===this)closeCourtAssign()"><div class="modal" role="dialog" aria-modal="true">';
  h += '<h3>Put a match on Court ' + c + '</h3>';
  h += '<div class="sub">Pick a waiting match to send to Court ' + c + ' now.</div>';
  if (!q.length){
    h += '<p class="note">No match is waiting right now.</p>';
  } else {
    h += '<div class="roundblock" style="padding-top:2px">';
    h += q.slice(0, 40).map((m, i) => {
      const ev = eventById(m.event_id);
      return '<button class="queue-row click" onclick="assignToCourt(\'' + m.id + '\', ' + c + ')">' +
        '<span class="qpos">' + (i + 1) + '</span>' +
        '<span class="qnames">' + esc(entrantName(m.entrant1_id)) + ' <span class="qv">vs</span> ' + esc(entrantName(m.entrant2_id)) + '</span>' +
        (multi && ev ? '<span class="qtag">' + esc(ev.name) + '</span>' : '') + '</button>';
    }).join("");
    h += '</div>';
  }
  h += '<div class="actions"><span class="spacer"></span><button class="btn secondary" onclick="closeCourtAssign()">Cancel</button></div>';
  h += '</div></div>';
  return h;
}

/* Admin: pull an on-court match off and choose who comes on, either the next in
   line or a specific waiting match. The pulled match goes to the front of its
   queue either way. */
function renderOffCourtModal(){
  if (!state.offCourtId) return "";
  const m = data.matches.find(x => x.id === state.offCourtId);
  if (!m) return "";
  /* the off match's own players are leaving, so they do not count as busy */
  const busyIds = new Set(onCourtMatches().filter(x => x.id !== m.id).flatMap(x => [x.entrant1_id, x.entrant2_id]));
  const q = pendingQueue().filter(x => !busyIds.has(x.entrant1_id) && !busyIds.has(x.entrant2_id));
  const multi = activeEvents().length > 1;
  let h = '<div class="overlay" onclick="if(event.target===this)closeOffCourt()"><div class="modal" role="dialog" aria-modal="true">';
  h += '<h3>Take this match off Court ' + m.court + '</h3>';
  h += '<div class="sub">' + esc(entrantName(m.entrant1_id)) + ' <span class="qv">vs</span> ' + esc(entrantName(m.entrant2_id)) + '</div>';
  if (q.length){
    h += '<p class="note" style="margin:0 0 10px">It goes to the front of its queue. Who comes on Court ' + m.court + '?</p>';
    h += '<button class="btn" style="width:100%" onclick="swapOut(\'' + m.id + '\')">Bring on the next in line</button>';
    h += '<div class="microlabel" style="margin:14px 0 4px">Or bring on someone specific</div>';
    h += '<div class="roundblock" style="padding-top:2px">';
    h += q.slice(0, 40).map(x => {
      const ev = eventById(x.event_id);
      return '<button class="queue-row click" onclick="swapTo(\'' + m.id + '\', \'' + x.id + '\')">' +
        '<span class="qnames">' + esc(entrantName(x.entrant1_id)) + ' <span class="qv">vs</span> ' + esc(entrantName(x.entrant2_id)) + '</span>' +
        (multi && ev ? '<span class="qtag">' + esc(ev.name) + '</span>' : '') + '</button>';
    }).join("");
    h += '</div>';
  } else {
    h += '<p class="note">No other match is waiting, so this one would stay on court.</p>';
  }
  h += '<div class="actions"><span class="spacer"></span><button class="btn secondary" onclick="closeOffCourt()">Cancel</button></div>';
  h += '</div></div>';
  return h;
}

let lastAutostartPing = 0;
/* Overlapping reloads (realtime storm + the 3-minute interval + a user
   action) must not let a slower, older fetch overwrite a fresher one: each
   reload takes a generation number and only the newest is allowed to land. */
let loadGen = 0;
async function reload(background){
  const gen = ++loadGen;
  try{
    /* Let scheduled events turn themselves on (5 minutes early). Any phone's
       refresh can trigger it; once a minute per phone is plenty. */
    if (store.autostartDue && Date.now() - lastAutostartPing > 60000){
      lastAutostartPing = Date.now();
      store.autostartDue().catch(() => {});
    }
    /* A background refresh (realtime/interval) pulls only the running events'
       matches to save egress, then keeps the other events' matches from the
       last full load. Admin actions and the initial load run full. */
    const activeOnly = !!(background && data.tournament) &&
      !(store.takeFullReloadHint && store.takeFullReloadHint());
    let fresh = await store.loadAll(activeOnly);
    if (activeOnly && Array.isArray(data.matches)){
      const was = (data.events || []).filter(e => e.active).map(e => e.id);
      const now = new Set((fresh.events || []).filter(e => e.active).map(e => e.id));
      /* An event that has just been paused drops out of the background fetch,
         so merging would freeze its matches at whatever we last saw and leave
         phones showing courts it no longer holds. Pull everything once instead. */
      if (was.some(id => !now.has(id))) fresh = await store.loadAll(false);
      else fresh.matches = data.matches.filter(m => !now.has(m.event_id)).concat(fresh.matches || []);
    }
    if (gen !== loadGen) return;   /* a newer reload superseded this one */
    data = fresh;
    state.loadError = null;
    maybeBackup();
    if (state.eventId && !eventById(state.eventId)) state.eventId = null;
    if (state.adminEventId && !eventById(state.adminEventId)) state.adminEventId = null;
    /* Drop modal state whose record vanished (deleted on another device),
       otherwise a dead modalMatchId silently blocks the team modal forever. */
    if (state.modalMatchId && !data.matches.some(m => m.id === state.modalMatchId)) state.modalMatchId = null;
    if (state.slotEditId && !data.matches.some(m => m.id === state.slotEditId)) state.slotEditId = null;
    if (state.offCourtId && !data.matches.some(m => m.id === state.offCourtId)) state.offCourtId = null;
    if (state.teamModalId && !data.entrants.some(e => e.id === state.teamModalId)) state.teamModalId = null;
    if (state.adminPin){
      try{
        const rc = await store.adminListContacts(state.adminPin);
        state.contacts = {};
        if (rc.ok && Array.isArray(rc.data)) rc.data.forEach(x => { state.contacts[x.entrant_id] = x.phones || []; });
      }catch(e){}
    }
  }catch(e){
    let msg = e.message || String(e);
    if (/does not exist|schema cache/i.test(msg)){
      msg = "The database tables aren't set up yet. Run supabase-schema.sql once in the Supabase SQL editor, then refresh.";
    }
    state.loadError = msg;
  }
  render();
}

/* Every device quietly keeps an offline copy of the whole tournament in its
   own browser storage, refreshed each time another 25 matches are recorded.
   If the database is ever wiped or broken, any phone that had the page open
   still holds the last snapshot (Admin has a download button for it). Never
   overwritten by a suddenly emptier database: that is the moment it is for. */
function maybeBackup(){
  try{
    const played = (data.matches || []).filter(m => m.status === "played").length;
    if (!played) return;
    let prev = null;
    try{ prev = JSON.parse(safeLocal("pb_backup") || "null"); }catch(_){}
    const prevPlayed = (prev && prev.played) || 0;
    if (played < prevPlayed - 5) return;   /* looks like a wipe: keep the old copy */
    if (prev && Math.floor(played / 25) <= Math.floor(prevPlayed / 25)) return;
    safeLocal("pb_backup", JSON.stringify({
      taken_at: new Date().toISOString(), played,
      tournament: data.tournament && data.tournament.name,
      events: data.events, entrants: data.entrants, matches: data.matches
    }));
  }catch(_){}
}
function downloadBackup(){
  const raw = safeLocal("pb_backup");
  if (!raw){ toast("No backup saved on this device yet."); return; }
  const blob = new Blob([raw], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nairobi-open-backup.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function collectGames(bo){
  const games = [];
  for(let g = 1; g <= bo; g++){
    const a = document.getElementById("g" + g + "a").value;
    const b = document.getElementById("g" + g + "b").value;
    if (a === "" && b === "") continue;
    games.push([parseInt(a, 10), parseInt(b, 10)]);
  }
  return games;
}
async function saveScore(matchId){
  const m = data.matches.find(x => x.id === matchId);
  const bo = m ? matchBestOf(m) : 1;
  const pts = m ? matchPts(m) : 21;
  const wb2 = m ? matchWinBy2(m) : false;
  /* What this screen believed when saving: if it thought the match was
     unscored but a score has just arrived from the court, the server refuses
     rather than silently overwriting someone's fresh entry. */
  const had = m ? m.status === "played" : null;
  const errEl = document.getElementById("score-err");
  let r;
  if (bo > 1){
    const games = collectGames(bo);
    /* Admin scores are free-form, but an off-format score must be
       acknowledged so typos don't slip through as overrides. */
    if (state.adminPin){
      const strict = validateGames(games, pts, false, bo, wb2);
      const lenient = validateGames(games, pts, true, bo, wb2);
      if (!lenient.error && strict.error && !confirm(swText(strict.error) + " " + swText("Save anyway (admin override)?"))) return;
    }
    r = state.adminPin
      ? await store.adminSubmitScore(state.adminPin, matchId, null, null, games, false, had)
      : await store.submitScore(matchId, null, null, games);
  } else {
    const s1 = parseInt(document.getElementById("score1").value, 10);
    const s2 = parseInt(document.getElementById("score2").value, 10);
    if (state.adminPin){
      const sumTo = m ? matchSumTo(m) : null;
      const strict = validateScore(s1, s2, pts, false, wb2, sumTo);
      const lenient = validateScore(s1, s2, pts, true, wb2, sumTo);
      if (!lenient && strict && !confirm(swText(strict) + " " + swText("Save anyway (admin override)?"))) return;
    }
    r = state.adminPin
      ? await store.adminSubmitScore(state.adminPin, matchId, s1, s2, null, false, had)
      : await store.submitScore(matchId, s1, s2);
  }
  if (!r.ok){ errEl.textContent = swText(r.error || "Something went wrong."); return; }
  state.modalMatchId = null;
  toast("Score saved");
  await reload();
}
async function walkover(matchId, side){
  const m = data.matches.find(x => x.id === matchId);
  if (!m) return;
  const winner = entrantName(side === 1 ? m.entrant1_id : m.entrant2_id);
  if (!confirm(swText("Record a walkover win for " + winner + "?"))) return;
  const bo = matchBestOf(m);
  const pts = bo > 1 ? Math.floor(bo / 2) + 1 : matchPts(m);
  const s1 = side === 1 ? pts : 0, s2 = side === 1 ? 0 : pts;
  const r = await store.adminSubmitScore(state.adminPin, matchId, s1, s2, null, true, m.status === "played");
  if (!r.ok){ const errEl = document.getElementById("score-err"); if (errEl) errEl.textContent = swText(r.error); else toast(r.error); return; }
  state.modalMatchId = null;
  toast("Walkover recorded");
  await reload();
}
async function clearScore(matchId){
  if (!confirm(swText("Clear this score? The match goes back into the queue."))) return;
  const r = await store.adminClearScore(state.adminPin, matchId);
  if (!r.ok){ const errEl = document.getElementById("score-err"); if (errEl) errEl.textContent = swText(r.error); else toast(r.error); return; }
  state.modalMatchId = null;
  toast("Score cleared");
  await reload();
}
async function postpone(matchId, toEnd, fromModal){
  const m = data.matches.find(x => x.id === matchId);
  if (m && m.court != null &&
      !confirm(swText("This match is on Court " + m.court + ". Pull it off the court and postpone it?"))) return;
  const r = await store.adminPostpone(state.adminPin, matchId, toEnd);
  if (!r.ok){ toast(r.error || "Could not postpone."); return; }
  if (fromModal) state.modalMatchId = null;
  toast(toEnd ? "Moved to the end of the queue" : "Postponed");
  await reload();
}

/* Mirror of the server's move: slot the match between its event neighbours by
   play_order midpoint. Applied locally before the round-trip so the row lands
   where it is going the moment the number is entered instead of jumping late. */
function applyLocalMove(matchId, beforeId){
  const m = data.matches.find(x => x.id === matchId);
  if (!m) return;
  const sibs = data.matches
    .filter(x => x.event_id === m.event_id && x.status === "scheduled" && x.id !== m.id)
    .sort((a, b) => a.play_order - b.play_order);
  if (!sibs.length) return;
  if (beforeId == null){ m.play_order = sibs[sibs.length - 1].play_order + 10; m.postponed = false; return; }
  const t = sibs.find(x => x.id === beforeId);
  if (!t) return;
  const prev = sibs.filter(x => x.play_order < t.play_order).pop();
  m.play_order = prev ? (prev.play_order + t.play_order) / 2 : t.play_order - 10;
  m.postponed = false;
}
/* Reorder the queue by typing the place a match should take, using the numbers
   the Up next list shows. A match still only holds a position within its own
   event (the display interleaves events to share courts fairly), so the number
   resolves to "before the next match of its own event at or below that place";
   with one event running, that lands exactly on the number typed. */
async function moveQueuePrompt(matchId){
  const q = pendingQueue();
  const cur = q.findIndex(x => x.id === matchId);
  if (cur === -1){ toast("That match is not waiting in the queue."); return; }
  const m = q[cur];
  if (q.filter(x => x.event_id === m.event_id).length < 2){
    toast("Only waiting match in its event, so its turn is set by the court rotation.");
    return;
  }
  const raw = prompt(swText("Move to which place in the queue? 1-" + q.length +
    " (now " + (cur + 1) + ")"), "");
  if (raw == null || !raw.trim()) return;
  const n = parseInt(raw.trim(), 10);
  if (isNaN(n) || n < 1 || n > q.length){
    toast("Enter a number from 1 to " + q.length + ".");
    return;
  }
  if (n === cur + 1) return;
  const rest = q.filter(x => x.id !== matchId);
  const anchor = rest.slice(n - 1).find(x => x.event_id === m.event_id);
  const beforeId = anchor ? anchor.id : null;
  applyLocalMove(matchId, beforeId);
  render();
  const r = await store.adminMoveMatch(state.adminPin, matchId, beforeId);
  if (!r.ok) toast(r.error || "Could not move it.");
  await reload();
}

/* Reads the settings panel. Returns null if something is out of range, so a
   typo in a points target can't be saved: public score entry checks against
   that target, so a stray "210" would quietly block every score in the event. */
function readEventSettings(ev){
  let bad = null;
  const num = (id, dflt, lo, hi, label) => {
    const el = document.getElementById(id);
    if (!el) return dflt;
    const v = parseInt(el.value, 10);
    if (!Number.isInteger(v) || v < lo || v > hi){
      /* Translate the field name here; the sentence around it is a pattern. */
      if (!bad) bad = swText(label) + " has to be between " + lo + " and " + hi + ".";
      return dflt;
    }
    return v;
  };
  const ksEl = document.getElementById("adm-ksize");
  const ks = ksEl ? ksEl.value : String(evSetting(ev, "knockout_size", "auto"));
  const wbEl = document.getElementById("adm-wb2");
  /* Court override: every box ticked means no restriction (share every court);
     a subset limits the event to those courts. Unticking them all is a mistake
     rather than a setting, since an empty list reads as "no restriction"
     everywhere else, the opposite of what the empty boxes suggest. Preserve the
     saved value when the checkboxes aren't on screen. */
  const courtBoxes = Array.from(document.querySelectorAll(".adm-court"));
  let courts;
  if (!courtBoxes.length){
    courts = Array.isArray(ev.settings && ev.settings.courts) ? ev.settings.courts : [];
  } else {
    const picked = courtBoxes.filter(b => b.checked).map(b => parseInt(b.value, 10));
    if (!picked.length){
      bad = bad || "Tick at least one court. To take this event off court entirely, pause it instead.";
      courts = Array.isArray(ev.settings && ev.settings.courts) ? ev.settings.courts : [];
    } else {
      courts = picked.length >= courtsCount() ? [] : picked.sort((a, b) => a - b);
    }
  }
  /* Only the keys this panel owns. nairobi_admin_update_event merges them into
     whatever is stored, so saving here can't roll back an edit someone else
     made to a different setting on another device. */
  const out = ({
    points_to_group: num("adm-ptg", evSetting(ev, "points_to_group", 21), 5, 51, "Group games to"),
    points_to_knockout: num("adm-ptk", evSetting(ev, "points_to_knockout", 11), 5, 51, "Knockout games to"),
    best_of_group: num("adm-bog", evSetting(ev, "best_of_group", 1), 1, 5, "Group format"),
    best_of_knockout: num("adm-bok", evSetting(ev, "best_of_knockout", 3), 1, 5, "Knockout format"),
    knockout_size: ks === "auto" ? "auto" : parseInt(ks, 10),
    advance_per_group: num("adm-adv", evSetting(ev, "advance_per_group", 2), 1, 4, "Advance per group"),
    group_size: num("adm-gsize", evSetting(ev, "group_size", 6), 3, 32, "Group size"),
    win_by_two: wbEl ? wbEl.checked : !!evSetting(ev, "win_by_two", false),
    courts: courts
  });
  return bad ? { error: bad } : out;
}
/* The sentence under the format fields. Prices the settings currently on
   screen (not the saved ones) and, when the group stage is multi-game, says
   what one game would cost instead: organisers reach for best of 3 without
   seeing that it is most of an extra afternoon. */
/* Built bilingually here rather than through the dictionary: the sentence is
   assembled from too many moving numbers for a text-node pattern to catch. */
function fmtHoursSw(mins){
  const r = Math.round(mins / 15) * 15;
  const h = Math.floor(r / 60), m = r % 60;
  if (!h) return "dakika " + m;
  return "saa " + h + (m ? " dak " + m : "");
}
function estimateText(ev, o){
  const est = eventDurationEstimate(ev, o);
  const sw = state.lang === "sw";
  const hrs = sw ? fmtHoursSw : fmtHours;
  if (!est.matches) return sw
    ? "Weka washiriki na uchore makundi ili kuona makadirio."
    : "Add entrants and draw the groups to see an estimate.";
  const bits = [];
  if (est.group) bits.push(sw ? "mechi " + est.group + " za makundi"
    : est.group + " group match" + (est.group === 1 ? "" : "es"));
  if (est.ko) bits.push(sw ? "mechi " + est.ko + " za mtoano"
    : est.ko + " knockout match" + (est.ko === 1 ? "" : "es"));
  let s = sw
    ? "<b>Jipange kwa kama " + hrs(est.minutes) + "</b> kwenye " +
      (est.courts === 1 ? "uwanja 1" : "viwanja " + est.courts) + ": " + bits.join(" na ") +
      ". Ingekuwa " + hrs(est.idealMinutes) + " tu kama hakuna uwanja ambao ungekaa wazi, jambo lisilotokea kamwe."
    : "<b>Plan for about " + fmtHours(est.minutes) + "</b> on " + est.courts +
      " court" + (est.courts === 1 ? "" : "s") + ": " + bits.join(" and ") +
      ". Only " + fmtHours(est.idealMinutes) + " if no court ever sits empty, which never happens.";
  const bg = o ? o.boGroup : parseInt(evSetting(ev, "best_of_group", 1), 10) || 1;
  if (bg > 1){
    const one = eventDurationEstimate(ev, Object.assign({}, o, { boGroup: 1 }));
    const saved = est.minutes - one.minutes;
    if (saved > 20) s += sw
      ? " Gemu moja katika hatua ya makundi badala yake: kama " +
        hrs(one.minutes) + ", ukiokoa karibu " + hrs(saved) + "."
      : " One game in the group stage instead: about " +
        fmtHours(one.minutes) + ", saving roughly " + fmtHours(saved) + ".";
  }
  return s + (sw
    ? " <span style=\"opacity:.75\">Makadirio: dakika " + TURNOVER_MIN +
      " kati ya mechi na viwanja vikiwa na shughuli " + Math.round(COURT_BUSY * 100) +
      "% ya siku.</span>"
    : " <span style=\"opacity:.75\">Rough: " + TURNOVER_MIN +
      " minutes between matches and courts busy " + Math.round(COURT_BUSY * 100) +
      "% of the day.</span>");
}
/* Repriced live as the fields change, without a re-render that would steal
   focus from the input being typed into. Every field that calls this is owned
   by Save settings, so it doubles as the unsaved-changes marker: the estimate
   updates live but nothing takes effect until saved, and organisers were
   reading the live repricing as the settings already being applied. */

}

/* Fill the draw box from a CSV: one entrant per row, partner names in the
   first one or two cells, joined with " & ". Handles Excel's quoted cells and
   comma/semicolon/tab separators, and skips a first row that looks like a
   header. The file only fills the textarea for review; drawing the groups is
   still its own deliberate step. */
function entrantsCsvPicked(input){
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const cells = line => {
      const out = [];
      let cur = "", inQ = false;
      for(let i = 0; i < line.length; i++){
        const ch = line[i];
        if (inQ){
          if (ch === '"' && line[i + 1] === '"'){ cur += '"'; i++; }
          else if (ch === '"') inQ = false;
          else cur += ch;
        }
        else if (ch === '"') inQ = true;
        else if (ch === ',' || ch === ';' || ch === '\t'){ out.push(cur); cur = ""; }
        else cur += ch;
      }
      out.push(cur);
      return out.map(c => c.trim()).filter(c => c);
    };
    let rows = String(reader.result).split(/\r\n|\r|\n/).map(cells).filter(cs => cs.length);
    /* Skip a header row only when every cell IS a header phrase: one header
       word, optionally followed by another header word or a number ("Player",
       "Name 1", "Team Name", "First Name"). A real team like "Team Rocket"
       has a non-header second word, so it is never eaten. */
    if (rows.length > 1 && rows[0].every(c =>
      /^(name|player|partner|team|entrant|first|last)s?\s*(name|id|no|number|[0-9]+)?$/i.test(c.trim()))) rows = rows.slice(1);
    const names = rows.map(cs => cs.length > 1 ? cs[0] + " & " + cs[1] : cs[0]);
    if (!names.length){ toast("No names found in that file."); return; }
    const box = document.getElementById("adm-teams");
    if (!box) return;
    if (box.value.trim() && !confirm(swText("Replace what is in the entrants box with the " + names.length + " rows from the file?"))) return;
    box.value = names.join("\n");
    toast(names.length + " entrants loaded. Check the list, then draw.");
  };
  reader.readAsText(f);
}
/* An Americano player appears in seven different pairings, so renaming them
   through the normal team list would mean seven identical edits. */
async function renameAmericanoPlayer(oldName){
  const ev = eventById(state.adminEventId);
  if (!ev) return;
  const next = (prompt(swText('New name for "' + oldName + '"'), oldName) || "").trim();
  if (!next || next === oldName) return;
  if (next.includes("&")){ toast('A player name cannot contain "&".'); return; }
  const rows = data.entrants.filter(e => e.event_id === ev.id && splitPair(e.name).includes(oldName));
  for(const e of rows){
    const renamed = splitPair(e.name).map(n => n === oldName ? next : n).join(" & ");
    const r = await store.adminRenameEntrant(state.adminPin, e.id, renamed);
    if (!r.ok){ toast(r.error || "Could not rename."); await reload(); return; }
  }
  toast("Renamed in " + rows.length + " pairings");
  await reload();
}

async function moveEntrant(id, target){
  if (!target) return;
  const e = entrantById(id);
  if (!e) return;
  const ev = eventById(e.event_id);
  const group = target === "__new" ? groupLetter(groupsOfEvent(ev).length) : target;
  if (!confirm(swText('Move "' + e.name + '" to group ' + group + '? Their existing matches and results are replaced with catch-up matches.'))) { render(); return; }
  const members = data.entrants.filter(x => x.event_id === e.event_id && x.group_name === group && x.id !== id);
  const groupMs = data.matches.filter(m => m.event_id === e.event_id && m.stage === "group" && m.group_name === group);
  const startRound = Math.max(0, ...groupMs.map(m => m.round || 0)) + 1;
  const maxOrder = Math.max(0, ...data.matches.filter(m => m.event_id === e.event_id).map(m => m.play_order || 0));
  const matches = buildCatchupMatches(e.event_id, group, id, members.map(x => x.id), startRound, maxOrder);
  const r = await store.adminMoveEntrant(state.adminPin, id, group, matches);
  if (!r.ok){ toast(r.error); return; }
  toast(e.name + " moved to group " + group);
  await reload();
}
function normalizePhone(s){
  s = s.trim().replace(/[\s()-]/g, "");
  if (/^0[17]\d{8}$/.test(s)) return "+254" + s.slice(1);
  if (/^254\d{9}$/.test(s)) return "+" + s;
  if (/^\+\d{10,14}$/.test(s)) return s;
  return null;
}
async function editContacts(id){
  const e = entrantById(id);
  if (!e) return;
  const cur = (state.contacts[id] || []).join(", ");
  const raw = prompt(swText('Phone number(s) for "' + e.name + '", comma separated (07... or +254...). Leave empty to remove.'), cur);
  if (raw == null) return;
  const parts = raw.split(",").map(s => s.trim()).filter(Boolean);
  const phones = [];
  for(const p of parts){
    const n = normalizePhone(p);
    if (!n){ toast('"' + p + '" does not look like a phone number.'); return; }
    phones.push(n);
  }
  const r = await store.adminSetContacts(state.adminPin, id, phones);
  if (!r.ok){ toast(r.error); return; }
  toast(phones.length ? "Numbers saved" : "Numbers removed");
  await reload();
}
async function addTeamToGroup(){
  const ev = eventById(state.adminEventId);
  if (!ev) return;
  const name = document.getElementById("add-team-name").value.trim();
  const group = document.getElementById("add-team-group").value;
  if (!name){ toast("Type a name first."); return; }
  if (data.entrants.some(e => e.event_id === ev.id && e.name === name)){ toast("That name is already entered."); return; }
  const members = data.entrants.filter(e => e.event_id === ev.id && e.group_name === group);
  const maxSeed = Math.max(0, ...members.map(e => e.seed || 0));
  const entrant = { id: uid(), event_id: ev.id, name, group_name: group, seed: maxSeed + 1 };
  const groupMs = data.matches.filter(m => m.event_id === ev.id && m.stage === "group" && m.group_name === group);
  const startRound = Math.max(0, ...groupMs.map(m => m.round || 0)) + 1;
  const maxOrder = Math.max(0, ...data.matches.filter(m => m.event_id === ev.id).map(m => m.play_order || 0));
  const matches = buildCatchupMatches(ev.id, group, entrant.id, members.map(e => e.id), startRound, maxOrder);
  const r = await store.adminAddEntrant(state.adminPin, ev.id, entrant, matches);
  if (!r.ok){ toast(r.error); return; }
  toast(name + " added to Group " + group);
  await reload();

function parseTeamsInput(){

function setupSummary(names, s){
  const sizes = groupSizes(names.length, s.group_size);
  const groups = sizes.length;
  const matchCount = sizes.reduce((sum, n) => sum + n * (n - 1) / 2, 0);
  let lines = names.length + " entrants into " + groups + " groups (" + sizes.join(", ") + ")\n" +
    matchCount + " group matches";
  if (s.knockout_size === "auto"){
    const base = groups * s.advance_per_group;
    const size = nextPow2(Math.max(2, base));
    lines += "\nTop " + s.advance_per_group + " per group = " + base + " qualifiers; bracket of " + size +
      (size > base ? " adds " + (size - base) + " best next-placed" : "");
  } else {
    const size = s.knockout_size;
    const full = Math.floor(size / groups);
    const fill = size - full * groups;
    lines += "\nKnockout of " + size + ": top " + full + " per group" + (fill ? " plus " + fill + " best " + ordinal(full + 1) + "-placed" : "");
  }
  return lines;
}
