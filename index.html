/* The Americano page is the whole division on one screen: the round on court
   now, what is coming, and the running individual table. Everyone plays every
   round, so there is no queue to manage, just a round counter. */
function renderAmericanoBoard(ev){
  const ms = data.matches.filter(m => m.event_id === ev.id);
  if (!ms.length) return '<div class="empty">This division has no rounds yet.</div>';
  const rounds = americanoRounds(ev);
  const left = ms.filter(m => m.status === "scheduled");
  const pts = evSetting(ev, "points_to_group", 11);
  const done = ms.length - left.length;
  const courts = ev.settings && Array.isArray(ev.settings.courts) && ev.settings.courts.length ? ev.settings.courts : [1, 2];

  /* 1. The courts, one card each, showing the match on that court now. */
  let h = '<div class="section-h"><h2>' + (left.length ? 'On court' : 'All rounds played') +
    '</h2><span class="hint">' + done + ' of ' + ms.length + ' matches played · scores add up to ' + pts + '</span></div>';
  if (left.length){
    h += '<div class="courtgrid">';
    courts.forEach(c => {
      const m = ms.find(x => x.court === c && x.status === "scheduled");
      if (m){
        h += '<button class="courtcard" onclick="openMatch(\'' + m.id + '\')">' +
          '<div class="chead"><span class="cnum">Court ' + c + '</span><span class="tag plain">Round ' + m.round + '</span></div>' +
          '<div class="team">' + esc(entrantName(m.entrant1_id)) + '</div>' +
          '<div class="vs">vs</div><div class="team">' + esc(entrantName(m.entrant2_id)) + '</div>' +
          '<div class="cta">Tap to enter the score</div></button>';
      } else {
        h += '<div class="courtcard idle"><div class="chead"><span class="cnum">Court ' + c + '</span></div>' +
          '<div class="team">Free</div><div class="note" style="margin-top:4px">Next match starts once its players are off court</div></div>';
      }
    });
    h += '</div>';
  }

  /* 2. The schedule, round by round. */
  h += '<div class="section-h"><h2>Schedule</h2></div>';
  rounds.forEach(r => {
    const list = ms.filter(m => m.round === r).sort((a, b) => a.play_order - b.play_order);
    const allIn = list.every(m => m.status === "played");
    const onNow = list.some(m => m.court != null);
    h += '<div class="roundblock"><h3>Round ' + r +
      (allIn ? ' <span class="hint">done</span>' : onNow ? ' <span class="hint">on court</span>' : '') + '</h3>';
    list.forEach(m => { h += scheduleRow(m, false); });
    h += '</div>';
  });

  /* 3. Standings, at the bottom. */
  const table = americanoStandings(ev);
  if (table.length){
    h += '<div class="section-h"><h2>Standings</h2><span class="hint">Total points won</span></div>';
    h += renderAmericanoTable(table);
  }
  return h;
}
function renderAmericanoTable(table){
  let h = '<table class="standings"><thead><tr><th></th><th class="tname">Player</th>' +
    '<th>Pld</th><th>Won</th><th>Points</th><th>Diff</th></tr></thead><tbody>';
  const stuck = table.filter(r => r.unresolvedTie).length;
  table.forEach((r, i) => {
    h += '<tr><td>' + (i + 1) + '</td><td class="tname">' + esc(r.name) +
      (state.adminPin && r.unresolvedTie ? ' <span class="tag warn">level</span>' : '') + '</td>' +
      '<td>' + r.p + '</td><td>' + r.w + '</td><td><b>' + r.pf + '</b></td>' +
      '<td>' + (r.diff > 0 ? '+' : '') + r.diff + '</td></tr>';
  });
  h += '</tbody></table>';
  if (state.adminPin && stuck)
    h += '<p class="note" style="color:var(--warn);font-weight:700">' + stuck +
      ' players are level on points, difference and wins. The order between them is not earned; settle it at the desk.</p>';
  return h;
}

/* The Americano division runs on its own courts alongside the main draw, so
   the board can be filtered rather than showing one mixed grid. */
function renderDivisionTabs(){
  const amer = americanoEvent();
  if (!amer) return "";

  return '<div class="subtabs"><button class="subtab" aria-current="' + on +
    '" onclick="setDivision(\'' + (on ? "main" : "americano") + '\')">' +
    (on ? '\u2190 Back to the main draw' : 'Show ' + esc(amer.name) + ' only') +
    '</button></div>';
}
/* Events that may preview on the Courts tab. The tournament's opening events
   (the earliest start time on the books) show a full day ahead; every later
   batch holds until 12 hours before its start. Only the next batch to play
   (starts within an hour of the earliest upcoming) shows at all, so an
   afternoon event never previews alongside the morning one it waits behind. */
function upcomingSoon(){
  const now = Date.now();
  const withStart = publicEvents().filter(e => eventStartDate(e));
  if (!withStart.length) return [];
  const minStart = Math.min.apply(null, withStart.map(e => eventStartDate(e).getTime()));
  const eligible = withStart.filter(e => {
    if (e.active || isAmericano(e)) return false;
    const t = eventStartDate(e).getTime();
    /* keep previewing through a 10-minute grace past the start, so the board
       never shows "nothing running" in the sliver between the start moment
       and the next phone's auto-start ping */
    if (t <= now - 10 * 60000) return false;
    if (t - now > (t === minStart ? 24 : 12) * 3600000) return false;
    return data.matches.some(m => m.event_id === e.id && m.status === "scheduled" && m.entrant1_id && m.entrant2_id);
  }).sort((a, b) => eventStartDate(a) - eventStartDate(b));
  if (!eligible.length) return [];
  const first = eventStartDate(eligible[0]).getTime();
  return eligible.filter(e => eventStartDate(e).getTime() <= first + 3600000);
}
/* The next batch's board ahead of time: run the real court-assignment logic
   on a copy of the data with the upcoming events switched on, and show the
   courts and queue exactly as they will stand when play starts. Only rendered
   while nothing is running on the main courts, so it can never contradict a
   live board: pausing the finished event is what swaps this preview in. */
function renderCourtsPreview(soon){
  const sim = JSON.parse(JSON.stringify({ tournament: data.tournament, events: data.events, entrants: data.entrants, matches: data.matches }));
  const ids = new Set(soon.map(e => e.id));
  sim.events.forEach(e => { if (ids.has(e.id)) e.active = true; });
  assignCourtsGlobal(sim);
  const multi = soon.length > 1;
  const when = soon.map(e => esc(e.name) + ' · ' +
    eventStartDate(e).toLocaleString(state.lang === "sw" ? "sw" : [], { weekday: 'short', hour: 'numeric', minute: '2-digit' })).join('&ensp;');
  let h = '<div class="section-h"><h2>Coming up</h2><span class="hint">' + when + '</span></div>';
  h += '<div class="courtgrid">';
  const simOn = sim.matches.filter(m => ids.has(m.event_id) && m.status === "scheduled" && m.court != null);
  for(let c = 1; c <= courtsCount(); c++){
    const m = simOn.find(x => x.court === c);
    if (m){
      const ev = sim.events.find(e => e.id === m.event_id);
      h += '<button class="courtcard" onclick="openMatch(\'' + m.id + '\')">' +
        '<div class="chead"><span class="cnum">Court ' + c + '</span>' +
        (multi ? '<span class="tag plain">' + esc(ev.name) + '</span>' : '') + '</div>' +
        '<div class="team">' + esc(entrantName(m.entrant1_id)) + '</div>' +
        '<div class="vs">vs</div>' +
        '<div class="team">' + esc(entrantName(m.entrant2_id)) + '</div>' +
        '<div class="cta">First up here</div></button>';
    } else {
      h += '<div class="courtcard idle"><div class="chead"><span class="cnum">Court ' + c + '</span></div>' +
        '<div class="team">Free</div></div>';
    }
  }
  h += '</div>';
  const q = weavePending(sim).filter(m => ids.has(m.event_id)).slice(0, 8);
  if (q.length){
    h += '<div class="section-h"><h2>Then</h2></div><div class="roundblock" style="padding-top:2px">';
    h += q.map((m, i) => queueRow(m, { pos: i + 1, showEvent: multi })).join("");
    h += '</div>';
  }
  h += '<p class="note" style="margin-top:10px">A look ahead: this is how the courts will stand when play starts (the event turns itself on 5 minutes before). Tap a match for its estimated time; the full order is on the Schedule tab.</p>';
  return h;
}
/* Held matches are out of the queue entirely, so they need somewhere to be
   seen or they are simply lost. Rendered on the courts board in BOTH states,
   something running or not, and regardless of their event being paused: a
   held match whose event got rained off used to vanish from every screen,
   put-back button included. Event names always shown, since a held match can
   belong to an event that is not otherwise on the board. */
function heldBlockHtml(){
  const list = heldMatches().filter(m => { const ev = eventById(m.event_id); return ev && !isAmericano(ev); });
  if (!list.length) return '';
  let h = '<div class="section-h"><h2>Held</h2><span class="hint">Off court until the desk puts them back</span></div>' +
    '<div class="roundblock" style="padding-top:2px">';
  h += list.map(m => {
    let r = '<div class="queue-row click" onclick="openMatch(\'' + m.id + '\')">' +
      '<span class="qnames">' + esc(entrantName(m.entrant1_id)) + ' <span class="qv">vs</span> ' +
      esc(entrantName(m.entrant2_id)) + '</span>';
    const ev = eventById(m.event_id);
    if (ev) r += '<span class="qtag">' + esc(ev.name) + (ev.active ? '' : ' · paused') + '</span>';
    if (state.adminPin) r += '<span class="queue-actions"><button class="btn small secondary" ' +
      'onclick="event.stopPropagation();releaseMatch(\'' + m.id + '\')">Put back in the queue</button></span>';
    return r + '</div>';
  }).join("");
  return h + '</div>';
}
function renderBoard(){
  const amer = americanoEvent();
  if (state.division === "americano" && amer){
    return '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(amer.name) + '</span>' +
      renderDivisionTabs() + renderAmericanoBoard(amer);
  }
  const act = activeEvents().filter(e => !isAmericano(e));
  const multi = act.length > 1;
  let h = '<span class="print-title">' + esc(data.tournament.name) + ' · Courts</span>' + renderDivisionTabs();

  if (!act.length){
    const soon = upcomingSoon();
    if (soon.length){
      h += renderCourtsPreview(soon);
    } else {
      h += '<div class="empty">No events are currently active.';
      /* Name the moment rather than the rule: whoever is reading this wants to
         know when to turn up, not how the preview window works. */
      const nxt = nextToStart();
      if (nxt) h += '<br>This page will activate ' + esc(whenText(eventStartDate(nxt))) + '.';
      const upcoming = publicEvents().filter(e => !e.active && eventWhenLabel(e));
      if (upcoming.length){
        h += '<br><br>' + upcoming.slice(0, 8).map(e => esc(e.name) + ' · ' + esc(eventWhenLabel(e))).join('<br>');
      }
      h += '</div>';
    }
    /* Held matches used to disappear entirely the moment their event was
       paused, put-back button and all; a held match must stay findable. */
    h += heldBlockHtml();
    return h;
  }

  /* Switch off: exactly the pre-Americano main draw, all of courts 1..total.
     Americano is a physically separate event on its own courts (its own pool),
     so it never appears here even though a court number is shared. inView and
     pendingQueue both already drop Americano. */
  const inView = m => act.some(e => e.id === m.event_id);
  const on = onCourtMatches().filter(inView);
  /* Courts held by matches this board cannot show (a hidden event, the other
     division) are In use, never Free: drawing them Free invited the desk to
     place a match onto them and be refused with "was just filled". */
  const inUseCourts = new Set(onCourtMatchesAll().filter(x => !on.some(y => y.id === x.id)).map(x => x.court));
  const q = pendingQueue().filter(inView);
  /* Which of the waiting matches may use court c at all: an event pinned to
     courts 1-2 must not make court 3 say "Tap to place a match". */
  const allowedOn = (x, c) => {
    const ev2 = eventById(x.event_id);
    const a = ev2 && ev2.settings && Array.isArray(ev2.settings.courts) ? ev2.settings.courts : [];
    return !a.length || a.indexOf(c) !== -1;
  };
  h += '<div class="section-h"><h2>On court</h2></div>';
  h += '<div class="courtgrid">';
  for(let c = 1; c <= courtsCount(); c++){
    const m = on.find(x => x.court === c);
    if (m){
      const ev = eventById(m.event_id);
      h += '<button class="courtcard" onclick="openMatch(\'' + m.id + '\')">' +
        '<div class="chead"><span class="cnum">Court ' + c + '</span>' +
        (multi ? '<span class="tag plain">' + esc(ev.name) + '</span>' : '') + '</div>' +
        '<div class="team">' + esc(entrantName(m.entrant1_id)) + '</div>' +
        '<div class="vs">vs</div>' +
        '<div class="team">' + esc(entrantName(m.entrant2_id)) + '</div>' +
        '<div class="cta">Tap to enter the score</div></button>';
    } else if (inUseCourts.has(c)){
      /* Held by a match this board cannot show: a hidden event, or the other
         division. The server treats it as occupied, so must the board. */
      h += '<div class="courtcard idle"><div class="chead"><span class="cnum">Court ' + c + '</span></div>' +
        '<div class="team">In use</div></div>';
    } else {
      /* A queue that is not empty but entirely blocked by teams still on court
         used to read "Tap to place a match", then answer "No match is waiting
         right now" when tapped, with the header shouting 24 waiting. Say the
         real reason instead. Per court: an event pinned to other courts must
         not make this one promise a placement it will refuse. */
      const busyNow = busyPlayerNames();
      const callable = q.filter(x => !blockedByCourt(x, busyNow) && allowedOn(x, c));
      const canPlace = state.adminPin && callable.length > 0;
      const reason = callable.length > 0
        ? (state.adminPin ? 'Tap to place a match' : 'Waiting for a free court')
        : (q.length > 0
            ? (q.some(x => allowedOn(x, c)) ? 'Next match starts once its players are off court' : 'Reserved for another event')
            : 'No match ready yet');
      if (canPlace){
        h += '<button class="courtcard idle" onclick="openCourtAssign(' + c + ')">' +
          '<div class="chead"><span class="cnum">Court ' + c + '</span></div>' +
          '<div class="team">Free</div><div class="cta">' + reason + '</div></button>';
      } else {
        h += '<div class="courtcard idle"><div class="chead"><span class="cnum">Court ' + c + '</span></div>' +
          '<div class="team">Free</div><div class="note" style="margin-top:4px">' + reason + '</div></div>';
      }
    }
  }
  h += '</div>';

  const upNext = q.slice(0, 8);
  if (upNext.length){
    h += '<div class="section-h"><h2>Up next</h2></div><div class="roundblock" style="padding-top:2px">';
    h += upNext.map((m, i) => queueRow(m, { pos: i + 1, showEvent: multi, action: "postpone" })).join("");
    h += '</div>';
    if (q.length > upNext.length || state.showAllQueue){
      h += '<p style="margin-top:8px"><button class="btn small secondary" onclick="toggleAllQueue()">' +
        (state.showAllQueue ? 'Show fewer' : 'Show all matches (' + q.length + ' waiting)') + '</button></p>';
    }
    if (state.showAllQueue && q.length > upNext.length){
      h += '<div class="roundblock" style="padding-top:2px">';
      h += q.slice(8).map((m, i) => queueRow(m, { pos: i + 9, showEvent: multi, action: "postpone" })).join("");
      h += '</div>';
    }
  }

  h += heldBlockHtml();

  const postponedList = data.matches.filter(m => m.status === "scheduled" && m.postponed &&
    (eventById(m.event_id) || {}).active && inView(m));
  if (postponedList.length){
    h += '<div class="section-h"><h2>Postponed</h2><span class="hint">Waiting lower in the queue</span></div><div class="roundblock" style="padding-top:2px">';
    h += postponedList.map(m => queueRow(m, { showEvent: multi, action: "playnext", inPostponed: true })).join("");
    h += '</div>';
  }

  h += '<div class="boardnotes">';
  for(const ev of act){
    const total = data.matches.filter(m => m.event_id === ev.id && m.stage === "group").length;
    const done = data.matches.filter(m => m.event_id === ev.id && m.stage === "group" && m.status === "played").length;
    const ko = data.matches.filter(m => m.event_id === ev.id && m.stage === "knockout").length;
    h += '<span class="note">' + esc(ev.name) + ': ' + done + ' of ' + total + ' group matches played' + (ko ? ', knockout underway' : '') + '</span>';
  }
  h += '</div>';
  return h;
}

function scheduleRow(m, withScore){
  const played = m.status === "played" && m.score1 != null;
  const bye = m.stage === "knockout" && m.status === "played" && m.score1 == null;
  const clickable = !bye && m.entrant1_id && m.entrant2_id;
  let res = '';
  if (withScore){
    if (played){
      const gs = gamesStr(m);
      res = '<span class="res">' + (gs ? esc(gs) : m.score1 + '-' + m.score2) + '</span>' +
        (m.walkover ? ' <span class="tag warn">W/O</span>' : '') +
        (m.retired ? ' <span class="tag warn">Ret.</span>' : '') +
        (wasCorrected(m.id) ? ' <span class="tag corr" title="This score was changed">corrected</span>' : '');
    }
    else if (m.court != null) res = '<span class="res pending">Court ' + m.court + '</span>';
    else if (m.postponed) res = '<span class="res pending">Postponed</span>';
  } else if (played){
    res = '<span class="res pending">✓</span>';
  } else if (m.court != null){
    res = '<span class="res pending">Court ' + m.court + '</span>';
  } else if (m.postponed){
    res = '<span class="res pending">Postponed</span>';
  }
  const inner = '<span class="g">' + (m.group_name ? esc(m.group_name) : '') + '</span>' +
    '<span class="names">' + esc(entrantName(m.entrant1_id) || "TBD") + ' <span class="qv">vs</span> ' + esc(entrantName(m.entrant2_id) || (bye ? "BYE" : "TBD")) + '</span>' + res;
  return clickable
    ? '<button class="srow' + (played ? ' done' : '') + '" onclick="openMatch(\'' + m.id + '\')">' + inner + '</button>'
    : '<div class="srow' + (played ? ' done' : '') + '">' + inner + '</div>';
}
function termFilterFor(){
  const term = state.search.trim().toLowerCase();
  return m => {
    if (!term) return true;
    const n1 = entrantName(m.entrant1_id) || "", n2 = entrantName(m.entrant2_id) || "";
    return n1.toLowerCase().includes(term) || n2.toLowerCase().includes(term);
  };
}

function renderSchedule(){
  const ev = currentEvent();
  if (!ev) return noEventHtml("schedule");
  if (!state.adminPin && !eventPublished(ev)) return notYetHtml(ev, "schedule");
  const evMatches = data.matches.filter(m => m.event_id === ev.id);
  if (!evMatches.length){
    const note = eventWhenLabel(ev);
    return '<div class="empty">' + esc(ev.name) + ' has no schedule yet.' + (note ? '<br>Planned: ' + esc(note) : '') + '</div>';
  }
  const groupMs = evMatches.filter(m => m.stage === "group");
  const koMs = evMatches.filter(m => m.stage === "knockout");
  const maxRound = Math.max(0, ...groupMs.map(m => m.round));
  /* Heal a filter that no longer exists (event redrawn, bracket reset). */
  if (state.roundFilter === "ko" ? !koMs.length : state.roundFilter !== "all" && parseInt(state.roundFilter, 10) > maxRound) state.roundFilter = "all";

  let h = '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(ev.name) + ' · Schedule</span>';
  h += '<div class="controls">' +
    '<input class="search" id="search-input" type="text" placeholder="Find a name" value="' + esc(state.search) + '" oninput="setSearch(this.value)">' +
    '<button class="btn small secondary" onclick="window.print()">Print</button></div>';
  h += '<div class="subtabs" role="tablist">' +
    '<button class="subtab" aria-current="' + (state.roundFilter === "all") + '" onclick="setRoundFilter(\'all\')">All</button>';
  for(let r = 1; r <= maxRound; r++){
    h += '<button class="subtab" aria-current="' + (state.roundFilter === String(r)) + '" onclick="setRoundFilter(\'' + r + '\')">Round ' + r + '</button>';
  }
  if (koMs.length) h += '<button class="subtab" aria-current="' + (state.roundFilter === "ko") + '" onclick="setRoundFilter(\'ko\')">Knockout</button>';
  h += '</div>';

  const matchesTerm = termFilterFor();

  if (state.roundFilter === "ko"){
    if (!koMs.length) return h + '<div class="empty">No knockout matches yet.</div>';
    const total = Math.max(...koMs.map(x => x.bracket_round));
    for(let r = 1; r <= total; r++){
      const list = koMs.filter(m => m.bracket_round === r && matchesTerm(m)).sort((a, b) => a.bracket_pos - b.bracket_pos);
      if (!list.length) continue;
      h += '<div class="roundblock"><h3>' + roundLabelFor(r, total) + '</h3>' + list.map(m => scheduleRow(m, true)).join("") + '</div>';
    }
    return h;
  }

  const shown = groupMs.filter(m => (state.roundFilter === "all" || String(m.round) === state.roundFilter) && matchesTerm(m));
  const shownKo = state.roundFilter === "all" ? koMs.filter(matchesTerm) : [];
  if (!shown.length && !shownKo.length) return h + '<div class="empty">No matches found.</div>';
  for(let r = 1; r <= maxRound; r++){
    const list = shown.filter(m => m.round === r).sort((a, b) => a.play_order - b.play_order);
    if (!list.length) continue;
    const allDone = list.every(m => m.status === "played");
    if (allDone && state.roundFilter === "all"){
      /* Finished rounds fold away; tap to peek. */
      h += '<details class="roundblock folded"><summary><h3>Round ' + r + ' <span class="hint">complete · ' + list.length + ' matches</span></h3></summary>' +
        list.map(m => scheduleRow(m, true)).join("") + '</details>';
    } else {
      h += '<div class="roundblock"><h3>Round ' + r + '</h3>' + list.map(m => scheduleRow(m, true)).join("") + '</div>';
    }
  }
  /* Knockout matches show on the "All" page too while they're live, not only
     under the Knockout tab. */
  if (shownKo.length){
    const koTotal = Math.max(...koMs.map(x => x.bracket_round));
    for(let r = 1; r <= koTotal; r++){
      const list = shownKo.filter(m => m.bracket_round === r).sort((a, b) => a.bracket_pos - b.bracket_pos);
      if (!list.length) continue;
      h += '<div class="roundblock"><h3>' + roundLabelFor(r, koTotal) + '</h3>' + list.map(m => scheduleRow(m, true)).join("") + '</div>';
    }
  }
  h += '<p class="note">Matches run in this order, group A first, so everyone plays round 1 before round 2 starts. Played matches show their scores; tap a match for details. A score can be entered while the match is on a court, and corrections go through the desk.</p>';
  return h;
}

function renderStandings(){
  const ev = currentEvent();
  if (!ev) return noEventHtml("standings");
  if (!state.adminPin && !eventPublished(ev)) return notYetHtml(ev, "standings");
  /* Americano is scored per player across rotating partners, so the group
     table would be 28 one-match "teams" and tell nobody anything. */
  if (isAmericano(ev)){
    const table = americanoStandings(ev);
    const played = data.matches.filter(m => m.event_id === ev.id && m.status === "played").length;
    const total = data.matches.filter(m => m.event_id === ev.id).length;
    let h = '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(ev.name) + ' · Standings</span>';
    h += '<div class="section-h"><h2>' + esc(ev.name) + '</h2><span class="hint">' +
      'Every point you win counts, whoever you are partnered with · ' + played + ' of ' + total + ' matches in</span></div>';
    return h + (table.length ? renderAmericanoTable(table) : '<div class="empty">No players yet.</div>');
  }
  const groups = groupsOfEvent(ev);
  if (!groups.length){
    const note = evSetting(ev, "schedule_note", "");
    return '<div class="empty">' + esc(ev.name) + ' has no groups yet.' + (note ? '<br>Planned: ' + esc(note) : '') + '</div>';
  }
  const field = seedFieldFor(ev);
  const adv = Math.max(1, field.guaranteed);
  if (state.standingsFilter !== "all" && !groups.includes(state.standingsFilter)) state.standingsFilter = "all";
  const f = state.standingsFilter;
  let h = '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(ev.name) + ' · Standings</span>';
  h += '<div class="section-h"><h2>' + esc(ev.name) + '</h2><span class="hint">Top ' + adv + ' per group advance' +
    (field.wildcards ? ' plus ' + field.wildcards + ' best next-placed' : '') + ' · tap a team for details</span></div>';
  if (groups.length > 1){
    h += '<div class="subtabs" role="tablist">' +
      '<button class="subtab" aria-current="' + (f === "all") + '" onclick="setStandingsFilter(\'all\')">All</button>' +
      groups.map(g => '<button class="subtab" aria-current="' + (f === g) + '" onclick="setStandingsFilter(\'' + jsAttr(g) + '\')">Group ' + esc(g) + '</button>').join("") +
      '</div>';
  }
  for(const g of groups){
    if (f !== "all" && f !== g) continue;
    const rows = standingsFor(ev, g);
    const left = data.matches.filter(m => m.event_id === ev.id && m.stage === "group" && m.group_name === g && m.status === "scheduled").length;
    h += '<div class="group-card"><h3><span>Group ' + esc(g) + '</span>' + (left ? '<span class="tag plain">' + left + ' left</span>' : '<span class="tag plain">Complete</span>') + '</h3>';
    /* A tie is only a fact once the group has finished. With matches still to
       play the table is a snapshot, and "tied" against a group nobody has
       played in reads as a problem rather than as nothing having separated
       them yet. Desk only as well, since drawing the lots is the desk's job
       and there is nothing a player can do about it. */
    const showTies = !!state.adminPin && !left;
    h += '<table class="standings"><thead><tr><th></th><th class="tname">Team</th><th>P</th><th>W</th><th>L</th><th>+/-</th></tr></thead><tbody>';
    rows.forEach((r, i) => {
      h += '<tr onclick="openTeam(\'' + r.id + '\')"><td class="pos">' + (i + 1) + '</td><td class="tname">' + esc(r.name) +
        (showTies && r.unresolvedTie ? ' <span class="tag warn">tied</span>' : '') + '</td>' +
        '<td>' + r.p + '</td><td>' + r.w + '</td><td>' + r.l + '</td><td>' + (r.diff > 0 ? '+' : '') + r.diff + '</td></tr>';
    });
    h += '</tbody></table>';
    /* Alphabetical order is what actually decides these, which is no way to
       send someone home, so it is said out loud rather than left to look
       like a ranking. */
    const stuck = showTies ? rows.filter(r => r.unresolvedTie).length : 0;
    if (stuck) h += '<p class="note" style="color:var(--warn);font-weight:700;margin:6px 0 0">' +
      stuck + ' teams are level on every tiebreaker. The order shown is alphabetical, not earned. ' +
      'Draw lots at the desk and enter the result as a correction if it decides who goes through.</p>';
    h += '</div>';
  }
  /* The rulebook footer only earns its place once the group stage is over and
     the order in the table is the one people go home on. Before that it is a
     wall of tiebreaker rules under tables where nobody has played a match. */
  const groupLeft = data.matches.filter(m => m.event_id === ev.id && m.stage === "group" && m.status === "scheduled").length;
  if (!groupLeft)
    h += '<p class="note">Tiebreakers follow the USA Pickleball order: wins, then head to head between the tied teams, ' +
      'then point difference, then head to head point difference. Teams still level after that are split on points scored. ' +
      'A walkover counts as a win but adds no points either way. Teams level on all of it are flagged: nothing has separated them and the desk must draw lots.</p>';
  return h;
}

/* Single-sided bracket geometry. Round r (0-based) match j sits at a fixed
   vertical centre; the spacing doubles each round so a pair's elbow always
   meets at the next round's slot. Mirrors design 4 from the mockups. */
const BK_P = 130, BK_MH = 92, BK_HALF = 46, BK_COLW = 178;
function bkCenter(r, j){ return BK_HALF + BK_P * (Math.pow(2, r) - 1) / 2 + j * BK_P * Math.pow(2, r); }
function bkBodyH(totalRounds){ return BK_MH + (Math.pow(2, totalRounds - 1) - 1) * BK_P; }
function bkTeamRow(name, cls, score, extra){
  return '<div class="bkteam ' + (cls || '') + '"><span class="bkname">' + name + (extra || '') + '</span>' +
    (score != null ? '<span class="bkscore">' + score + '</span>' : '') + '</div>';
}
function bkRoundCol(label, cells, bodyH){
  return '<div class="bkcol" style="width:' + BK_COLW + 'px"><div class="bkhead">' + esc(label) + '</div>' +
    '<div class="bkbody" style="height:' + bodyH + 'px">' + cells.join('') + '</div></div>';
}
/* Connector column between round r and r+1, where round r+1 has nNext matches. */
function bkConnCol(r, nNext, bodyH){
  let h = '<div class="bkconn"><div class="bkhead">&nbsp;</div><div class="bkbody" style="height:' + bodyH + 'px">';
  for(let j = 0; j < nNext; j++){
    const top = bkCenter(r, 2 * j), bot = bkCenter(r, 2 * j + 1);
    h += '<div class="bkelbow" style="top:' + top + 'px;height:' + (bot - top) + 'px"></div>';
    h += '<div class="bkarrow" style="top:' + bkCenter(r + 1, j) + 'px"></div>';
  }
  return h + '</div></div>';
}
function bkChampCol(champHtml, totalRounds, bodyH){
  const cy = bkCenter(totalRounds - 1, 0);
  return '<div class="bkconn"><div class="bkhead">&nbsp;</div><div class="bkbody" style="height:' + bodyH + 'px">' +
      '<div class="bkarrow bkarrow-champ" style="top:' + cy + 'px"></div></div></div>' +
    '<div class="bkcol" style="width:' + BK_COLW + 'px"><div class="bkhead">Champion</div>' +
      '<div class="bkbody" style="height:' + bodyH + 'px"><div class="bkchamp" style="top:' + (cy - 52) + 'px">' + champHtml + '</div></div></div>';
}
function bkSideCls(hasName, isWin, played){
  if (!hasName) return 'bkm-tbd';
  if (isWin) return 'bkm-win';
  if (played) return 'bkm-lose';
  return 'bkm-pending';
}
const bkChampTbd = '<div class="bkchamp-card tbd"><div class="bkchamp-trophy">🏆</div><div class="bkchamp-label">Champion</div><div class="bkchamp-name tbd">To be decided</div></div>';

function renderBracket(){
  const ev = currentEvent();
  if (!ev) return noEventHtml("bracket");
  /* Same gate as Schedule and Standings. Withholding only the PROJECTED
     bracket was not enough: an event whose knockout had been generated before
     its own pages were due would have shown players the real thing, names and
     all, from a tab that is supposed to be closed. */
  if (!state.adminPin && !eventPublished(ev))
    return '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(ev.name) + '</span>' +
      '<div class="empty">' + swText('The bracket will be released after the group stage is finished.') + '</div>';
  if (isAmericano(ev)){
    return '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(ev.name) + '</span>' +
      '<div class="empty">' + esc(ev.name) + ' has no bracket. It is decided on total points won, so the Standings tab is the result.</div>';
  }
  const ko = data.matches.filter(m => m.event_id === ev.id && m.stage === "knockout");

  /* Projected bracket: before the desk confirms the knockout, show the seeds.
     Desk only. It reads as a promise about who plays who, and the seed order
     it assumes is a per-event choice that can still be changed, so players get
     the honest sentence instead and the desk keeps the working view. */
  if (!ko.length && !state.adminPin)
    return '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(ev.name) + '</span>' +
      '<div class="empty">' + swText('The bracket will be released after the group stage is finished.') + '</div>';
  if (!ko.length){
    const groups = groupsOfEvent(ev);
    if (!groups.length) return '<div class="empty">' + esc(ev.name) + ' has no groups yet.</div>';
    const field = seedFieldFor(ev);
    if (field.seeds.length < 2) return '<div class="empty">Not enough teams yet.</div>';
    const left = data.matches.filter(m => m.event_id === ev.id && m.stage === "group" && m.status === "scheduled").length;
    const pairs = bracketPairs(field.seeds);
    const size = nextPow2(Math.max(2, field.seeds.length));
    const totalRounds = Math.log2(size);
    const bodyH = bkBodyH(totalRounds);
    const seedRow = s => !s ? bkTeamRow('BYE', 'bkm-tbd')
      : bkTeamRow(esc(s.group + s.place), 'bkm-seed', null, s.wildcard ? ' <span class="bktag">Best ' + ordinal(s.place) + '</span>' : '');
    const tbdRow = () => bkTeamRow('TBD', 'bkm-tbd');

    let h = '<div class="bkwrap"><div class="bk">';
    for(let r = 0; r < totalRounds; r++){
      const count = size / Math.pow(2, r + 1);
      const cells = [];
      for(let j = 0; j < count; j++){
        const top = bkCenter(r, j) - BK_HALF;
        const rows = r === 0 ? (seedRow(pairs[j][0]) + seedRow(pairs[j][1])) : (tbdRow() + tbdRow());
        cells.push('<div class="bkmatch" style="top:' + top + 'px">' + rows + '</div>');
      }
      h += bkRoundCol(roundLabelFor(r + 1, totalRounds), cells, bodyH);
      if (r < totalRounds - 1) h += bkConnCol(r, size / Math.pow(2, r + 2), bodyH);
    }
    h += bkChampCol(bkChampTbd, totalRounds, bodyH);
    h += '</div></div>';
    h += '<p class="note">A1 means the group A winner, C2 the group C runner-up, from standings right now, so matchups can shift until group play ends. ' +
      'Round 1 is on the left and winners move to the right, toward the final and champion. ' +
      field.seeds.length + ' qualify for a ' + size + '-slot bracket' +
      (field.wildcards ? ', including ' + field.wildcards + ' wildcard' + (field.wildcards > 1 ? 's' : '') + ' from the next places' : '') +
      '. The real bracket is created when the desk confirms the group stage is finished' +
      (totalRounds >= 2 ? ', along with a third place match between the two beaten semifinalists' : '') +
      '.</p>';
    return h;
  }

  /* Live bracket. */
  const total = Math.max(...ko.map(m => m.bracket_round));
  const bodyH = bkBodyH(total);
  const wo = ' <span class="bktag">W/O</span>';
  const ret = ' <span class="bktag">Ret.</span>';
  const matchCell = (m, r, j) => {
    const n1 = entrantName(m.entrant1_id), n2 = entrantName(m.entrant2_id);
    const played = m.status === "played" && m.score1 != null;
    const bye = m.status === "played" && m.score1 == null;
    const w1 = played && m.score1 > m.score2, w2 = played && m.score2 > m.score1;
    /* A best-of-three shows the points of each game, not the games-won tally:
       "2" told nobody how close it was. Falls back to the single score for
       matches stored as one game, and for walkovers, which have no games. */
    const side = n => Array.isArray(m.games) && m.games.length && !m.walkover
      ? m.games.map(g => g[n - 1]).join(' ')
      : (n === 1 ? m.score1 : m.score2);
    const rows =
      bkTeamRow(n1 ? esc(n1) : 'TBD', bkSideCls(!!n1, w1, played), played ? side(1) : null,
                m.walkover && w1 ? wo : (m.retired === m.entrant1_id ? ret : '')) +
      bkTeamRow(n2 ? esc(n2) : (bye ? 'BYE' : 'TBD'), bkSideCls(!!n2, w2, played), played ? side(2) : null,
                m.walkover && w2 ? wo : (m.retired === m.entrant2_id ? ret : ''));
    const top = bkCenter(r, j) - BK_HALF;
    const clickable = !bye && m.entrant1_id && m.entrant2_id;
    const editable = !!(state.adminPin && m.status === "scheduled" && !bye);
    /* Editable cells keep the two buttons as siblings, never nested. */
    if (editable){
      const main = clickable
        ? '<button class="bkmain" onclick="openMatch(\'' + m.id + '\')">' + rows + '</button>'
        : rows;
      return '<div class="bkmatch editable" style="top:' + top + 'px">' + main +
        '<button class="bedit" onclick="openSlotEditor(\'' + m.id + '\')">Edit</button></div>';
    }
    return clickable
      ? '<button class="bkmatch" style="top:' + top + 'px" onclick="openMatch(\'' + m.id + '\')">' + rows + '</button>'
      : '<div class="bkmatch" style="top:' + top + 'px">' + rows + '</div>';
  };

  const final = ko.find(m => m.bracket_round === total);
  let champHtml;
  if (final && final.status === "played" && final.score1 != null){
    const champ = final.score1 > final.score2 ? final.entrant1_id : final.entrant2_id;
    champHtml = '<div class="bkchamp-card"><div class="bkchamp-trophy">🏆</div><div class="bkchamp-label">Champion</div><div class="bkchamp-name win">' + esc(entrantName(champ)) + '</div></div>';
  } else {
    champHtml = bkChampTbd;
  }

  let h = '<span class="print-title">' + esc(data.tournament.name) + ' · ' + esc(ev.name) + ' · Bracket</span>';
  h += '<div class="bkwrap"><div class="bk">';
  for(let r = 1; r <= total; r++){
    const list = ko.filter(m => m.bracket_round === r).sort((a, b) => a.bracket_pos - b.bracket_pos);
    h += bkRoundCol(roundLabelFor(r, total), list.map((m, j) => matchCell(m, r - 1, j)), bodyH);
    if (r < total) h += bkConnCol(r - 1, ko.filter(m => m.bracket_round === r + 1).length, bodyH);
  }
  h += bkChampCol(champHtml, total, bodyH);
  h += '</div></div>';
  /* Third place sits beside the tree rather than in it: it is fed by the two
     semifinal losers, so it belongs to no round and has nowhere to send a
     winner. Rendering it as its own card keeps the tree geometry honest. */
  const third = ko.find(isThirdPlace);
  if (third){
    const t1 = entrantName(third.entrant1_id), t2 = entrantName(third.entrant2_id);
    const tPlayed = third.status === "played" && third.score1 != null;
    const tw1 = tPlayed && third.score1 > third.score2, tw2 = tPlayed && third.score2 > third.score1;
    const tSide = n => Array.isArray(third.games) && third.games.length && !third.walkover
      ? third.games.map(g => g[n - 1]).join(' ')
      : (n === 1 ? third.score1 : third.score2);
    const tRows =
      bkTeamRow(t1 ? esc(t1) : 'TBD', bkSideCls(!!t1, tw1, tPlayed), tPlayed ? tSide(1) : null,
                third.walkover && tw1 ? wo : (third.retired === third.entrant1_id ? ret : '')) +
      bkTeamRow(t2 ? esc(t2) : 'TBD', bkSideCls(!!t2, tw2, tPlayed), tPlayed ? tSide(2) : null,
                third.walkover && tw2 ? wo : (third.retired === third.entrant2_id ? ret : ''));
    const tClickable = third.entrant1_id && third.entrant2_id;
    h += '<div class="bkthird"><div class="bkhead">Third place</div>';
    h += tClickable
      ? '<button class="bkmatch bkflat" onclick="openMatch(\'' + third.id + '\')">' + tRows + '</button>'
      : '<div class="bkmatch bkflat">' + tRows + '</div>';
    if (state.adminPin && third.status === "scheduled")
      h += '<button class="btn small secondary" onclick="openSlotEditor(\'' + third.id + '\')">Edit teams</button>';
    h += '<p class="note" style="margin:6px 0 0">Played by the two beaten semifinalists. Both names appear once their semifinals are in.</p>';
    h += '</div>';
  }
  h += '<p class="note">Winners move to the right, round by round, toward the champion. Tap a match to see or enter its result.' +
    (state.adminPin ? ' Unplayed matches have an Edit link to fix the teams by hand.' : '') + '</p>';
  return h;
}

/* ---------- admin ---------- */
/* Groups board. Everything here edits a working copy, not the database: teams
   are dragged (or tapped, which is what actually works on a phone) between
   groups, dropped into Unallocated, renamed, removed or added, and nothing
   happens to the event until Save groups rebuilds it.
   Groups lock the moment a match has a score. Rebuilding schedules under a
   played result meant deleting that result or bolting catch-up matches onto
   the end of the queue, and both were worse than saying no. */
function avgDuprOf(members){
  const vals = members.map(e => e.meta && e.meta.dupr).filter(v => v != null);
  return vals.length ? vals.reduce((a, b) => a + +b, 0) / vals.length : null;
}
function groupsLocked(ev){
  return data.matches.some(m => m.event_id === ev.id &&
    (m.status === "played" || m.stage === "knockout" || m.court != null || m.held));
}
function gedit(ev){
  /* An unsaved arrangement is meaningless once the event locks: showing it as
     the final groups put the desk's draft on screen while the players were in
     the real ones. */
  if (state.gedit && state.gedit.evId === ev.id && state.gedit.dirty && groupsLocked(ev)){
    state.gedit = null;
    toast("This event locked while the board was open, so the unsaved changes were dropped.");
  }
  if (!state.gedit || state.gedit.evId !== ev.id){
    const evE = data.entrants.filter(e => e.event_id === ev.id);
    state.gedit = {
      /* baseIds is the roster this board was built from: at Save it is how a
         team added on another phone since then is told apart from a team the
         desk removed here on purpose. */
      evId: ev.id, dirty: false, unallocated: [], baseIds: evE.map(e => e.id),
      groups: groupsOfEvent(ev).map(n => ({
        name: n,
        members: evE.filter(e => e.group_name === n)
          .sort((a, b) => (a.seed || 0) - (b.seed || 0))
          .map(e => ({ id: e.id, name: e.name, meta: e.meta || {} }))
      }))
    };
  }
  return state.gedit;
}
function gClear(){ state.gedit = null; state.movePick = null; state.dragId = null; }
function gFind(ge, id){
  for(const g of ge.groups){ const i = g.members.findIndex(m => m.id === id); if (i >= 0) return { list: g.members, i }; }
  const j = ge.unallocated.findIndex(m => m.id === id);
  return j >= 0 ? { list: ge.unallocated, i: j } : null;
}
/* dest is a group index, or -1 for the Unallocated tray. */
function gMove(id, dest){
  const ev = eventById(state.adminEventId);
  if (!ev || groupsLocked(ev)) return;
  const ge = gedit(ev);
  const at = gFind(ge, id);
  if (!at) return;
  const [row] = at.list.splice(at.i, 1);
  (dest < 0 ? ge.unallocated : ge.groups[dest].members).push(row);
  ge.dirty = true;
  state.movePick = null; state.dragId = null;
  render();
}
function gPick(id){ state.movePick = state.movePick === id ? null : id; render(); }
function gDragStart(id){ state.dragId = id; }
function gDragEnd(){ state.dragId = null; render(); }
function gDrop(dest){ if (state.dragId) gMove(state.dragId, dest); }
function gAddGroup(){
  const ev = eventById(state.adminEventId);
  if (!ev || groupsLocked(ev)) return;
  const ge = gedit(ev);
  ge.groups.push({ name: groupLetter(ge.groups.length), members: [] });
  ge.dirty = true; render();
}
/* Dissolving empties a group into Unallocated rather than guessing where its
   teams should go, and the letters close up so there is never a gap. */
function gDissolve(i){
  const ev = eventById(state.adminEventId);
  if (!ev || groupsLocked(ev)) return;
  const ge = gedit(ev);
  const g = ge.groups[i];
  if (!g) return;
  if (g.members.length && !confirm(swText('Dissolve group ' + g.name + '? Its ' + g.members.length +
    ' teams move to Unallocated and you place them again.'))) return;
  ge.unallocated.push(...g.members);
  ge.groups.splice(i, 1);
  ge.groups.forEach((x, n) => { x.name = groupLetter(n); });
  ge.dirty = true; render();
}
function gRename(id){
  const ev = eventById(state.adminEventId);
  if (!ev) return;
  const ge = gedit(ev);
  const at = gFind(ge, id);
  if (!at) return;
  const row = at.list[at.i];
  const next = (prompt(swText("New name:"), row.name) || "").trim();
  if (!next || next === row.name) return;
  row.name = next; ge.dirty = true; render();
}
function gRemove(id){
  const ev = eventById(state.adminEventId);
  if (!ev || groupsLocked(ev)) return;
  const ge = gedit(ev);

/* A team added here gets the same rating and DUPR ID the draw grid collects,
   or the board would quietly create unrated teams that then seed last. Both

function gAddTo(i){
  const ev = eventById(state.adminEventId);
  if (!ev || groupsLocked(ev)) return;
  const val = id => { const b = document.getElementById(id); return b ? b.value.trim() : ""; };
  const name = val("adm-gadd-" + i);
  if (!name) return;
  const duprs = val("adm-gdupr-" + i).split(/[\s,;\/]+/).map(cleanNum).filter(v => v != null);
  const ids = val("adm-gid-" + i).split(/[\s,;\/]+/).filter(Boolean);
  const meta = {};
  if (duprs.length){
    meta.duprs = duprs;
    meta.dupr = Math.round(duprs.reduce((a, b) => a + b, 0) / duprs.length * 100) / 100;
  }
  if (ids.length) meta.duprIds = ids;
  const ge = gedit(ev);
  const taken = ge.groups.flatMap(g => g.members).concat(ge.unallocated).some(m => m.name === name);
  if (taken){ toast('"' + name + '" is already on the board.'); return; }
  ge.groups[i].members.push({ id: uid(), name, meta });
  ge.dirty = true;
  ["adm-gadd-", "adm-gdupr-", "adm-gid-"].forEach(pre => { const b = document.getElementById(pre + i); if (b) b.value = ""; });
  blurThenRender();
}
function gReset(){ gClear(); render(); }
async function gSave(){
  let ev = eventById(state.adminEventId);
  if (!ev) return;
  const ge = gedit(ev);
  if (ge.unallocated.length){ toast("Place the unallocated teams first."); return; }
  if (groupsLocked(ev)){ toast("This event has results now. Groups can no longer be rebuilt."); gClear(); render(); return; }
  const kept = ge.groups.filter(g => g.members.length);
  if (!kept.length){ toast("Every group is empty."); return; }
  const lonely = kept.filter(g => g.members.length < 2).map(g => g.name);
  if (lonely.length && !confirm(swText("Group " + lonely.join(", ") +
    (lonely.length === 1 ? " has" : " have") + " only one team, so nobody there plays a group match. Save anyway?"))) return;
  const names = kept.flatMap(g => g.members.map(m => m.name));
  const dupes = names.filter((n, i) => names.indexOf(n) !== i);
  if (dupes.length){ toast("Duplicate entries: " + [...new Set(dupes)].join(", ")); return; }
  if (!confirm(swText("Save these groups for " + ev.name + "? The whole schedule is redrawn from them, and the event is paused so you can start it when you are ready."))) return;
  /* Re-read before writing: a score landing on another phone while this board
     was open must not be deleted by a rebuild. render() defers while a box has
     focus, so the on-screen board can be minutes out of date. */
  const wasActive = ev.active;
  await reload();
  ev = eventById(state.adminEventId);
  if (!ev){ toast("That event is gone."); gClear(); render(); return; }
  if (groupsLocked(ev)){
    toast("A result came in while this was open, so the groups are locked. Nothing was changed.");
    gClear(); render(); return;
  }
  /* Same staleness rule for the roster itself: an entrant added on another
     phone after this board was opened is not on the board, and a rebuild
     without them would delete them. Removals made on the board stay allowed:
     the desk did those here, on purpose. */
  const knownIds = new Set((ge.baseIds || []).concat(kept.flatMap(g => g.members.map(m => m.id))));
  const newcomers = data.entrants.filter(e => e.event_id === ev.id && !knownIds.has(e.id)).map(e => e.name);
  if (newcomers.length){
    toast(swText("Teams were added while this board was open, so nothing was saved. Close the groups board and open it again.") + " " + newcomers.join(", "));
    return;
  }
  const entrants = [];
  kept.forEach((g, gi) => g.members.forEach((m, i) =>
    entrants.push({ id: m.id, event_id: ev.id, name: m.name, group_name: groupLetter(gi),
                    seed: i + 1, meta: m.meta || {} })));
  const byGroup = g => entrants.filter(e => e.group_name === g).map(e => e.id);
  const matches = buildEventMatches(ev.id,
    kept.map((g, gi) => ({ name: groupLetter(gi), entrantIds: byGroup(groupLetter(gi)) })), 0);
  const r = await store.adminReplaceEvent(state.adminPin, ev.id,
    { name: ev.name, sort_order: ev.sort_order, settings: ev.settings }, entrants, matches);
  if (!r.ok){ toast(r.error); return; }
  gClear();
  /* replace_event always pauses, which is right for a redraw but surprising
     when the event was already running: put it back rather than leaving it
     silently out of the queue. */
  if (wasActive){
    const ra = await store.adminSetActive(state.adminPin, ev.id, true);
    toast(ra.ok ? "Groups saved, schedule redrawn, event running again."
                : "Groups saved and the schedule redrawn. Press Start to put the event back in the queue.");
  } else {
    toast("Groups saved and the schedule redrawn.");
  }
  await reload();
}
function gChip(m, locked){

          '<p class="note" style="margin-top:6px">A team added now plays catch-up matches against its group at the end of the queue.</p></details>';
      }
      if (hasMatches && !state.showRedraw){
        h += '<p class="note"><button class="btn small secondary" onclick="toggleRedraw()">Start over with a new list</button></p>';
      }
    }

    h += '<div class="divider"></div><h4>3 · Start and pause</h4>';
    h += '<div class="field" style="margin-top:6px"><label for="adm-note">Schedule note (anything to add beyond the time, e.g. "finals day")</label>' +
      '<input id="adm-note" type="text" value="' + esc(evSetting(ev, "schedule_note", "")) + '"></div>';
    h += '<div class="field" style="margin-top:6px"><label for="adm-start">Planned start (the one place the time is set: every date players are shown is worked out from this)</label>' +
      '<input id="adm-start" type="datetime-local" value="' + esc(evSetting(ev, "start_time", "")) + '"></div>';
    /* Show the desk exactly what moving this time does, so nobody has to guess
       whether the labels followed it. */
    (function(){
      const d = eventStartDate(ev);
      if (!d) return;
      h += '<p class="note" style="margin:2px 0 0">Players see: &ldquo;' + esc(eventWhenLabel(ev)) + '&rdquo; on the Courts tab, and this ' +
        'event\'s schedule and standings are released ' + esc(whenText(publishTime(ev))) + '. ' +
        'Change the time above and every one of those follows.</p>';
    })();
    /* An afternoon event that starts itself lands on top of a morning still
       being played and the courts split four ways, so it is worth being able
       to say "ask me". Unticked, the desk gets a bar from five minutes before
       the planned time instead. */
    h += '<label class="check"><input type="checkbox" id="adm-autostart"' +
      (evSetting(ev, "autostart", true) === false ? '' : ' checked') +
      '> Start automatically, an hour and a quarter before the planned time</label>' +
      '<p class="note">Unticked, the desk is asked instead: a bar appears from five minutes before, with a Start button and a count of what is still being played.</p>';
    h += '<button class="btn small secondary" onclick="saveNote()">Save schedule</button>';
    /* Start and pause is the control the desk reaches for most and it used to
       sit in a row of same-sized secondary buttons, so nobody could find it.
       An event with results behind it resumes rather than starts. */
    const started = data.matches.some(m => m.event_id === ev.id && (m.status === "played" || m.court != null));
    h += '<div class="runbar">' + (ev.active
      ? '<button class="btn runbtn" onclick="setActive(false)">Pause event</button>' +
        '<span class="note">Running now. Pausing takes its matches off the courts and out of the queue; results are kept.</span>'
      : '<button class="btn runbtn" onclick="setActive(true)">' + (started ? 'Resume event' : 'Start event') + '</button>' +
        '<span class="note">' + (started
          ? 'Paused part-way through. Resuming puts its remaining matches back in the queue.'
          : 'Not started. Starting puts its matches into the court queue.') + '</span>') +
      '</div>';
    /* Starting events one at a time means the first one takes every court and
       the second waits for them to free. Starting them together lets the one
       court assignment split the courts by how much each has left to play. */
    const alsoStartable = data.events.filter(x => x.id !== ev.id && !x.active && !isHidden(x) &&
      data.matches.some(m => m.event_id === x.id && m.status === "scheduled"));
    if (!ev.active && alsoStartable.length){
      h += '<div class="field" style="margin-top:8px"><label>Start another event at the same time</label><div style="padding:2px 0 0">' +
        alsoStartable.map(x => '<label style="display:inline-flex;align-items:center;gap:5px;margin:0 14px 6px 0;font-weight:600">' +
          '<input type="checkbox" class="adm-alsostart" id="adm-alsostart-' + jsAttr(x.id) + '" value="' + jsAttr(x.id) + '"> ' + esc(x.name) + '</label>').join("") +
        '</div><p class="note" style="margin:2px 0 0">Tick these and the courts are split between all of them at once, by how many matches each has left. Start them one after the other instead and the first one fills every court.</p></div>';
    }
    h += ' <button class="btn small secondary" onclick="toggleHidden()">' +
      (isHidden(ev) ? 'Show to players again' : 'Hide from players') + '</button>';
    h += ' <button class="btn small danger" onclick="deleteEvent()">Delete event</button>';
    h += '<p class="note" style="margin-top:6px">' + (isHidden(ev)
      ? 'Hidden: players cannot see this event anywhere, but everything in it is kept and it still shows here.'
      : 'Hiding takes a test or abandoned event off every player screen without losing anything, and can be undone. Deleting is permanent and asks you to type the name.') + '</p>';
    h += '<p class="note" style="margin-top:8px">Courts are shared automatically: every free court takes the next match in line across all running events, alternating between them. Start a second event and they mix in; pause an event and its matches leave the courts and queue.</p>';

    /* Two honest ways to number the seeds, and the organiser's preference is
       not always the app's. Performance is the default: the best group winner
       is seed 1. By group letter is what a draw sheet printed in advance
       wants, and it is a stated rule rather than a hidden one. */
    h += '<div class="divider"></div><h4>4 · Seeding</h4>';
    h += '<div class="field"><label for="adm-seedorder">How bracket seeds are numbered</label>' +
      '<select id="adm-seedorder" onchange="saveSeedOrder(this.value)">' +
      '<option value="performance"' + (evSetting(ev, "seed_order", "performance") === "group" ? '' : ' selected') +
        '>By how they did: the best group winner is seed 1</option>' +
      '<option value="group"' + (evSetting(ev, "seed_order", "performance") === "group" ? ' selected' : '') +
        '>By group letter: A1 is seed 1, B1 is seed 2, then the runners-up</option>' +
      '</select></div>';
    h += '<p class="note">Either way every group winner is seeded above every runner-up, and the bracket places seed 1 at the top, seed 2 at the bottom, seed 3 in the top of the bottom half, and so on. Groups themselves are drawn by DUPR snake unless you changed it above.</p>';

    h += '<div class="divider"></div><h4>5 · Finish group stage</h4>';
    /* Nothing separated these teams and only some of them go through, so the
       bracket cannot be seeded until the desk draws. Left to itself the order
       would be alphabetical, which is not a result. */
    /* Same rule as the standings: a group still playing has not tied anything
       yet, so its warning waits until its last match is in. */
    const groupFinished = g => !data.matches.some(m => m.event_id === ev.id && m.stage === "group" &&
                                                 m.group_name === g && m.status === "scheduled");
    /* Unless seeding has just been refused over a tie: then the desk needs the
       Draw lots button for exactly the group it was stopped on, finished or
       not, or the refusal sends them to a panel with nothing on it. */
    const cutTies = (isAmericano(ev) ? [] : unresolvedTiesAtCut(ev))
      .filter(t => state.tiesForced || groupFinished(t.group));
    cutTies.forEach(t => {
      h += '<div class="gwarn">Group ' + esc(t.group) + ': ' + esc(t.names.join(", ")) +
        ' are level on wins, head to head, point difference and points scored' +
        (t.mixed ? ', and only some of them go through. ' : ', and their bracket seeding hangs on the order. ') +
        'Nothing in the rules separates them, so draw for it.' +
        '<div style="margin-top:8px"><button class="btn small" onclick="drawLots(\'' + jsAttr(t.group) + '\')">' +
        'Draw lots for group ' + esc(t.group) + '</button></div></div>';
    });
    /* A dead heat inside a seeding tier: nothing separates them and their seed
       numbers decide who meets whom, so the desk draws rather than the app
       picking. Held to the same rule as a group tie: only once the groups
       feeding it have finished, or once seeding has been refused over it. */
    const seedTies = (isAmericano(ev) ? [] : seedTiesFor(ev))
      .filter(() => state.tiesForced || groupsOfEvent(ev).every(groupFinished));
    seedTies.forEach(t => {
      h += '<div class="gwarn">' + esc(t.names.join(", ")) + ' finished ' + ordinal(t.place) +
        ' in their groups and are level on every measure that decides seeding, so their ' +
        'places in the bracket are not earned. Draw for it.' +
        '<div style="margin-top:8px"><button class="btn small" onclick="drawSeedLots(' + t.place + ')">' +
        'Draw lots for the ' + ordinal(t.place) + ' places</button></div></div>';
    });
    const wcTie = isAmericano(ev) ? null : wildcardTieFor(ev);
    if (wcTie)
      h += '<div class="gwarn">A best-next-placed wildcard place is tied between ' + esc(wcTie.names.join(", ")) +
        ' on every cross-group measure, so the pick shown is alphabetical, not earned. ' +
        'Settle it at the desk and use Edit teams on the bracket if the wrong side is in.</div>';
    /* Lots already drawn can be undone: the promise on the standings is that
       a draw can be re-done, and clearing is how. */
    const lotGroups = [...new Set(data.entrants
      .filter(e => e.event_id === ev.id && e.group_name &&
        groupLotKeys(ev, e.group_name).some(k => lotsOf(e)[k] != null))
      .map(e => e.group_name))].sort();
    lotGroups.forEach(g => {
      h += '<p class="note">Group ' + esc(g) + ' was settled by drawn lots. ' +
        '<button class="btn small secondary" onclick="clearLots(\'' + jsAttr(g) + '\')">Clear the drawn lots</button></p>';
    });
    if (koCount){
      /* Auto-seeding is one-shot, so a group score corrected afterwards changes
         the standings while the bracket keeps the old qualifiers. Nothing used
         to say so, and the desk has no reason to suspect it. */
      /* Compared as PAIRINGS, not as a sorted id set: a correction that keeps
         the same qualifiers but reshuffles who plays whom is just as stale,
         and the old set comparison could not see it. */
      const fieldNow = seedFieldFor(ev);
      const should = bracketPairs(fieldNow.seeds)
        .map(p => [p[0], p[1]].map(s => s ? s.entrantId : "bye").sort().join("+")).join("|");
      const inBracket = data.matches
        .filter(m => m.event_id === ev.id && m.stage === "knockout" && m.bracket_round === 1)
        .sort((a, b) => (a.bracket_pos || 0) - (b.bracket_pos || 0))
        .map(m => [m.entrant1_id || "bye", m.entrant2_id || "bye"].sort().join("+")).join("|");
      const koPlayed = data.matches.some(m => m.event_id === ev.id && m.stage === "knockout" && m.status === "played");
      if (should && inBracket && should !== inBracket)
        h += '<div class="gwarn">The standings have changed since this bracket was drawn, so it no longer matches who qualified. ' +
          (koPlayed ? 'Knockout matches have already been played, so check before rebuilding.'
                    : 'Rebuild it from the current standings.') + '</div>';
      h += '<p class="note">Knockout bracket is live (' + koCount + ' matches).</p>' +
        '<button class="btn small secondary" onclick="confirmGroupStage()">Redo bracket from standings</button> ' +
        '<button class="btn small secondary" onclick="resetBracket()">Back to group stage</button>';
    } else {
      h += '<p class="note">' + (groupLeft ? groupLeft + ' group matches still unplayed. ' : 'Group play is complete. ') +
        'Check the projected matchups on the Bracket tab, then confirm to create the knockout.</p>' +
        '<button class="btn small' + (groupLeft ? ' secondary' : '') + '" ' + (hasMatches ? '' : 'disabled') + ' onclick="confirmGroupStage()">Confirm group stage finished</button>';
    }

    h += '<div class="divider"></div><h4>6 · Export results</h4>';
    h += '<p class="note">One row per played match, players split out of team names, one column pair per game. Made to copy into DUPR\'s club "Import Matches via CSV" template (download that template from the DUPR club dashboard; it wants each player\'s DUPR ID, so collect those with the roster).</p>';
    h += '<button class="btn small secondary" onclick="downloadResults(false)">Download this event (CSV)</button> ' +
      '<button class="btn small secondary" onclick="downloadResults(true)">Download all events (CSV)</button>';
    h += (function(){
      const bk = readBackup();
      return '<p class="note" style="margin-top:10px">Offline backup on this phone: ' +
        (bk ? bk.played + ' played matches, saved ' +
          new Date(bk.taken_at).toLocaleString(state.lang === "sw" ? "sw" : [], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) +
          '. <button class="btn small secondary" onclick="downloadBackup()">Download backup (JSON)</button> ' +
          '<button class="btn small secondary" onclick="clearBackup()">Clear backup</button>'
        : 'none yet (a snapshot is kept automatically every 25 played matches).') +
        '<br>Every phone with the page open keeps its own copy, so a wiped database can be rebuilt from any of them.</p>';
    })();
    h += '</div>';
  }

  /* Kept as its own panel rather than buried in an event's settings: it is a
     tournament-wide decision the desk makes once, usually in a hurry. */
  h += '<div class="panel"><h3>Score entry</h3>';
  h += '<p class="note">Players enter their own result from the Courts tab while their match is on a court, once per match. ' +
    'The server already refuses anything not on a court, refuses a second entry, and refuses more entries in five minutes than there are courts. ' +
    'If that is not enough on the day, take it off them entirely and run every score through the desk.</p>';
  h += '<label class="check"><input type="checkbox" id="adm-playerscores"' + (playerScoresOn() ? ' checked' : '') +
    ' onchange="setPlayerScores(this.checked)"> Let players enter their own scores</label>';
  if (!playerScoresOn())
    h += '<p class="note" style="color:var(--warn);font-weight:700">Off: players are told to report at the desk. Every score comes through an unlocked admin phone.</p>';
  h += '</div>';

  /* Tournament-wide and read by the wind-down trigger, so it belongs with the
     other one-off decisions rather than inside any single event. */
  h += '<div class="panel"><h3>Finals</h3>';
  h += '<p class="note">With this ticked, a running event that has nothing left but its final and its third place match is treated as finished when deciding whether to bring the next batch on. Untick it if finals are being played the same day as their groups.</p>';
  h += '<label class="check"><input type="checkbox" id="adm-finalssunday"' + (finalsSundayOn() ? ' checked' : '') +
    ' onchange="setFinalsSunday(this.checked)"> Finals and third place are played on the last day</label>';
  h += '</div>';

  h += '<div class="panel"><h3>Admin powers on the other tabs</h3><p class="note">' +
    'While unlocked: tap any match anywhere (Courts, Schedule, a team in Standings, or the Bracket) to fix or clear its score, enter a walkover, or postpone. ' +
    'Players can only enter a score while a match is on a court; admins can score anything from anywhere. ' +
    'An on-court match can be sent back with "Take off court": either the next match in line takes its court, or you pick the one to bring on. ' +
    'Pause the finished event: with nothing running, the Courts tab previews the next batch\'s courts (the tournament\'s opening events a day ahead, every later batch from 12 hours before its start). ' +
    'Every waiting row has a "Move to…" picker: choose the match it should go in front of, or send it to the back. Postponed matches also keep Play next. ' +
    'On a "go to court" banner, ✓ On court dismisses it for everyone; a plain tap hides it only on that phone. ' +
    'On the Bracket tab, unplayed matches have an Edit teams link for manual fixes. ' +
    'Everything updates live on everyone\'s phone.</p></div>';

  if (store.mode === "live"){
    /* autocomplete and a name on both boxes: two unnamed type=password inputs
       on one page read to a browser as a change-password form, and a password
       manager will helpfully fill them with a saved site password, so the desk
       submits something nobody typed and gets "Wrong PIN." inputmode numeric
       puts a number pad on a phone, which is what a PIN wants. */
    h += '<div class="panel"><h3>Change PIN</h3><div class="fieldrow">' +
      '<div class="field"><label for="adm-oldpin">Current PIN</label>' +
      '<input id="adm-oldpin" name="nairobi-current-pin" type="password" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false"></div>' +
      '<div class="field"><label for="adm-newpin">New PIN</label>' +
      '<input id="adm-newpin" name="nairobi-new-pin" type="password" inputmode="numeric" autocomplete="new-password" autocorrect="off" spellcheck="false"></div></div>' +
      '<button class="btn small secondary" onclick="doChangePin()">Change PIN</button>' +
      '<p class="note" id="adm-pinmsg" style="margin:6px 0 0"></p></div>';
  }
  h += '<p style="margin-top:6px"><button class="btn secondary small" onclick="adminSignOut()">Sign out of admin</button></p>';
  return h;
}

/* ---------- modals ---------- */
/* Off only when the desk has deliberately switched it off; anything missing or
   malformed means players enter their own scores, which is the normal day. */
const playerScoresOn = () => !(data.tournament && data.tournament.settings &&
  data.tournament.settings.player_scores === false);

function renderScoreModal(){
  if (!state.modalMatchId) return "";
  const m = data.matches.find(x => x.id === state.modalMatchId);
  if (!m) return "";
  const n1 = entrantName(m.entrant1_id) || "TBD", n2 = entrantName(m.entrant2_id) || "TBD";
  const played = m.status === "played" && m.score1 != null;
  const isAdmin = !!state.adminPin;
  /* Players can only enter scores for matches currently on a court; everything
     else is read-only for them (admins can score any match from anywhere). */
  const onCourt = m.status === "scheduled" && m.court != null;
  /* The desk can take score entry back off the players for the rest of the
     day. An on-court match is still worth opening then, to see who is on and
     what it is played to, but the boxes go away rather than sitting there
     collecting a result the server is going to refuse. */
  const deskOnly = !isAdmin && !played && onCourt && !playerScoresOn();
  const infoOnly = !isAdmin && !played && (!onCourt || deskOnly);
  const pts = matchPts(m);
  const bo = matchBestOf(m);
  const ev = eventById(m.event_id);

  let h = '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">';
  h += '<h3>' + (played ? 'Match result' : deskOnly ? 'Report at the desk' : infoOnly ? 'Upcoming match' : 'Enter score') + '</h3>';
  h += '<div class="sub">' + esc(ev ? ev.name : '') + ' · ' + esc(roundName(m)) + (m.court != null && !played ? ' · Court ' + m.court : '') +
    ' · ' + (matchSumTo(m)
      ? 'scores add up to ' + matchSumTo(m)
      : (bo > 1 ? 'best of ' + bo + ', games' : 'first') + ' to ' + pts + (matchWinBy2(m) ? ', win by 2' : '')) + '</div>';

  const adminExtras = () => {
    let x = '';
    if (isAdmin && m.status === "scheduled"){
      /* Americano matches rotate through their own pool; taking one off would
         hand its court number to a main-draw replacement. */
      if (m.court != null && !isAmericano(eventById(m.event_id)))
        x += '<button class="btn small secondary" onclick="openOffCourt(\'' + m.id + '\')">Take off court</button>';
    }
    if (isAdmin && played) x += '<button class="btn small danger" onclick="clearScore(\'' + m.id + '\')">Clear score</button>';
    return x;
  };
  const walkoverRow = () => {
    if (!isAdmin || !m.entrant1_id || !m.entrant2_id) return '';
    return '<p class="note" style="margin-top:10px">No-show? Record a walkover win:</p>' +
      '<div class="actions" style="margin-top:4px">' +
      '<button class="btn small secondary" onclick="walkover(\'' + m.id + '\', 1)">W/O · ' + esc(n1) + '</button>' +
      '<button class="btn small secondary" onclick="walkover(\'' + m.id + '\', 2)">W/O · ' + esc(n2) + '</button></div>';
  };
  /* A retirement is not a no-show: they played, so the score boxes above are
     filled in as far as the match got and these buttons say who stopped. The
     rest of the game in progress goes to the opponent and the completed games
     stand, points and all. */
  const retireRow = () => {
    if (!isAdmin || !m.entrant1_id || !m.entrant2_id) return '';
    return '<p class="note" style="margin-top:10px">Someone had to stop mid-match? Fill in the score as it stood, then say who retired:</p>' +
      '<div class="actions" style="margin-top:4px">' +
      '<button class="btn small secondary" onclick="retire(\'' + m.id + '\', 1)">Ret. · ' + esc(n1) + '</button>' +
      '<button class="btn small secondary" onclick="retire(\'' + m.id + '\', 2)">Ret. · ' + esc(n2) + '</button></div>';
  };
  /* Every change to this score, for everyone. The desk being seen to change a
     score is what settles the argument; a silent correction is what starts it. */
  const historyRow = () => {
    const log = matchLog(m.id);
    if (!log.length) return '';
    /* Built in both languages here rather than through the dictionary: too many
       moving parts for a text-node pattern to match cleanly, which is the same
       reason the wait estimate builds its own sentence. */
    const sw = state.lang === "sw";
    const line = e => {
      const when = e.at ? new Date(e.at).toLocaleTimeString(sw ? "sw" : [], { hour: "numeric", minute: "2-digit" }) : "";
      const who = sw ? (e.by_desk ? "meza" : "wachezaji") : (e.by_desk ? "the desk" : "the players");
      if (e.action === "clear") return when + " · " + (sw ? "imefutwa na " + who : "cleared by " + who);
      if (!e.from_text)
        return when + " · " + (sw ? "imewekwa na " + who + " kama " + e.to_text : "entered by " + who + " as " + e.to_text);
      return when + " · " + (sw
        ? "imebadilishwa na " + who + " kutoka " + e.from_text + " hadi " + e.to_text
        : "changed by " + who + " from " + e.from_text + " to " + e.to_text);
    };
    return '<details class="hist"' + (log.length > 1 ? ' open' : '') + '>' +
      '<summary>' + (log.length > 1 ? 'This score was changed' : 'Score history') + '</summary>' +
      log.map(e => '<div class="histline">' + esc(line(e)) + '</div>').join("") + '</details>';
  };

  if (played && !isAdmin){
    h += '<div class="score-line"><label>' + esc(n1) + '</label><span style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums">' + m.score1 + '</span></div>';
    h += '<div class="score-line"><label>' + esc(n2) + '</label><span style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums">' + m.score2 + '</span></div>';
    const gs = gamesStr(m);
    if (gs) h += '<p class="note">Games: ' + esc(gs) + '</p>';
    if (m.walkover) h += '<p class="note">Walkover.</p>';
    if (m.retired) h += '<p class="note">' + esc(entrantName(m.retired)) + ' retired. The games they finished stand and count.</p>';
    h += historyRow();
    h += '<p class="note">Score already recorded. Spot a mistake? Ask at the desk and an organizer can fix it.</p>';
    h += '<div class="actions"><span class="spacer"></span><button class="btn secondary" onclick="closeModal()">Close</button></div>';
  } else if (infoOnly){
    h += '<div class="score-line"><label>' + esc(n1) + '</label></div>';
    h += '<div class="score-line"><label>' + esc(n2) + '</label></div>';
    if (deskOnly){
      h += '<p class="note" style="font-weight:700">The desk is entering all scores today. ' +
        'Play the match and report the result at the desk.</p>';
      h += '<div class="actions"><span class="spacer"></span><button class="btn secondary" onclick="closeModal()">Close</button></div>';
      h += '</div></div>';
      return h;
    }
    if (ev){
      let est = '';
      if (ev.active){
        const w = estimatedWaitMinutes(m);
        /* A team near the front should hear "stay put", not a countdown. The
           estimate prices a full game on every court, so a fresh round reads
           as twenty minutes to whoever is next on, and people wander off. The
           number only helps the teams far enough back to have time to use it. */
        const busy = busyPlayerNames();
        if (blockedByCourt(m, busy)){
          est = 'This match waits until both teams are off court.';
        } else {
          /* "Next" means next among the matches that could actually be called:
             at a round boundary the head of the queue is the teams still
             playing, and they were the ones being told to stand by. */
          const callable = pendingQueue().filter(x => !blockedByCourt(x, busy));
          const nextUp = callable.findIndex(x => x.id === m.id);
          if (nextUp === 0 || (w != null && w <= 12)) est = 'You are next. Stay by the courts.';
          else if (w != null) est = w <= 2 ? 'Up any moment now.' : 'Estimated wait: ' + fmtWaitMin(w) + '.';
        }
      } else {
        const t = estimatedStartTime(m, ev);
        if (t) est = 'Estimated play time: around ' +
          t.toLocaleString(state.lang === "sw" ? "sw" : [], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) + '.';
      }
      if (m.held) est = 'Held at the desk. This match is out of the queue until the desk puts it back.';
      if (est) h += '<p class="note" style="font-weight:700">' + est +
        ' <span style="font-weight:400">(rough, updates as matches finish)</span></p>';
    }
    h += '<p class="note">' + (m.postponed ? 'Postponed: waiting lower in the queue.' : 'Waiting for a court.') +
      ' When the match is called, it appears on the Courts tab and the score can be entered. Anything wrong? Ask at the desk.</p>';
    h += '<div class="actions"><span class="spacer"></span><button class="btn secondary" onclick="closeModal()">Close</button></div>';
  } else if (bo > 1){
    h += '<div class="game-line"><span class="glabel"></span><span style="flex:1;font-size:12px;font-weight:700;color:var(--muted);overflow-wrap:anywhere">' + esc(n1) + '</span><span style="flex:1;font-size:12px;font-weight:700;color:var(--muted);overflow-wrap:anywhere;text-align:right">' + esc(n2) + '</span></div>';
    for(let g = 1; g <= bo; g++){
      const pre = played && m.games && m.games[g - 1] ? m.games[g - 1] : null;
      h += '<div class="game-line"><span class="glabel">Game ' + g + '</span>' +
        '<input class="score-in" id="g' + g + 'a" type="number" inputmode="numeric" min="0" value="' + (pre ? pre[0] : '') + '" style="flex:1">' +
        '<input class="score-in" id="g' + g + 'b" type="number" inputmode="numeric" min="0" value="' + (pre ? pre[1] : '') + '" style="flex:1"></div>';
    }
    h += '<div class="err" id="score-err"></div>';
    h += '<p class="note">Fill games in order and leave unplayed games blank. First to ' + (Math.floor(bo / 2) + 1) + ' game wins takes the match.</p>';
    if (!isAdmin) h += '<p class="note">One entry per match: after that, corrections go through the desk.</p>';
    h += '<div class="actions">' + adminExtras() +
      '<span class="spacer"></span><button class="btn secondary" onclick="closeModal()">Close</button>' +
      '<button class="btn" onclick="saveScore(\'' + m.id + '\')">' + (isAdmin ? 'Save (admin)' : 'Save score') + '</button></div>';
    h += walkoverRow() + retireRow() + historyRow();
  } else {
    h += '<div class="score-line"><label for="score1">' + esc(n1) + '</label><input class="score-in" id="score1" type="number" inputmode="numeric" min="0" value="' + (played ? m.score1 : '') + '"></div>';
    h += '<div class="score-line"><label for="score2">' + esc(n2) + '</label><input class="score-in" id="score2" type="number" inputmode="numeric" min="0" value="' + (played ? m.score2 : '') + '"></div>';
    if (m.retired) h += '<p class="note">' + esc(entrantName(m.retired)) + ' retired. The games they finished stand and count.</p><p class="note">To change this result, clear the score first.</p>';
    h += '<div class="err" id="score-err"></div>';
    if (!isAdmin) h += '<p class="note">Winners report the score. One entry per match: after that, corrections go through the desk.</p>';
    h += '<div class="actions">' + adminExtras() +
      '<span class="spacer"></span><button class="btn secondary" onclick="closeModal()">Close</button>' +
      '<button class="btn" onclick="saveScore(\'' + m.id + '\')">' + (isAdmin ? 'Save (admin)' : 'Save score') + '</button></div>';
    h += walkoverRow() + retireRow() + historyRow();
  }
  h += '</div></div>';
  return h;
}

function renderTeamModal(){

  const e = entrantById(state.teamModalId);
  if (!e) return "";
  const ev = eventById(e.event_id);

    .filter(m => (m.entrant1_id === e.id || m.entrant2_id === e.id))
    .sort((a, b) => (a.stage === b.stage ? a.play_order - b.play_order : a.stage === "group" ? -1 : 1));
  let w = 0, l = 0;
  ms.forEach(m => {
    if (m.status !== "played" || m.score1 == null) return;
    const mine = m.entrant1_id === e.id ? m.score1 : m.score2;

  h += ms.map(m => {
    const opp = entrantName(m.entrant1_id === e.id ? m.entrant2_id : m.entrant1_id);

      const gs = gamesStr(m);
      res = '<span class="tmres ' + (mine > theirs ? 'w' : 'l') + '">' + (mine > theirs ? 'W' : 'L') + ' ' + mine + '-' + theirs +
        (m.walkover ? ' <span class="tmgames">W/O</span>' : '') +

      res = '<span class="tmres pending">Court ' + m.court + '</span>';

      res = '<span class="tmres pending">Postponed</span>';
